name: merge-tier
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: node scripts/validate-contracts.mjs
      - run: node scripts/validate-coverage.mjs
      - name: api/1 — `mcp:` operation-tag curation (API-070/071/072)
        run: node scripts/validate-mcp-tags.mjs
      - name: every published error code is implemented or explained
        run: node scripts/validate-error-codes.mjs
      - run: node scripts/check-public-hygiene.mjs
      - name: ui-schema/1 — automation-builder fixture-lint
        run: node conformance/fixtures/fixture-lint.mjs
      - name: ui-schema/1 — web renderer corpus driver (vitest)
        working-directory: web
        run: |
          npm ci
          npm run test
      - run: node --test 'scripts/**/*.test.mjs'
      - name: api/1 — OpenAPI 3.1 validity
        run: npx --yes @redocly/cli@2.39.0 lint api/openapi.yaml
      - name: player/1 — player-v3 BrightScript validation
        run: npx --yes brighterscript@0.73.0 --project player-v3/bsconfig.json
      - name: api/1 — TS codegen (generate, drift check, typecheck)
        working-directory: scripts/codegen
        run: |
          npm ci --ignore-scripts
          npm run generate:ts
          git diff --exit-code -- ../../api/gen/ts
          npm run typecheck
      - name: api/1 — Go codegen (generate, drift check, vet)
        run: |
          go tool oapi-codegen -config scripts/codegen/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code -- api/gen/go
          go build ./...
          go vet ./...
      - name: no new unreachable Go code
        run: node scripts/validate-deadcode.mjs
      - name: Go unit tests (incl. internal/virtualplayer's software first-photon)
        run: go test ./...
      # conformance suites append here as they exist
      - name: conformance — player/1 + relay/1 executable drivers (§10 differential oracle vs. the live stack)
        run: go test ./conformance/drivers/... -v
      # Under -race as well, because a driver is not ordinary test scaffolding:
      # every `covered` row in the traceability tables rests on what a driver
      # observed. A harness that races the code it is measuring can read a
      # partial result and still report PASS, which is a verdict that is not
      # reproducible for the right reason. One such race lived here undetected
      # precisely because this step ran without the flag.
      - name: conformance — the same drivers under the race detector
        run: go test -race -count=1 ./conformance/drivers/...
      # Chromium is ~400MB and the only real cost in the lane below (~5s of
      # actual testing). Keyed on the runner and the pinned @playwright/test
      # version, so a version bump misses the cache deliberately rather than
      # running a browser the lockfile no longer names.
      - name: cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      # The browser lane, merge-tier and not pr-tier on purpose.
      #
      # It is here at all because it was in NO tier, and that is how it stayed
      # red: its one unauthenticated request threw in a `beforeAll`, so of five
      # test cases one failed and three never ran — for days, with every other
      # gate green. A lane no tier runs is a lane nobody reads.
      #
      # Not pr-tier yet: it drives a real browser against two real processes
      # over loopback HTTPS with timing-sensitive polls. It has been green on
      # every run since the fix, which is encouraging and not yet a dataset.
      # merge-tier blocks no one while still attributing a failure to the merge
      # that caused it; promote it once there are weeks of green behind it.
      #
      # Not nightly, twice over: that lane is deliberately Node-only with no Go
      # toolchain, and a nightly-only lane is precisely the unread lane this
      # step exists to stop being.
      #
      # `make web-e2e` brings the stack up and down itself and writes only to
      # gitignored paths, so it is safe beside the drift checks above.
      - name: web — console click-through and pairing (real browser, real stack)
        run: |
          # Installed from web/, NOT the repo root. There is no @playwright/test
          # at the root, so a root `npx` fetches the LATEST Playwright and
          # installs browsers for that revision — then `make web-e2e` runs
          # web/'s pinned version and cannot find the binary it expects. That
          # exact mismatch turned this lane red on its first run:
          # "Executable doesn't exist at .../chromium_headless_shell-1228".
          npm --prefix web exec -- playwright install --with-deps chromium
          make web-e2e
