openapi: 3.1.0
jsonSchemaDialect: "https://spec.openapis.org/oas/3.1/dialect/base"
info:
  title: Management API
  version: 1.0.0
  summary: The versioned management API — the single door every client (web UI, CLI, MCP server) uses to read and change platform state.
  description: >-
    This document is the source of truth every generated client (TypeScript
    for the web UI, Go for the CLI and MCP server) is produced from. Every
    operation lives under the `/api/v1` prefix. Cross-cutting conventions
    (error shape, optimistic concurrency, pagination, idempotency, trace
    propagation, MCP tag curation, the label-selector grammar, and the
    evolution policy) are specified normatively in `contracts/api-1.md`;
    this document implements those conventions as reusable components and
    applies them to every operation below. `scope-nodes` and `automations`
    are worked fully end to end (schemas, every verb, every error response);
    the remaining operations are SHAPE stubs — path, summary, tag and
    parameters, with the response schema reserved for a later minor.

    Every operation below is served by a real handler, and every route the
    server mounts appears below: the two sets are diffed against each other
    on every build (`internal/app/api`'s surface test), so this document
    cannot promise a generated client an operation that 404s, and a handler
    cannot be added that no client can discover and no schema constrains.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: "/api/v1"
    description: Same-origin deployment — the app serves the web UI and this API on one origin; the CLI and MCP server address it over the network binding.
tags:
  - name: auth
    description: >-
      Session issuance and revocation, the first-boot workspace claim, and
      credential reset. THREE operations here are credential-exchange
      operations declaring `security: []` (API-090/091) — `login`, `setup`
      and `redeemCredentialReset` — because each has a caller who by
      definition holds no session: one presenting credentials to get one, one
      claiming a box that has no principal at all, and one locked out of the
      credential being replaced. Everything else in this family, `logout` and
      `session` included, is an ordinary authenticated operation.
  - name: scope-nodes
    description: The org → site → group → screen tree every resource and durable event attaches to. Worked fully.
  - name: screens
    description: >-
      A screen's own identity row (`data-model/1` DAT-004/DAT-004a) — the row a
      `screen_id` names. Deliberately NOT the `screen`-kind scope node it is
      placed under: DAT-004 lets a screen row hang off a node of any kind, so
      two screens may share one node and a screen may sit directly under a
      site. Worked fully.
  - name: adopted-devices
    description: >-
      The adopted-device rows the app peer compiles into a relay's desired-state
      `device_inventory` section (`relay/1` REL-063) — a device's driver, native
      identity, poll cadence, and the per-entity enabled/hidden/display-name/
      category policy. Authored here, unlike the `devices` family below: the
      relay is authoritative for what its LAN CONTAINS and reports candidates
      upward (REL-110/111), while adoption and the policy over it are decisions
      no discovery sweep can report. Worked fully.
  - name: devices
    description: >-
      The device registry — the adopted physical devices behind each site's
      relay. Read-only in this minor: a device enters the registry through the
      relay's own discovery and adoption plane (`relay/1` Device plane), not
      through an authoring write here. Discovery and adoption operations are a
      later minor.
  - name: entities
    description: >-
      The entity registry and state (device-plane objects; see rules/1 for
      automation semantics over entities). Read-only in this minor, plus the
      command operation — `relay/1` REL-112 addresses a device operation by a
      single already-resolved `entity_id`, so an entity, not a device, is what a
      command is sent to.
  - name: automations
    description: Rules — triggers, conditions, actions, and modes (rules/1 defines the vocabulary; this API manages the resource envelope around it). Worked fully.
  - name: schedules
    description: >-
      The scheduling core's schedule rows (`data-model/1`) — the container a
      daypart hangs off and the applicability cascade resolves against. Served
      end to end; the resource schema is a later minor.
  - name: dayparts
    description: >-
      The scheduling core's daypart rows (`data-model/1`) — a schedule's
      day-of-week/time windows and the playlist each one plays. Served end to
      end; the resource schema is a later minor.
  - name: playlists
    description: >-
      The scheduling core's playlist rows (`data-model/1`) — the ordered item
      list a daypart plays, whose `asset_ref`s must resolve in the content
      origin. Served end to end; the resource schema is a later minor.
  - name: content
    description: >-
      The content-addressed asset origin — the upload that puts bytes behind an
      `asset_ref` a playlist item can name. Served; the request/response schema
      is a later minor.
  - name: packs
    description: >-
      Installed declarative packs (`manifest/1`): the install/list/read/delete
      lifecycle, a pack's rendered pages and message catalogs
      (`ui-schema/1`), and CRUD over the rows of a collection the pack
      declares. Served end to end; the resource schemas are a later minor.
  - name: jobs
    description: >-
      The async Job resource a fleet-mutating or otherwise
      not-synchronously-completable operation returns via `202 Accepted`;
      see `contracts/api-1.md#fleet-mutating-operations--the-job-resource`.
      Path stub beyond the representative flows that return one.
  - name: workspace
    description: >-
      Workspace-level data-subject export and delete; see
      `contracts/api-1.md#data-subject-export--delete`. Specced; full
      data-subject-request workflow tooling is a deferred implementation.
  - name: webhook-endpoints
    description: >-
      Registration of outbound webhook endpoints — the URL a durable event is
      POSTed to, the schemas it subscribes to, and its scope-node placement.
      `events/1` EVT-150 defines the delivery mechanics given a registered
      endpoint and explicitly defers the registration resource itself to this
      contract. An endpoint's signing secret is never a member of its
      representation: it is installed and rotated through its own operation and
      appears in no response body.
  - name: "mcp:read"
    description: Curation tag — every operation carrying this tag is exposed as a non-mutating MCP tool. Not a resource family; see `contracts/api-1.md#mcp-operation-tag-curation`.
  - name: "mcp:act"
    description: Curation tag — every operation carrying this tag is exposed as a mutating MCP tool and requires the Idempotency-Key discipline. Not a resource family; see `contracts/api-1.md#mcp-operation-tag-curation`.
security:
  - SessionCookie: []
  - ApiKey: []
paths:
  # ---------------------------------------------------------------------
  # scope-nodes — exemplar #1, worked fully end to end.
  # ---------------------------------------------------------------------
  /scope-nodes:
    get:
      operationId: listScopeNodes
      summary: List scope nodes
      description: Returns a keyset-paginated, selector-filterable page of scope nodes.
      tags: [scope-nodes, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of scope nodes.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createScopeNode
      summary: Create a scope node
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeNodeCreate"
      responses:
        "201":
          description: The created scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /scope-nodes/{scope_node_id}:
    parameters:
      - name: scope_node_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getScopeNode
      summary: Read a scope node
      tags: [scope-nodes, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScopeNode
      summary: Update a scope node
      description: Partial update. Requires If-Match against the scope node's current ETag/revision.
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeNodeUpdate"
      responses:
        "200":
          description: The updated scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteScopeNode
      summary: Delete a scope node
      description: >-
        Requires If-Match against the scope node's current ETag/revision.
        Refused 409 when the node still carries a child node
        (`SCOPE_NODE_NOT_EMPTY`), is still named as another row's `scope_node`
        (`SCOPE_NODE_IN_USE`), or is the tree's org-kind root, which no
        ordinary write may remove (`SCOPE_NODE_ORG_UNDELETABLE`) —
        `contracts/data-model-1.md` DAT-020/021/022. The org refusal precedes
        the If-Match precondition: no revision makes it deletable.
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  # ---------------------------------------------------------------------
  # automations — exemplar #2, worked fully end to end.
  # ---------------------------------------------------------------------
  /automations:
    get:
      operationId: listAutomations
      summary: List automations
      description: Returns a keyset-paginated, selector-filterable page of automations (rules).
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of automations.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createAutomation
      summary: Create an automation
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationCreate"
      responses:
        "201":
          description: The created automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /automations/{automation_id}:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getAutomation
      summary: Read an automation
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAutomation
      summary: Update an automation
      description: Partial update. Requires If-Match against the automation's current ETag/revision.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdate"
      responses:
        "200":
          description: The updated automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteAutomation
      summary: Delete an automation
      description: Requires If-Match against the automation's current ETag/revision.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /automations/{automation_id}/run:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: runAutomation
      summary: Run an automation now
      description: >-
        Manually starts one run of the automation's action sequence, subject
        to its declared mode's normal mode-evaluation rules. A mutating POST
        outside plain resource creation — accepts Idempotency-Key so a
        client's retry-on-timeout cannot double-fire the run.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRunRequest"
      responses:
        "200":
          description: The run was accepted; the response carries its mode-evaluation disposition.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /automations/bulk-enable:
    post:
      operationId: bulkEnableAutomations
      summary: Enable or disable a selector-matched set of automations
      description: >-
        Fleet-mutating operation
        (`contracts/api-1.md#fleet-mutating-operations--the-job-resource`):
        targets every automation the selector matches, accepts the same
        label-selector grammar a list operation does as its target
        predicate, and returns 202 with a Job resource rather than
        blocking until every target finishes.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationBulkEnableRequest"
      responses:
        "202":
          description: Accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------
  # devices + entities — the device plane's read surface and its one
  # mutating operation, the command a relay executes against a physical
  # device (relay/1 Device plane, REL-112/113).
  #
  # Both families are read-only here: a device and its entities enter the
  # registry through the relay's own discovery and adoption plane, never
  # through an authoring write on this API, so neither declares a create,
  # update, or delete. Adoption operations are a later minor, additive to
  # these paths.
  # ---------------------------------------------------------------------
  /devices:
    get:
      operationId: listDevices
      summary: List devices
      description: >-
        Returns a keyset-paginated, selector-filterable page of the adopted
        physical devices behind this deployment's relays.
      tags: [devices, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of devices.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /entities:
    get:
      operationId: listEntities
      summary: List entities and their current state
      description: >-
        Returns a keyset-paginated, selector-filterable page of entities —
        the addressable device-plane objects a device exposes, and the
        targets `rules/1` entity references and this API's command
        operation resolve to.
      tags: [entities, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of entities.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /entities/{entity_id}/commands:
    parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: sendEntityCommand
      summary: Send a command to an entity
      description: >-
        Dispatches one device command to the entity's owning relay over that
        relay's existing persistent connection and returns the relay's own
        correlated result (`relay/1` REL-112). The command is addressed to a
        single already-resolved entity: `relay/1` accepts no selector or
        device-class filter, so fanning a command across a set is a client's
        (or `rules/1`'s) concern, not this operation's.


        The exchange completes within this request/response cycle — the
        relay answers on the same connection — so this operation returns its
        result synchronously rather than the `202 Accepted` plus Job that
        `contracts/api-1.md#fleet-mutating-operations--the-job-resource`
        requires of work that cannot complete in-cycle.


        A mutating POST tagged `mcp:act`, so it accepts `Idempotency-Key`: a
        client's retry-on-timeout replays the retained result rather than
        firing the command at the physical device a second time.
      tags: [entities, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityCommandRequest"
      responses:
        "200":
          description: >-
            The relay answered. `ok` reports whether the command succeeded
            against the physical device; a refusal the relay typed itself
            (an undeclared command, an unreachable device) rides `error`.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------
  # jobs — the async Job resource a fleet-mutating or otherwise
  # not-synchronously-completable operation returns via 202 Accepted
  # (contracts/api-1.md#fleet-mutating-operations--the-job-resource).
  # ---------------------------------------------------------------------
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getJob
      summary: Read a Job resource
      description: A client polls this operation until the returned Job's `state` reaches a terminal value.
      tags: [jobs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The job.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------
  # workspace — data-subject export/delete, specced at the shape level
  # (contracts/api-1.md#data-subject-export--delete). Both return 202 with
  # a Job resource, exactly like a fleet-mutating operation, since neither
  # completes within its own request/response cycle. Neither takes a
  # selector: API-123 makes each operation's target the workspace itself,
  # implicit in the request path, so API-110's selector convention does not
  # apply.
  # ---------------------------------------------------------------------
  /workspace/export:
    post:
      operationId: exportWorkspace
      summary: Export the workspace as a portable archive
      description: >-
        Data-subject export operation
        (`contracts/api-1.md#data-subject-export--delete`). API-121 makes
        this the API-facing trigger for the container `archive/1` defines,
        not a second export format: the Job's success means exactly that
        container now exists for this workspace. Owner-role only — an
        export carries the whole workspace, so no scope-node-narrowed role
        can invoke it. A fuller data-subject-request workflow (intake and
        tracking for a request arriving outside this API) is the deferred
        implementation API-124 names.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceExportRequest"
      responses:
        "202":
          description: Export accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /workspace/delete:
    post:
      operationId: deleteWorkspace
      summary: Erase the workspace's data via key-material destruction
      description: >-
        Data-subject delete operation
        (`contracts/api-1.md#data-subject-export--delete`). API-122 routes
        it to the workspace's key-material destruction path
        (`security-model.md` SEC-121) — this IS that destruction, not a
        separate deletion mechanism. It is irreversible: owner-role only,
        and the body MUST name the workspace being destroyed
        (`confirm_workspace_id`), so no single blind request can erase a
        deployment. A fuller data-subject-request workflow is the deferred
        implementation API-124 names.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeleteRequest"
      responses:
        "202":
          description: Deletion accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------
  # Tagged stubs — path + summary + tag only; full shapes land in a later
  # minor (additive, per contracts/api-1.md's evolution policy).
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a session
      description: >-
        Credential-exchange operation
        (`contracts/api-1.md#security-override-convention`, API-090/091):
        authenticates the request from credentials in the body, not a
        pre-existing session or API key. On success it sets a host-only
        session cookie (`security-model.md` SEC-023) and a companion,
        script-readable CSRF cookie whose value every mutating request must
        echo in `X-CSRF-Token` (SEC-024). Repeated failures lock the
        presented credential per source-IP class with exponential backoff
        (SEC-090, `CREDENTIAL_LOCKED`).
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session the presented credentials minted.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
            Set-Cookie:
              description: >-
                The `session` cookie (HttpOnly, host-only, SameSite) and the
                `csrf_token` cookie (readable by the page's own script — that
                readability IS the double-submit mechanism, SEC-024).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the calling session
      description: >-
        Revokes the session or API key that authenticated this request
        (`security-model.md` SEC-020) and expires its cookies. Ordinary
        authenticated operation — deliberately NOT `security: []`, so a
        browser caller is subject to the same double-submit CSRF requirement
        every other mutating route carries (SEC-024) and a cross-site page
        cannot sign a user out.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: The session was revoked.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/session:
    get:
      operationId: getSession
      summary: Read the calling principal's own session
      description: >-
        Returns the caller's own principal, effective role, and assurance
        level — what a console reads on load to decide whether to render the
        application or the sign-in page.
      tags: [auth, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The calling session.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/setup:
    post:
      operationId: claimWorkspace
      summary: Claim an unclaimed workspace by redeeming the one-time setup grant
      description: >-
        First-boot claim (`security-model.md` SEC-120). The installer
        generates a one-time `setup`-purpose grant and presents its code;
        this endpoint is claimable ONLY by redeeming that code, so an
        installed-but-unclaimed box on a shared network is never
        first-come-first-served. Redemption is an atomic check-and-consume
        (SEC-036): of two concurrent claims presenting one code, at most one
        succeeds and the other is refused `GRANT_ALREADY_REDEEMED`.
        Credential-exchange operation (API-090/091) — it mints the very first
        principal on the box, so it cannot require a pre-existing session.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "201":
          description: The workspace was claimed; the first owner principal and its session.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
            Set-Cookie:
              description: The `session` and `csrf_token` cookies, as for `login`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The grant was expired (`GRANT_EXPIRED`), already redeemed
            (`GRANT_ALREADY_REDEEMED`), or of a purpose that does not match
            this endpoint (`GRANT_PURPOSE_MISMATCH`) — `security-model.md`
            SEC-035.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/credential-reset:
    post:
      operationId: issueCredentialReset
      summary: Issue a one-time credential-reset code for a user principal
      description: >-
        Routine credential reset, issuing half (`security-model.md` SEC-050).
        Mints a `credential-reset`-purpose grant (SEC-030) for the named
        `user` principal and returns the one-time code for the issuing admin
        to hand over. Requires at least the `admin` role somewhere in the
        scope tree (SEC-012).

        The response carries NO credential value and no way to choose one:
        the target chooses their own value when they redeem, on
        `redeemCredentialReset`. That is a property of this operation's
        shape rather than a runtime check — there is no request or response
        field a credential could travel in.

        A `url` field is deliberately absent. Any link this operation
        returned would have to name a host learned from the request, and a
        poisoned `Host` header would produce a handoff link carrying a live
        one-time code to somebody else's origin. SEC-050 admits "a one-time
        code or URL"; this binding returns the code.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialResetRequest"
      responses:
        "201":
          description: The grant was minted; its one-time code, for handing to the target.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResetHandoff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /auth/credential-reset/redeem:
    post:
      operationId: redeemCredentialReset
      summary: Redeem a credential-reset code and set a new password
      description: >-
        Routine credential reset, redeeming half (`security-model.md`
        SEC-050/052/053). The TARGET presents the one-time code they were
        handed and chooses their own new credential value — the only point in
        this flow where a credential value is accepted at all.

        Credential-exchange operation (API-090/091), `security: []`: the
        caller is by definition someone who cannot sign in, so requiring a
        session would make the operation unreachable by the only party
        permitted to perform it. Bounded by SEC-033's attempt budget, applied
        before the code is looked up, and by SEC-036's atomic
        check-and-consume.

        Redemption revokes every existing session and API-key credential of
        the target by default (SEC-053), unless the issuance opted out. It
        does NOT touch the target's TOTP enrollment (SEC-052), and it mints
        no session: a principal holding a second factor still has to present
        it at `login`, so a reset can never become a way past it.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialResetRedeemRequest"
      responses:
        "204":
          description: >-
            The credential was set. No body and no session — the target signs
            in through `login`, second factor included.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The grant was expired (`GRANT_EXPIRED`), already redeemed
            (`GRANT_ALREADY_REDEEMED`), or of a purpose that does not match
            this endpoint (`GRANT_PURPOSE_MISMATCH`) — `security-model.md`
            SEC-035.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Begin a TOTP second-factor enrollment for the calling principal
      description: >-
        Mints a fresh TOTP shared secret for the CALLING principal and returns
        it once, as an `otpauth://` URI and as a typeable base32 key. The
        enrollment is not armed by this call — nothing authenticates until
        `confirmTotp` returns a code computed from the secret, which is the
        only evidence the secret reached an authenticator.
        `security-model.md` SEC-004 makes `totp` the guaranteed second-factor
        floor, "available without a secure-context precondition": unlike
        `passkey` (SEC-102), this operation stays available on the self-signed
        TLS fallback (SEC-110). A principal may enroll only for ITSELF —
        clearing or re-enrolling another principal's TOTP is the owner-explicit
        or console-binding path SEC-052 defines, not this one.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The pending enrollment's shared secret, returned exactly once.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            This principal already holds a TOTP credential; replacing it is a
            credential-reset or recovery operation (`security-model.md`
            SEC-052), not a self-service one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Arm the pending TOTP enrollment by returning a code from it
      description: >-
        Verifies a code against the calling principal's pending enrollment and,
        on success, writes the `totp` credential row (`security-model.md`
        SEC-003). The confirming code's own time step is spent at arming, so it
        cannot also complete a sign-in. Every OTHER live session and API key of
        this principal is revoked — a session minted on one factor does not
        outlive the moment the principal decided one factor was not enough —
        while the calling session survives, having just proven the new factor.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmRequest"
      responses:
        "200":
          description: The armed credential's metadata (never its secret).
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment is in progress for this principal; start one first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
