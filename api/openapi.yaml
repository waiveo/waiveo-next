  # ---------------------------------------------------------------------
  # casts — the authored slidecast (data-model/1 DAT-043).
  #
  # The family an operator spends their day in: a cast is the document they
  # build, and everything else (a playlist item, a daypart, a schedule) is
  # how it reaches a screen. Unlike the three scheduling-core families above,
  # this one declares its FULL row schema in both directions — a Studio
  # editor is generated against these types, so "the row schema is a later
  # minor" would leave the one family that most needs a contract without one.
  # ---------------------------------------------------------------------
  /casts:
    get:
      operationId: listCasts
      summary: List casts
      description: Returns a keyset-paginated, selector-filterable page of cast rows.
      tags: [casts, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of casts.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCast
      summary: Create a cast
      description: >-
        The `slides` array MUST be non-empty and every slide's `layers` MUST
        satisfy the shared slide-layer rules (`data-model/1` DAT-043): a closed
        set of layer kinds, geometry inside the 1920x1080 canvas, and the
        required fields of each kind. An image layer names only its
        content-addressed `asset_ref` here — its fetch `url` is derived from
        the content origin when the slide is projected onto a screen's program,
        never authored. A cast that would not draw is a 422, and nothing is
        stored.
      tags: [casts, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastCreate"
      responses:
        "201":
          description: The created cast.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /casts/import:
    post:
      operationId: importCast
      summary: Import a cast from a portable `.cast` bundle
      description: >-
        The request body is a `.cast` bundle — one authored design plus the
        bytes of every image it draws — as produced by `exportCast`. The
        destination placement is the `scope_node` query parameter, because the
        body is a binary file and because a bundle deliberately carries no
        placement of its own: a scope node names a tree the source deployment
        had and this one does not.


        The bundle is UNTRUSTED INPUT. Every asset's bytes are re-hashed and
        must match the reference they are carried under, the manifest is the
        sole list of what will be written (an entry it does not declare is a
        refusal, not a silent extra file), and the slides are then validated by
        the platform's own authoring rules — because the import writes through
        the SAME path `createCast` does, not a second one. So an imported cast
        is held to exactly the bar an authored one is, never a lower one, and
        the response is `createCast`'s own: `201` with the created cast, its
        ETag and its Location.


        The cast's identity is minted here, as it is for any create: a bundle
        carries no `id`, no `revision` and no `external_id`, all of which
        describe the box it came from. `name` optionally renames on the way in,
        which is what importing a second copy of a design onto one box needs.
      tags: [casts, "mcp:act"]
      parameters:
        - name: scope_node
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
          description: The node in THIS deployment's tree the imported cast is placed at.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Rename the cast on the way in. Absent, the bundle's own name is used.
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The imported cast, as created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /casts/{cast_id}:
    parameters:
      - name: cast_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getCast
      summary: Read a cast
      tags: [casts, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The cast.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cast"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCast
      summary: Update a cast
      description: >-
        Partial update. Requires If-Match against the cast's current
        ETag/revision. `slides` is replaced wholesale when present — a slide
        list is an ordered document, and a member-wise merge of one has no
        meaning — and the POST-MERGE effective row is re-validated in full, so
        a patch can no more introduce an undrawable slide than a create can.
      tags: [casts, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastUpdate"
      responses:
        "200":
          description: The updated cast.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteCast
      summary: Delete a cast
      description: >-
        Requires If-Match against the cast's current ETag/revision. A cast a
        playlist item still references is refused (422) rather than removed:
        the reference would otherwise survive as a playlist entry that
        contributes nothing, and the screen would quietly play a shorter
        rotation than the playlist says.
      tags: [casts, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /casts/{cast_id}/export:
    parameters:
      - name: cast_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: exportCast
      summary: Export a cast as a portable `.cast` bundle
      description: >-
        One authored design plus the bytes of every image it draws, as one file
        an operator can email, carry on a stick, and import onto another box
        (`importCast`).


        This is deliberately NOT the workspace archive. That moves the whole
        workspace and REPLACES the destination; this moves one design and adds
        it. The bundle is unencrypted and unsigned on purpose: its content is a
        design somebody is choosing to hand over, and the importing box
        establishes trust by re-deriving every asset's hash from the bytes and
        re-validating the slides — which answers the question that matters,
        where a signature would only say who made the file.


        Carries the name, the slides, the per-slide dwell, the labels and the
        images. Carries no `id`, `scope_node`, `external_id` or `revision`:
        each describes THIS deployment and would be wrong on the next one.


        A cast referencing an image this box no longer holds is refused `409`
        rather than exported with a hole in it — the hole would surface only on
        the destination, as a slide that renders blank, long after anyone could
        connect it to this export.
      tags: [casts, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The bundle, as an attachment.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------
  # content — the content-addressed asset upload.
  #
  # The one operation on this API whose request body is asset BYTES rather
  # than a resource description. It declares no Idempotency-Key because it
  # needs none and the server honours none: the stored bytes are addressed
  # by their own sha256, so re-posting identical bytes yields the identical
  # `asset_ref` with no duplicate to collapse.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # screens — the row a screen_id names (data-model/1 DAT-004a).
  # ---------------------------------------------------------------------
  /screens:
    get:
      operationId: listScreens
      summary: List screens
      description: Returns a keyset-paginated, selector-filterable page of screen rows.
      tags: [screens, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of screens.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createScreen
      summary: Create a screen
      tags: [screens, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenCreate"
      responses:
        "201":
          description: The created screen.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screen"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /screens/{screen_id}:
    parameters:
      - name: screen_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getScreen
      summary: Read a screen
      tags: [screens, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The screen.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screen"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScreen
      summary: Update a screen
      description: Partial update. Requires If-Match against the screen's current ETag/revision.
      tags: [screens, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenUpdate"
      responses:
        "200":
          description: The updated screen.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screen"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteScreen
      summary: Delete a screen
      description: Requires If-Match against the screen's current ETag/revision.
      tags: [screens, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /screens/{screen_id}/pairing-code:
    parameters:
      - name: screen_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: issueScreenPairingCode
      summary: Issue a pairing code for a screen
      description: >-
        Mints a one-time pairing grant bound to this screen row (`relay/1`
        REL-121a) AND to the one relay that may redeem it (REL-121b), and
        persists it as desired state, so it rides the next signed snapshot's
        `pairing_grants` section to the site's relays (REL-067). The response
        carries the human-enterable pairing code (`player/1` PLY-024) formed
        against that same relay's advertised dial address and trust-anchor
        commitment — or, when the relay is named but its address or key is
        unusable, the minted grant with an explanatory
        `code_unavailable_reason`. With no relay connected at all, the request
        is refused `503 UNAVAILABLE` and nothing is minted: an unbound one-time
        grant would be redeemable once per enrolled relay, each redemption
        resolving to this same screen row, which REL-121c forbids an app peer
        from delivering. Redemption happens at the relay (`player/1` Pairing
        redemption); this operation reports issuance, never a redemption state
        it has no evidence for.
      tags: [screens, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "201":
          description: The minted pairing grant and, when formable, its pairing code.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCodeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /screens/{screen_id}/now:
    parameters:
      - name: screen_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    put:
      operationId: setScreenNow
      summary: Show a cast or an alert on this screen now
      description: >-
        Imposes the screen's program override (`data-model/1` DAT-004c): it shows
        the named cast, or a generated slide bearing the literal `message`,
        instead of whatever its schedule resolves. The override is durable
        desired state, not a live command — it is a member of the screen row, so
        it rides the next signed snapshot to the site's relays as that screen's
        program (`relay/1` REL-061), survives a relay restart or an app-peer
        outage, and outranks the relay's own continuous schedule re-resolution
        while it stands (the entry is marked `pinned`, and under `mode: "alert"`
        also carries `preempt` priority, `player/1` PLY-108).


        Delivery is prompt but not instantaneous, and this operation reports
        INTENT rather than delivery: persisting the override nudges every
        connected relay (REL-057), and the screen adopts the new Lease on its
        next ordinary program poll (~10 seconds, PLY-082) — under `alert`
        interrupting whatever it is showing rather than waiting for it to finish
        (PLY-100/101). Read `/screen-status` for what the fleet has actually
        observed.


        Idempotent: pushing the same thing twice leaves one override, and pushing
        something else replaces it. Exactly one of `cast_id`/`message` must be
        set, and a `cast_id` naming no cast row is refused (`422`) rather than
        pinning the screen to nothing.


        This is the ONE surface that imposes an override; there is no `override`
        member on the screen resource's own create or update bodies.
      tags: [screens, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenNowRequest"
      responses:
        "200":
          description: The override now in force.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenNow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    delete:
      operationId: clearScreenNow
      summary: Clear this screen's push-now override
      description: >-
        Removes the screen's push-now override, so it returns to whatever its
        schedule resolves. Answers `204` whether or not an override was in force:
        a DELETE's contract is the resulting state, and clearing twice reaches it
        just as clearing once does.
      tags: [screens, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: No override is in force. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------------
  # screen-status — what the relays have OBSERVED each screen doing.
  # ---------------------------------------------------------------------
  /screen-status:
    get:
      operationId: listScreenStatus
      summary: List live screen status
      description: >-
        Returns one entry per authored screen row, joining what the row says with
        what the site's relays have observed of it and whether an operator
        currently has a push-now override on it.


        Every age is milliseconds before this response, and `-1` means the
        contact has NEVER been observed — a distinct state from a large age, and
        the one a screen that was never switched on is in. `reachability` is
        derived from four observations (`last_pull_age_ms`, `last_ack_age_ms`,
        `unacked_pulls`, `rejected`) against three published thresholds
        (`live_window_ms`, `content_transfer_window_ms`,
        `fetching_max_unacked_pulls`); every input and every line is on the row
        so a consumer can draw its own.


        Two families of program fields, and the difference between them is the
        whole point of this operation. `program_revision`/`priority`/`display`/
        `content_count` are what the relay HANDED the screen — the platform's
        intent. `acked_*` are what the screen ACCEPTED, and `rejected` /
        `reject_reason` are what it refused. A console that renders the first
        family as "now playing" reports what was sent as though it were what is
        showing, which on real hardware said a wall was playing a two-item
        program while the player was refusing it and drawing an hour-old slide.


        The third of each pair is the one that separates a screen downloading a
        large video from a screen that answers every program pull, fails every
        content fetch and never acknowledges anything. Both look identical in
        the ages — a pull with no ack after it — and the second one keeps
        producing new ones, which is what `unacked_pulls` counts.


        `reachability` is deliberately never "offline". This platform cannot
        distinguish a screen that is switched off from one whose network dropped,
        from one whose player crashed, from one that was never paired — and each
        sends an operator somewhere different. `report_age_ms` is what separates
        "this screen stopped talking to its relay" from "this relay stopped
        talking to us": when a relay disconnects, every screen behind it ages
        together and `report_age_ms` grows with them.
      tags: [screen-status, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of screen statuses.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenStatusListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ---------------------------------------------------------------------
  # diagnostics — "what is wrong with this box", without an SSH session.
  #
  # Two reads, both workspace-wide and neither scope-narrowable, so both are
  # `owner` for the same reason the data-subject operations are: there is no
  # node to narrow to, and a log line or a relay address is a map of the whole
  # deployment.
  # ---------------------------------------------------------------------
  /platform-logs:
    get:
      operationId: listPlatformLogs
      summary: Read the running process's captured log
      description: >-
        Returns the most recent lines this process has written, newest first,
        optionally narrowed by level, source or substring.


        `level` and `source` are DERIVED by reading each line, not declared by
        whoever wrote it: this is a capture of the process's own log output, so
        that every line the binary already writes is present with nothing to
        remember at the call site. `raw` always carries the whole line, so a
        reader is never shown a classification without the text it came from.


        This is NOT the audit trail. `security-model/1` SEC-150 makes
        `events/1`'s `audit.event` the platform's sole audit mechanism; it is
        durable, scoped, and read through the event stream. This buffer is
        volatile operational chatter and must not be relied on as a record of
        who did what.


        It is also NOT journald. In production the feeder runs as a systemd
        unit and journald holds the same lines PLUS every previous boot's —
        including the crash that caused the restart an operator is most likely
        investigating. This buffer starts empty at boot. The response publishes
        its own limits rather than leaving them to be inferred:
        `retained_from_ms` is how far back it can see, `dropped` is how many
        lines have already been overwritten, and `capacity` is its size. A
        deployment that captures nothing answers an empty page with
        `capacity: 0`, which is distinguishable from a wired-but-quiet box.
      tags: [diagnostics, "mcp:read"]
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [error, warn, info]
          description: >-
            Keep only lines at exactly this derived level — not "at or above".
            An operator filtering to `warn` means the warnings; a threshold
            would quietly re-show the errors they just filtered away from. A
            value outside the enum is refused 400 rather than silently matching
            nothing, because an empty diagnostics page reads as a quiet box.
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Keep only lines whose derived source is exactly this. The full set of retained sources rides every response.
        - name: contains
          in: query
          required: false
          schema:
            type: string
          description: Keep only lines whose raw text contains this, case-insensitively.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: >-
            How many of the NEWEST matching lines to return. There is no cursor:
            a keyset cursor names a position in a stable ordering, and this
            buffer's oldest end is overwritten while a client reads it, so a
            cursor into it would name a record that no longer exists.
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A window over the newest matching lines, plus what the buffer is not showing.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /system-health:
    get:
      operationId: getSystemHealth
      summary: Summarize this deployment's health
      description: >-
        Answers the question `/healthz` cannot: not "is this process
        listening" — if it were not, this request would not have arrived — but
        "which part of this box is not working".


        `status` is DERIVED as the WORST grade any component carries, so a
        summary can never read `ok` while a component reads `down`. `unknown`
        ranks above `ok` and below `degraded`: a check that could not run is not
        a passing check and is not an outage.


        Disk headroom is graded on ABSOLUTE free bytes rather than a percentage,
        because what matters is whether the next image deploy fits and that is a
        number of gigabytes on any size of disk. When the filesystem cannot be
        measured the byte members are OMITTED rather than zeroed — a
        `free_bytes` of 0 on a page whose job is to warn about a full disk would
        manufacture the emergency it exists to detect.
      tags: [diagnostics, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The health summary.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /system/restart:
    post:
      operationId: restartApplicationServer
      summary: Restart the application server
      description: >-
        Stops THIS application-server process so its supervisor starts a
        replacement (API-150). Its subject is the process, never the host: it
        does not reboot the machine, and the relay, the content origin and every
        other LAN service on the box are untouched. Screens keep playing what
        their relay already handed them; the console and `/api/v1` are away for
        seconds.


        The answer is `202 Accepted`, never `200 restarted` (API-152). The
        process is still running when the response is written — it must be, or
        the bytes could not be sent — so the only true statement a 2xx can carry
        is that the request was accepted. Learn that it completed by reading
        `getSystemHealth` until `started_at_ms` differs from the value this
        response echoes; polling for reachability alone cannot distinguish
        "came back" from "never went".


        Three refusals, each with its own code and each naming what to do about
        it: `RESTART_UNSUPPORTED` (501) when the deployment has not declared a
        supervisor, so nothing would start a replacement and stopping would take
        the box down for good; `RESTART_IN_PROGRESS` (409) when one has already
        been accepted; `RESTART_BLOCKED` (409) while accepted work is in flight
        that a restart cannot be resumed from (API-116) — the Problem's `detail`
        names the job. Owner-at-root only (API-151).


        A mutating POST tagged `mcp:act`, so it accepts `Idempotency-Key`: a
        retry-on-timeout replays the original acceptance rather than queueing a
        second restart.
      tags: [diagnostics, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartRequest"
      responses:
        "202":
          description: >-
            The restart was accepted. The process goes on serving for
            `stopping_in_ms`, then drains and exits.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartAcceptance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  # ---------------------------------------------------------------------
  # adopted-devices — the rows relay/1 REL-063's device_inventory is compiled from.
  # ---------------------------------------------------------------------
  /adopted-devices:
    get:
      operationId: listAdoptedDevices
      summary: List adopted devices
      description: Returns a keyset-paginated, selector-filterable page of adopted device rows.
      tags: [adopted-devices, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of adopted devices.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptedDeviceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createAdoptedDevice
      summary: Create a adopted device
      tags: [adopted-devices, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptedDeviceCreate"
      responses:
        "201":
          description: The created adopted device.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptedDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /adopted-devices/{adopted_device_id}:
    parameters:
      - name: adopted_device_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getAdoptedDevice
      summary: Read a adopted device
      tags: [adopted-devices, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The adopted device.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptedDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAdoptedDevice
      summary: Update a adopted device
      description: Partial update. Requires If-Match against the adopted device's current ETag/revision.
      tags: [adopted-devices, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptedDeviceUpdate"
      responses:
        "200":
          description: The updated adopted device.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptedDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteAdoptedDevice
      summary: Delete a adopted device
      description: Requires If-Match against the adopted device's current ETag/revision.
      tags: [adopted-devices, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /content:
    get:
      operationId: listContent
      summary: List the assets in the content origin
      description: >-
        Every asset the content origin currently serves, each carrying the same
        `{asset_ref, url}` an upload returns plus `size_bytes` and `stored_at`.
        Upload is otherwise write-only, so an authoring surface that did not keep
        an upload's `asset_ref` has no other way to rediscover it; this is the
        read half a media browser and an editor's image picker resolve against.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The content origin's current listing. Shape stub — the response schema is a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: uploadContent
      summary: Upload an asset to the content origin
      description: >-
        The raw request body is stored under its own sha256 and answered with
        the server-computed `{asset_ref, url}` — a client-supplied ref is never
        trusted. A playlist item may name an `asset_ref` only once this has
        returned it (data-model/1 DAT-041).
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored asset's content-addressed ref and origin URL. Shape stub — the response schema is a later minor.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------------
  # derive — the rasterized fallback's work queue (parity row 2.4).
  #
  # ONE read-only operation, and that is the whole point. The appliance holds
  # no browser and never will: waiveo-next's feeder and relay are Go-only, and
  # the box this replaces already carries the legacy stack. So the rasterizer
  # lives OFF the appliance, in `cmd/waiveo-derive`, and the only thing the
  # server owes it is an honest answer to "what is waiting?". Everything the
  # tool does afterwards it does through operations that already existed —
  # `POST /content` for the PNG, `PATCH /casts/{id}` for the reference — which
  # is why this family adds no write of its own.
  # ---------------------------------------------------------------------
  /derive/pending:
    get:
      operationId: listPendingDerives
      summary: List the slide layers waiting to be rasterized
      description: >-
        Every `derive` layer this caller can read whose PNG has not been produced
        yet (`pending`) or was produced from a spec or geometry the operator has
        since changed (`stale`), each as a complete work order. BOTH authored
        shapes that carry a layer stack are scanned — a cast's slides and a
        `source: "slide"` playlist item's inline slide — because both are
        rewritten into an ordinary `image` by the same projection and so both
        really do reach a screen. The listing is computed from those authored
        rows themselves — there is no queue table to drift out of step with what
        is authored, so a layer disappears from here the moment its `asset_ref`
        and `derived_from` are written back, and reappears the moment its spec is
        edited.
      tags: [derive, mcp:read]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: >-
            The outstanding rasterizations: every cast's, then every playlist's,
            in row then slide then layer order within each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivePendingList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------
  # webhook-endpoints — outbound webhook registration (events/1 EVT-150).
  #
  # The five CRUD operations are the SAME resource shape every other family
  # is worked as, served by the same generic handler and honouring the same
  # conventions. The three operations beyond them exist because a signing
  # secret has no representation to GET, an endpoint's delivery state carries
  # no revision to condition a write on, and re-enabling is an act rather than
  # an edit — modelling any of them as a member of the endpoint's own body
  # would put platform-owned execution state under If-Match.
  #
  # No response on this family carries a signing secret. The rotate operation
  # takes one and answers with the rotation's timing only: the caller supplied
  # the value and already has it, and a copy in a response body is a copy in
  # every proxy log and every retained idempotency replay between here and
  # them.
  # ---------------------------------------------------------------------
  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      description: Returns a keyset-paginated, selector-filterable page of registered outbound webhook endpoints.
      tags: [webhook-endpoints, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of webhook endpoints.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: >-
        Registers an endpoint durable events are delivered to. The endpoint
        receives nothing until a signing secret is installed
        (`rotateWebhookSigningSecret`): an unsigned POST is not a delivery
        `events/1` defines.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreate"
      responses:
        "201":
          description: The registered webhook endpoint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /webhook-endpoints/{webhook_endpoint_id}:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getWebhookEndpoint
      summary: Read a webhook endpoint
      tags: [webhook-endpoints, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The webhook endpoint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWebhookEndpoint
      summary: Update a webhook endpoint
      description: Partial update. Requires If-Match against the endpoint's current ETag/revision.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdate"
      responses:
        "200":
          description: The updated webhook endpoint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      description: >-
        Deletes the registration. The endpoint's delivery progress and its
        sealed signing secret are destroyed with it — a deleted endpoint leaves
        no credential material behind.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /webhook-endpoints/{webhook_endpoint_id}/signing-secret:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: rotateWebhookSigningSecret
      summary: Install or rotate a webhook endpoint's signing secret
      description: >-
        Installs the secret every delivery to this endpoint is signed with
        (`events/1` EVT-151). The first call arms the endpoint — until it lands
        the endpoint receives nothing. Every later call is a rotation: the
        secret being replaced stays acceptable for a stated overlap window
        (EVT-158), during which a delivery carries a second signature computed
        under it, so a receiver has time to adopt the new secret before the old
        one stops working. The secret is supplied by the caller and appears in
        no response.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSigningSecretRequest"
      responses:
        "200":
          description: The rotation's timing. Never the secret.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSigningSecretRotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhook-endpoints/{webhook_endpoint_id}/enable:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: enableWebhookEndpoint
      summary: Re-enable an auto-disabled webhook endpoint
      description: >-
        `events/1` EVT-154 disables an endpoint whose deliveries have failed
        past a bounded consecutive-failure count, and a disabled endpoint
        receives no further attempts until an operator re-enables it. This is
        that act. The endpoint's delivery cursor is left exactly where it was,
        so it resumes from where it stopped rather than skipping what it never
        received (EVT-155). Enabling an already-active endpoint is not an error.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The endpoint's delivery state after re-enabling.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /webhook-endpoints/{webhook_endpoint_id}/delivery:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getWebhookDeliveryState
      summary: Read a webhook endpoint's delivery state
      description: >-
        Reports whether the endpoint is active or auto-disabled (EVT-154), how
        far delivery has got (EVT-155's `last_delivered_id`), and how long its
        current unbroken failure run is. This is the durable, operator-facing
        view of the auto-disable signal: the fact survives whether or not
        anyone was listening when it happened.
      tags: [webhook-endpoints, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The endpoint's delivery state.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------------
  # packs — installed declarative packs (manifest/1).
  #
  # A pack id is `<publisher>/<name>` (MAN-001) — TWO path segments, never
  # one opaque percent-encoded one, which is why every item path below
  # templates `{publisher}` and `{name}` separately. A pack's own pages
  # (ui-schema/1) may be nested, so the page path's final template is a
  # multi-segment remainder.
  # ---------------------------------------------------------------------
  /packs:
    get:
      operationId: listPacks
      summary: List installed packs
      description: >-
        Keyset-paginated. No `selector`: a pack is installed workspace-wide
        rather than placed at a scope node, so there are no labels for the
        label-selector grammar to evaluate.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of installed packs. Shape stub — the pack envelope schema is a later minor.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: installPack
      summary: Install a pack from its artifact or by marketplace reference
      description: >-
        Two request bodies, distinguished by content type. Raw artifact bytes
        (any content type but `application/json`) install that artifact
        directly. An `application/json` body is a marketplace reference
        (marketplace/1 MKT-060a) resolved against the deployment's configured
        registry sources. Both converge on one pipeline — the same signature
        envelope verification against the same trust anchors, the same manifest
        gate, the same atomic write and the same install record — so resolving a
        pack can never accept an artifact a direct upload would refuse.
        Installation executes nothing: a pack is data.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceRef"
      responses:
        "200":
          description: The pack was already installed and has been updated in place. Shape stub.
        "201":
          description: The pack was installed. Shape stub — the install summary schema is a later minor.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/catalog:
    get:
      operationId: browsePackCatalog
      summary: What the configured registry sources currently offer
      description: >-
        marketplace/1 MKT-096. Enumerates the entries this deployment's
        registry sources serve, as distinct from resolving one already-named
        reference — the discovery half, which had no endpoint at all.

        A listing is NOT an endorsement. Until channel-index/1's signature
        chain (CHI-050) is enforced an index is untrusted transport, so an
        entry here conveys exactly "this source's index says it has this", and
        nothing about the artifact behind it has been checked at the point it
        is listed. What protects an operator who acts on one is unchanged:
        installing a browsed reference runs the same resolution-time rules and
        the same install-time envelope verification against this host's own
        anchors as installing a typed one, so a forged listing can misdescribe
        an artifact but cannot install one.

        Entries a resolution would refuse or a publisher has withdrawn from
        discovery are not listed: `yanked` (CHI-072) and `archived` (MKT-044).
        Both remain installable by exact reference — not advertising something
        is not refusing it.

        Results are grouped BY SOURCE and never merged: source order is a
        resolution preference and never a trust decision (MKT-061), so an
        operator comparing offerings must see which source served what. A
        source that could not be read is reported with a reason rather than
        omitted — an empty catalog and an unreachable registry are different
        facts.

        One path segment, so it can never be mistaken for the two-segment
        `{publisher}/{name}` a pack is addressed by.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: >-
            One entry per configured source, each with its offerings or the
            reason it could not be read. Shape stub, matching the rest of this
            surface.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /packs/{publisher}/{name}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    get:
      operationId: getPack
      summary: Read an installed pack
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The pack envelope and its manifest. Shape stub — the schema is a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: uninstallPack
      summary: Uninstall a pack
      description: >-
        Removes the pack and everything it owns — its bundle, its authored
        collection rows, and its install records (marketplace/1 MKT-094b) — in
        one transaction. The per-(pack, trust channel) resolved-version
        high-water mark deliberately survives (MKT-050/MKT-094b), so
        uninstall-then-reinstall is not a downgrade path. A pack on this
        deployment's required-pack roster cannot be uninstalled at all
        (MKT-093b): removal is removal to no version, which is below every
        floor, and the refusal is decided inside the removal transaction rather
        than in this handler.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Uninstalled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /packs/{publisher}/{name}/pages/{path}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - name: path
        in: path
        required: true
        description: >-
          The page's own path within the pack (ui-schema/1 UIS-001). It MAY
          span several segments, so the slashes inside it are part of the
          value rather than separators between parameters.
        schema:
          type: string
    get:
      operationId: getPackPage
      summary: Read a pack-declared page definition
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The page's ui-schema/1 definition. Shape stub — the schema is ui-schema/1's, declared in a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /packs/{publisher}/{name}/messages/{locale}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - name: locale
        in: path
        required: true
        description: BCP 47 locale tag naming the catalog to serve (manifest/1 MAN-110).
        schema:
          type: string
    get:
      operationId: getPackMessages
      summary: Read a pack's message catalog for one locale
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The resolved message catalog. Shape stub — the schema is a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /packs/{publisher}/{name}/installs:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    get:
      operationId: listPackInstalls
      summary: List a pack's install-record history
      description: >-
        Keyset-paginated, oldest first: the append-only install records
        marketplace/1 MKT-094b requires, whose last entry is MKT-094's current
        pin. Each record carries what was resolved (version, trust channel,
        registry source) and the provenance the install was accepted on
        (MKT-094a): the content digest and key id of the signature envelope
        verification that admitted the artifact. That envelope is dropped at
        install and never persisted (MKT-009a), so these records are the only
        answer to "which key vouched for the bytes that are running". A pack
        that is not installed is a 404 — its records were removed with it.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of install records. Shape stub — the install-record schema is a later minor, matching the rest of this surface.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /packs/{publisher}/{name}/enabled:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    put:
      operationId: setPackEnabled
      summary: Turn an installed pack off, or back on
      description: >-
        marketplace/1 MKT-097. Disabling WITHDRAWS a pack's surfaces — its
        `ui.pages` stop being served and it stops being a navigable
        destination — and preserves everything uninstalling would remove: its
        authored rows, its install records, and the pack itself.

        That preservation is why the operation exists. Without it the only
        remedies for a pack misbehaving on a live deployment are to leave it
        running or to uninstall it and destroy the operator's data with it,
        and an operator who cannot do the reversible thing will do the
        destructive one.

        Enabling restores exactly what disabling withdrew. It re-runs no
        installation: nothing was removed, so nothing is resolved, verified or
        re-applied.

        Pre-`ctx/1` a pack carries no executable code, so withdrawing its
        surfaces is the whole of what disabling can stop. A required pack
        (MKT-093a) cannot be disabled — a floor that forbids removing a pack
        forbids equally the state in which it is present and does nothing.

        Idempotent by construction: PUT of a state, not a toggle, so a retry
        cannot flip a pack back on.
      tags: [packs, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The pack's enablement after the write. Shape stub, matching the rest of this surface.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}/update:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    get:
      operationId: getPackUpdateAvailability
      summary: Report what an update check would do, without doing it
      description: >-
        marketplace/1 MKT-095. The same resolution `updatePack` performs — the
        trust channel and registry source read off the newest install record
        (MKT-094), through that source's channel pointer, under the same
        resolution-time rules — reported rather than applied, so a report and
        the check it describes cannot disagree about what would happen.

        It is a GET on the same resource as the check for exactly that reason:
        the two answer one question, and only the verb differs. Nothing is
        applied or reverted, no install record is appended (MKT-094b), and the
        MKT-050 high-water mark is not advanced — this is not the check run and
        undone, which MKT-094b's own "a record's existence is evidence an
        install was applied" forbids.

        `action` is what `updatePack` WOULD do: `unchanged`, `updated`, or
        `reverted`. The last is the case an operator most needs before anything
        moves — the running version has been revoked and a check would revert to
        a last-known-good version (MKT-093) — and it is named here without
        performing it. A pack installed with no trust channel pinned is not
        auto-tracked and is reported as such (MKT-094a), never resolved against
        a defaulted channel.

        Artifact bytes are not fetched: the resolved entry and its
        resolution-time checks answer this on their own.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: >-
            What an update check would do. Shape stub, matching the rest of this
            surface — `action` is `unchanged`, `updated`, or `reverted`, with
            `from_version`/`to_version`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    post:
      operationId: updatePack
      summary: Run one update check against a pack's pinned trust channel
      description: >-
        Channel auto-tracking, applied on demand (marketplace/1 MKT-090): the
        pack's own pinned trust channel and registry source are read off its
        newest install record (MKT-094) and re-resolved through that source's
        channel pointer — nothing about how the pack is re-resolved comes from
        this request, so a host never silently chooses a provenance tier
        (MKT-060a(b)) on the operator's behalf. A pack installed directly, with
        no trust channel pinned, is not auto-tracked and is refused rather than
        defaulted onto a channel (MKT-094a). If the currently applied version has
        itself been yanked, the check reverts to the most recent version this
        install previously applied that is still resolvable (MKT-093, the sole
        exception MKT-050 allows a resolved version to decrease under). A refused
        update writes nothing: the install transaction upserts, so the previously
        installed version, its bundle and its records are left intact. A mutating
        POST outside plain resource creation — accepts Idempotency-Key so a
        client's retry-on-timeout cannot run a second check.
      tags: [packs, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: >-
            The update check's outcome. Shape stub, matching the rest of this
            surface — `action` is `unchanged`, `updated`, or `reverted`, with
            `from_version`/`to_version`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}/data/{collection}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - $ref: "#/components/parameters/PackCollectionParam"
    get:
      operationId: listPackRows
      summary: List the rows of a pack-declared collection
      description: >-
        Keyset-paginated over the collection's universal-envelope rows
        (manifest/1 MAN-051/052), scoped to the caller's visible set. No
        `selector`: the row envelope's labels are not yet exposed to the
        label-selector grammar on this collection.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of rows. Shape stub — the row schema is the pack's own declaration, not this document's.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPackRow
      summary: Create a row in a pack-declared collection
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "201":
          description: The created row. Shape stub — the row schema is the pack's own declaration.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}/data/{collection}/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - $ref: "#/components/parameters/PackCollectionParam"
      - name: entity_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getPackRow
      summary: Read one row of a pack-declared collection
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The row. Shape stub — the row schema is the pack's own declaration.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePackRow
      summary: Update one row of a pack-declared collection
      description: Partial update. Requires If-Match against the row's current ETag/revision.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The updated row. Shape stub — the row schema is the pack's own declaration.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deletePackRow
      summary: Delete one row of a pack-declared collection
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie issued by /auth/login. Mutating requests additionally require the platform's CSRF token.
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: "wv_<random>, scoped to a principal and role"
      description: API-key principal (user-issued or internal-service), presented as a bearer token.

  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a prior response's `cursor` field. Never constructed or parsed by the client.
      schema:
        $ref: "#/components/schemas/Cursor"
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum rows to return in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SelectorParam:
      name: selector
      in: query
      required: false
      description: >-
        A label-selector string: comma-separated, ANDed terms (equality,
        inequality, set-membership, set-exclusion, existence,
        non-existence, or a `scope_node subtree <ulid>` term). See
        `contracts/api-1.md#label-selector-grammar` for the full grammar.
      schema:
        type: string
        example: "kind=screen,env in (prod,staging),scope_node subtree 01J8Z2Q1M8H8N4T0V1W2X3Y4Z5"
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: The resource's current ETag, as last observed by the client. Required on every state-changing request against a mutable resource; no unconditional-overwrite path exists.
      schema:
        type: string
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated opaque replay key, scoped to (principal, method, path). Optional; strongly recommended on any POST a client might retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TraceIdParam:
      name: Trace-Id
      in: header
      required: false
      description: Caller-supplied trace ID (ULID- or UUID-class, 20-36 chars). A non-conforming value is discarded and replaced server-side; the request still proceeds.
      schema:
        $ref: "#/components/schemas/TraceId"

    PackPublisherParam:
      name: publisher
      in: path
      required: true
      description: >-
        The publisher half of a pack's `<publisher>/<name>` identity
        (manifest/1 MAN-001). It is its own path segment rather than half of
        one percent-encoded value, so a pack id is addressable without the
        client having to escape the slash inside it.
      schema:
        type: string

    PackNameParam:
      name: name
      in: path
      required: true
      description: The name half of a pack's `<publisher>/<name>` identity (manifest/1 MAN-001).
      schema:
        type: string

    PackCollectionParam:
      name: collection
      in: path
      required: true
      description: The name of a collection the pack's manifest declares (manifest/1 MAN-051).
      schema:
        type: string

  headers:
    ETag:
      description: Strong validator derived solely from the resource's `revision`. Present on every response representing a single mutable resource.
      required: true
      schema:
        type: string
        example: '"3"'
    TraceIdResponse:
      description: The trace ID that correlates this request across every component it touched — either the caller-supplied value (if it validated) or a freshly generated one.
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"

  # Note: the Deprecation (RFC 9745) and Sunset (RFC 8594) response headers
  # this contract's evolution policy uses (contracts/api-1.md, API-082) are
  # not modeled as reusable components here — nothing in this document is
  # deprecated yet, so there is no operation to attach them to without
  # faking a deprecation. contracts/api-1.md is their normative source; a
  # future minor wires them onto whichever operation first deprecates.

  responses:
    BadRequest:
      description: The request was malformed (validation failure, invalid selector, invalid cursor).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: >-
        The request body failed field-level validation
        (`contracts/api-1.md#error-shape`, API-013a: a body validation
        failure is 422, distinct from the 400 a query-parameter validation
        failure — e.g. an out-of-range `limit` — carries).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid principal was presented.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The principal is authenticated but not authorized for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No resource exists at this identifier.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The request cannot be applied against the resource's current state: an
        Idempotency-Key reused with a different body or still in progress, or a
        deletion refused because something still depends on the row.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match did not match the resource's current ETag.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: A state-changing request omitted the required If-Match header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The principal exceeded its rate limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >-
        The server or a dependency it needs is temporarily unable to serve
        the request (`code: UNAVAILABLE`) — for a device command, the target
        entity's relay has no live connection to carry it. Retryable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotImplemented:
      description: >-
        This deployment cannot perform the operation at all — a CAPABILITY
        refusal, not a temporary one. Deliberately distinct from `503`
        (`UNAVAILABLE`), which invites a retry: nothing about waiting changes
        the answer, and the `code` names what the deployment would have to
        declare or provide for the operation to become possible.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Ulid:
      type: string
      description: A 26-character Crockford-base32 identifier, lexicographically sortable by creation time.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["01J8Z3K4N5P6Q7R8S9T0V1W2X3"]

    TraceId:
      type: string
      description: A ULID- or UUID-class trace identifier, 20-36 characters, restricted charset.
      pattern: "^[A-Za-z0-9-]{20,36}$"
      examples: ["01J8Z3K4N5P6Q7R8S9T0V1W2X4"]

    Cursor:
      type: ["string", "null"]
      description: An opaque, URL-safe continuation token. `null` signals no further rows. Never constructed, parsed, or compared for meaning by a client.
      pattern: "^[A-Za-z0-9_-]+$"
      x-go-type: "*string"

    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: >-
        A resource-baseline timestamp: epoch MILLISECONDS, UTC — not an RFC
        3339 string. The store stamps `created_at`/`updated_at` on every row it
        writes as an integer millisecond count and returns that value
        unchanged, so this is what a client reads and what an export/apply
        round trip carries back. Deliberately not `format: date-time`: the two
        are not interchangeable, and a client that parsed one as the other
        would silently read 1970 for every resource on this surface.

        The `Job` resource is the one exception on this API and says so at its
        own `created_at`: a Job's timestamp is minted in Go as a `time.Time`
        and serialized RFC 3339, because a Job is not a stored row of this
        baseline.

    ValidationFieldError:
      type: object
      description: One field-level failure inside a VALIDATION_FAILED Problem's `errors` array.
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dot-path to the offending field in the request body, or the query-parameter name.
        code:
          type: string
        message:
          type: string

    Problem:
      type: object
      description: >-
        RFC 9457 problem+json, extended with `code` (this contract's
        machine-readable error registry) and `trace_id`. `code` is the
        discriminant a client asserts on; `title`/`detail` are for humans.
      required: [type, title, status, code, trace_id]
      additionalProperties: false
      properties:
        type:
          type: string
          const: "about:blank"
          description: Always "about:blank" in this version; `code` is the sole machine-readable discriminant api/v1 defines.
        title:
          type: string
          description: A short, human-readable summary of the error, constant per `code`.
        status:
          type: integer
          description: The HTTP status code, repeated here per RFC 9457.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request's own path, unmodified.
        code:
          $ref: "#/components/schemas/ErrorCode"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        errors:
          type: array
          description: Present only when `code` is VALIDATION_FAILED — one entry per failing field.
          items:
            $ref: "#/components/schemas/ValidationFieldError"
        current_revision:
          type: integer
          description: Present only when `code` is REVISION_CONFLICT — the resource's current revision, so the client can re-read and retry.
        second_factor:
          type: string
          enum: [totp]
          description: >-
            Present only on a 401 UNAUTHENTICATED from `login` where the
            presented password was accepted but the principal holds a
            second-factor credential the request did not satisfy
            (`security-model.md` SEC-004). It names the factor to collect and
            re-submit on the same operation. Deliberately ABSENT from every
            other refusal — including a wrong password, a wrong code, and a
            replayed code — so its absence discloses nothing about which of
            them occurred.
      examples:
        - type: "about:blank"
          title: "Not Found"
          status: 404
          detail: "No scope node exists with this identifier."
          instance: "/api/v1/scope-nodes/01J8Z3K4N5P6Q7R8S9T0V1W2X9"
          code: "NOT_FOUND"
          trace_id: "01J8Z3K4N5P6Q7R8S9T0V1W2X4"

    ErrorCode:
      type: string
      description: >-
        The stable, additive-only machine-readable error registry
        (`contracts/api-1.md#error-taxonomy`), plus the codes a sibling
        contract owns for operations that ride this same `/api/v1` binding.
        api/1's own registry governs API-011 for api/1's own rules; a sibling
        contract's Problem carries a `code` from ITS registry, by name — the
        same reuse-by-name discipline `player/1` PLY-007 applies. The trailing
        values below belong to sibling contracts: four to
        `security-model.md`'s Error taxonomy, appearing only on the `auth`
        operations; three to `data-model-1.md`'s, appearing only on the
        scope-node delete; and two to `marketplace-1.md`'s, appearing on the
        pack operations.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - REVISION_CONFLICT
        - IF_MATCH_REQUIRED
        - CURSOR_INVALID
        - SELECTOR_INVALID
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - EXTERNAL_ID_CONFLICT
        - ID_SERVER_ASSIGNED
        - RATE_LIMITED
        - INTERNAL
        - UNAVAILABLE
        - RESTART_UNSUPPORTED
        - RESTART_IN_PROGRESS
        - RESTART_BLOCKED
        - ARCHIVE_IN_USE
        - CREDENTIAL_LOCKED
        - GRANT_EXPIRED
        - GRANT_ALREADY_REDEEMED
        - GRANT_PURPOSE_MISMATCH
        - SCOPE_NODE_NOT_EMPTY
        - SCOPE_NODE_IN_USE
        - SCOPE_NODE_ORG_UNDELETABLE
        - MARKETPLACE_REF_INVALID
        - REQUIRED_PACK_FLOOR
        - SINGLETON_COLLECTION_OCCUPIED
        - EVENT_NOT_DECLARED

    LoginRequest:
      type: object
      description: >-
        The credentials a login authenticates from (API-091 — carried in the
        BODY, never as a precondition session).
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: The login handle the `password` credential is registered under.
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
        totp_code:
          type: string
          description: >-
            The second-factor code (`security-model.md` SEC-004). Optional in
            SHAPE and mandatory in EFFECT for any principal holding a `totp`
            credential: such a login is refused without it, with the Problem's
            `second_factor` member naming the factor to collect, and the client
            re-calls this same operation carrying everything. There is no
            intermediate credential between the two calls — nothing is minted
            until both factors are satisfied.
          pattern: "^[0-9]{6}$"

    TotpEnrollment:
      type: object
      description: >-
        A pending TOTP enrollment's shared secret, returned exactly once by
        `enrollTotp`. Nothing here authenticates until `confirmTotp` arms it.
      required: [secret, otpauth_uri]
      additionalProperties: false
      properties:
        secret:
          type: string
          format: password
          description: The shared secret, RFC 4648 base32, uppercase and unpadded — the form an operator types into an authenticator app by hand.
        otpauth_uri:
          type: string
          description: The same secret as the `otpauth://totp/...` URI an authenticator app imports, usually by scanning it as a QR code.

    TotpConfirmRequest:
      type: object
      description: A code computed from the pending enrollment's secret, proving it reached an authenticator.
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          format: password
          pattern: "^[0-9]{6}$"

    TotpCredential:
      type: object
      description: >-
        The armed `totp` credential, in `security-model.md`'s own Credential
        wire shape — metadata only, never a raw secret value.
      required: [credential_id, principal_id, kind, created_at, revoked_sessions]
      additionalProperties: false
      properties:
        credential_id:
          $ref: "#/components/schemas/Ulid"
        principal_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          enum: [totp]
        created_at:
          type: integer
          format: int64
          description: Milliseconds since the Unix epoch, from the server's own clock.
        revoked_sessions:
          type: integer
          description: >-
            How many OTHER sessions and API keys of this principal arming the
            credential revoked. The calling session is never among them — it
            has just proven the new factor.

    ClaimRequest:
      type: object
      description: >-
        A first-boot claim (SEC-120): the one-time setup code, plus the
        credential the first owner is choosing.
      required: [code, identifier, password]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            The one-time `setup`-purpose grant code the installer presented.
            At least 128 bits of entropy (SEC-032).
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    ChangeOwnPasswordRequest:
      type: object
      description: >-
        A self-service password change (SEC-054). The current password is a
        REQUIRED member rather than an optional proof: without it a stolen
        session is a permanent account takeover, since the thief could lock the
        owner out using only the session they already hold.
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
        new_password:
          type: string
          format: password
          minLength: 1

    CredentialResetRequest:
      type: object
      description: >-
        Who is being reset. There is deliberately no credential-bearing
        member: SEC-050 says the issuing admin "MUST NOT be shown, and MUST
        have no path to choose, the credential value the target user
        eventually sets", and `additionalProperties: false` is what makes
        that a property of the wire rather than of a handler's discipline.
      required: [target_principal_id]
      additionalProperties: false
      properties:
        target_principal_id:
          type: string
          description: The `user` principal whose password credential is being reset.
          minLength: 1
        keep_existing_sessions:
          type: boolean
          default: false
          description: >-
            SEC-053's per-issuance opt-out. Redemption revokes every existing
            session and API-key credential of the target BY DEFAULT — which is
            what makes a post-takeover reset also evict whatever session an
            attacker was using — and this opts one single issuance out of it.
    CredentialResetHandoff:
      type: object
      description: >-
        What the issuing admin receives (SEC-050). Every member is an
        identifier or the one-time code itself; none is, or can become, the
        credential value the target eventually sets.
      required:
        [grant_id, code, target_principal_id, expires_at_ms, sessions_revoked_on_redemption]
      additionalProperties: false
      properties:
        grant_id:
          type: string
          description: The `credential-reset`-purpose grant this issuance minted.
        code:
          type: string
          description: >-
            The one-time code, returned exactly once and recoverable from
            nowhere else — the grant row stores only its hash (SEC-051). It
            identifies a grant; it is not itself a rendered credential.
        target_principal_id:
          type: string
          description: >-
            Echoed back so an admin can confirm they reset the account they
            meant to.
        expires_at_ms:
          type: integer
          format: int64
          description: When the code stops being redeemable (SEC-032, ~15 minutes).
        sessions_revoked_on_redemption:
          type: boolean
          description: >-
            Whether redemption will apply SEC-053's revoke-everything default,
            so the admin sees which of the two behaviours their issuance chose.
    PackLogAppendRequest:
      type: object
      description: >-
        One log line from an extension. Deliberately carries no source: the
        platform attributes it to the calling pack.
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
        level:
          type: string
          enum: [error, warn, info]
          description: Defaults to `info` when absent or unrecognised.

    PackHealthReportRequest:
      type: object
      description: >-
        One extension's own account of its condition. `detail` is required even
        for `ok`: it is the difference between a check that ran and one that was
        skipped, which is the same promise every other service line on the health
        page makes.
      required: [status, detail]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        detail:
          type: string
          minLength: 1

    PackEventEmitRequest:
      type: object
      description: >-
        One durable event from an extension. `name` is the pack-namespaced event
        the manifest declares (MAN-090); the payload validates against that
        declaration's own `payloadSchema` (events/1 EVT-022).
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        payload:
          type: object
          additionalProperties: true

    PackActionInvokeRequest:
      type: object
      description: The action's parameters, validated against its `paramsSchema` (MAN-100).
      additionalProperties: false
      properties:
        params:
          type: object
          additionalProperties: true
          description: Parameters for the action; an action taking none may omit it.

    PackInvocationResultRequest:
      type: object
      description: >-
        The outcome of one leased invocation. A result and a failure are mutually
        exclusive: an invocation that reports an `error_code` is FAILED, and a
        caller branching on state must not also have to inspect a code.
      additionalProperties: false
      properties:
        result:
          type: object
          additionalProperties: true
          description: The action's return value, for a successful invocation.
        error_code:
          type: string
          minLength: 1
          description: A machine-readable failure code; its presence makes the invocation failed.
        error_message:
          type: string
          description: A human-readable explanation accompanying `error_code`.

    TierGrantRedeemRequest:
      type: object
      description: >-
        The one-time code the host handed the pack process at start (SEC-037).
        Deliberately the ONLY member: the pack id rides on the grant, so there is
        nothing here a caller could use to name itself.
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The one-time `tier-grant`-purpose grant code.
          minLength: 1

    CredentialResetRedeemRequest:
      type: object
      description: >-
        The one-time code the target was handed, and the credential value THEY
        choose (SEC-050).
      required: [code, password]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The one-time `credential-reset`-purpose grant code.
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    SessionSummary:
      type: object
      description: >-
        The caller's own session. It deliberately carries NO session token:
        that value rides the HttpOnly cookie and is never readable by the
        page. `csrf_token` is present only on the responses that MINT a
        session (login, claim), since it is the double-submit value the client
        must then echo (SEC-024).
      required: [principal_id, kind, role, aal, session_id]
      additionalProperties: false
      properties:
        principal_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          description: The principal kind (`security-model.md` SEC-001).
          enum: [user, screen, relay, pack-service, ingest-token, system-console]
        role:
          type: string
          description: The effective role this principal holds (`security-model.md` SEC-010).
          enum: [owner, admin, operator, viewer]
        aal:
          type: string
          description: >-
            Authenticator Assurance Level (SEC-021/022). A `recovery` session
            is minted by redeeming a recovery-purpose grant and is restricted
            until the target principal completes TOTP re-enrolment.
          enum: [standard, recovery]
        session_id:
          $ref: "#/components/schemas/Ulid"
        csrf_token:
          type: string
          description: >-
            The double-submit CSRF token, returned only when this response
            minted the session. Echo it in `X-CSRF-Token` on every mutating
            request (SEC-024).

    ScopeNode:
      type: object
      description: A node in the org → site → group → screen tree.
      required: [id, kind, parent_id, name, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: >-
            Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
            Optional; unique within this resource's scope node among
            resources of the same type; MAY be used in place of `id` in a
            cross-reference; preserved unchanged through an export/apply
            round trip. Every resource in this API carries this same
            convention, not only scope-nodes and automations.
          x-go-type: "*string"
        kind:
          type: string
          enum: [org, site, group, screen]
        parent_id:
          type: ["string", "null"]
          description: The parent scope node's ULID. `null` only for the single root org node.
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        tz:
          type: string
          description: IANA time zone name. Meaningful at site level and below; a screen-level value overrides its site.
        lat:
          type: number
          minimum: -90
          maximum: 90
        long:
          type: number
          minimum: -180
          maximum: 180
        account_state:
          type: ["string", "null"]
          description: Present only on the org node (DAT-010).
          enum: [trial, active, suspended, closed, purged, null]
          x-go-type: "*string"
        entitlements:
          # `object`, not `["object", "null"]`: absent and null are not two ways to
          # say the same thing here. The server OMITS the member when a node has no
          # entitlements document, and DAT-013 gives `null` no meaning — an org MUST
          # carry an object (possibly empty) and every other kind MUST carry nothing —
          # so a literal null is a body to refuse rather than a state to declare.
          # It is also the spelling oapi-codegen can generate: a ["object","null"]
          # type array fails its type resolver outright.
          type: object
          description: >-
            Present only on the org node, possibly empty (DAT-013). This schema is
            `additionalProperties: false` and did not declare this member, while
            the server has always served it — so every org-node response was
            undeclared here.
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    ScopeNodeCreate:
      type: object
      description: >-
        Note what is NOT expressible as `required` here: `account_state` and
        `entitlements` are mandatory on an `org`-kind node and forbidden on every
        other kind, which is conditional on `kind` and so belongs to
        data-model/1's own per-field validation (DAT-010/013), not to this
        schema's `required` list. Declaring them unconditionally required would
        make every site, group and screen uncreatable; omitting them entirely —
        which is what this schema did — made the org node uncreatable through
        either generated client.
      required: [kind, name]
      additionalProperties: false
      properties:
        account_state:
          type: ["string", "null"]
          description: >-
            Mandatory on an `org`-kind node and forbidden on every other kind
            (contracts/data-model-1.md DAT-010). A body violating either half is
            rejected SCOPE_NODE_ACCOUNT_STATE_INVALID.
          enum: [trial, active, suspended, closed, purged, null]
          x-go-type: "*string"
        entitlements:
          # `object`, not `["object", "null"]`: absent and null are not two ways to
          # say the same thing here. The server OMITS the member when a node has no
          # entitlements document, and DAT-013 gives `null` no meaning — an org MUST
          # carry an object (possibly empty) and every other kind MUST carry nothing —
          # so a literal null is a body to refuse rather than a state to declare.
          # It is also the spelling oapi-codegen can generate: a ["object","null"]
          # type array fails its type resolver outright.
          type: object
          description: >-
            Mandatory on an `org`-kind node, where an empty object is explicitly
            admitted, and forbidden on every other kind (DAT-013). This surface
            fixes the field's presence and placement only; the document's own
            internal schema is defined elsewhere. A body violating either half is
            rejected SCOPE_NODE_ENTITLEMENTS_INVALID.
          additionalProperties: true
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        kind:
          type: string
          enum: [org, site, group, screen]
        parent_id:
          type: ["string", "null"]
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        tz:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        long:
          type: number
          minimum: -180
          maximum: 180

    ScopeNodeUpdate:
      type: object
      description: >-
        Partial update — every field optional, at least one required. See
        ScopeNodeCreate for why the two account members are not `required`.

        `kind` is declared because the server accepts it: a node can be re-kinded,
        and what refuses a DANGEROUS re-kind is the tree rules
        (SCOPE_NODE_PARENT_INVALID), not this schema. It was briefly left out on
        the reasoning that declaring it "would say nothing this document can
        enforce" — true while nothing enforced the declared member set, and false
        the moment something did: omitting it then makes re-kinding impossible
        through the surface, which is a behaviour change no requirement asks for.
      minProperties: 1
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [org, site, group, screen]
        parent_id:
          type: ["string", "null"]
          description: >-
            Re-parents the node. `null` only for the single root org node
            (DAT-002); a value naming no existing node, or one whose kind may not
            carry this child, is rejected SCOPE_NODE_PARENT_INVALID.
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        account_state:
          type: ["string", "null"]
          description: >-
            Mandatory on an `org`-kind node and forbidden on every other kind
            (contracts/data-model-1.md DAT-010). A body violating either half is
            rejected SCOPE_NODE_ACCOUNT_STATE_INVALID.
          enum: [trial, active, suspended, closed, purged, null]
          x-go-type: "*string"
        entitlements:
          # `object`, not `["object", "null"]`: absent and null are not two ways to
          # say the same thing here. The server OMITS the member when a node has no
          # entitlements document, and DAT-013 gives `null` no meaning — an org MUST
          # carry an object (possibly empty) and every other kind MUST carry nothing —
          # so a literal null is a body to refuse rather than a state to declare.
          # It is also the spelling oapi-codegen can generate: a ["object","null"]
          # type array fails its type resolver outright.
          type: object
          description: >-
            Mandatory on an `org`-kind node, where an empty object is explicitly
            admitted, and forbidden on every other kind (DAT-013). This surface
            fixes the field's presence and placement only; the document's own
            internal schema is defined elsewhere. A body violating either half is
            rejected SCOPE_NODE_ENTITLEMENTS_INVALID.
          additionalProperties: true
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        tz:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        long:
          type: number
          minimum: -180
          maximum: 180

    ScopeNodeListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScopeNode"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Screen:
      type: object
      description: >-
        A screen's own identity row — the row a `screen_id` names
        (`data-model/1` DAT-004a). It is NOT the `screen`-kind scope node it is
        placed under: DAT-004 lets a screen row hang off a node of ANY kind, so
        two screens may share one `group` node and a screen may sit directly
        under a `site`. The `screen_id` a `relay/1` `screen_programs` entry
        carries (REL-061), a player learns at pairing redemption (`player/1`
        PLY-035), and a `content.played` event records (`events/1` EVT-050) all
        name this row's `id`.
      required: [id, name, scope_node, device_id, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        device_id:
          type: ["string", "null"]
          description: >-
            The `device_id` of an adopted device representing the same physical
            display (`player/1` PLY-124). Optional — a screen and an adopted
            device remain distinct rows — but a stated value MUST name an
            existing adopted device.
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        labels:
          $ref: "#/components/schemas/LabelMap"
        override:
          $ref: "#/components/schemas/ScreenOverride"
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    SlideNavItem:
      type: object
      description: >-
        One entry of a `nav` layer's menu (`data-model/1` DAT-043): the label the
        viewer reads and the cast-local slide id pressing OK jumps to. Both
        members are required — a label-less item is an unreadable target and a
        target-less one is a menu entry that accepts a press and performs
        nothing. The target names a slide by `CastSlide.id`, never by an index
        into delivered content: a cast's slides are projected into the same
        content array as whatever else the playlist carries, so an index authored
        against the cast addresses the wrong item the moment an entry is inserted
        before it. `POST/PATCH /casts` additionally refuses a target naming no
        slide of the same cast (`CAST_NAV_TARGET_UNKNOWN`).
      required: [label, target_slide_id]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        target_slide_id:
          type: string
          minLength: 1
          maxLength: 64
    SlideLayer:
      type: object
      description: >-
        One positioned native element of a slide (`data-model/1` DAT-043). Layers
        are drawn in ARRAY ORDER — the index IS the z-order — inside a fixed
        1920x1080 top-left-origin canvas a player scales to its panel, so
        geometry is authored against those bounds whatever the real resolution
        is. Every member beyond `kind` and the geometry is kind-specific.
      required: [kind, x, y, w, h]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [text, rect, image, clock, date, countdown, weather, entity, video, ping, nav, derive]
          description: >-
            The closed layer-kind set, and it MUST stay equal to
            `internal/shared/wire`'s own (`slideLayerKinds` plus
            `authoredOnlyLayerKinds`) — same members, same
            order. The four LIVE kinds beyond the static three plus `clock` are
            the widgets: `date` and `countdown` are computed by the player from
            its own clock, `weather` and `entity` are resolved by the box at
            Lease issuance (`internal/slidelive`) and drawn verbatim. `video` is
            image's twin — the second kind whose substance is bytes in the
            content origin, authored as an `asset_ref` and fetched +
            content-address-verified by the player before it is presented — and
            the only moving element a slide can carry; a player draws it as a
            positioned Video node looped for the slide's dwell time. They are
            all listed here because this enum is the AUTHORING gate: a kind the
            player renders and this enum omits is a widget nothing can ever
            create — the shape of defect this repo keeps producing, and the one
            that shipped in wave 1 (the four widget kinds landed on the wire and
            the player, and `POST /casts` answered 422 for every one of them).
            `ping` and `nav` are the INTERACTIVE kinds — the first layers whose
            value flows from the screen back to the box. A `ping` is a labelled
            button the viewer focuses with the remote and presses OK on, raising
            a durable `screen.interaction` event an automation can trigger on; a
            `nav` is a D-pad menu whose items jump to another slide of the same
            cast.

            `derive` is the one AUTHORING-ONLY member: it is the rasterized
            fallback for what no player node can draw, and both content
            projections rewrite it into an `image` layer before serving, so it
            appears here (an operator authors it) and never on a Lease. A
            standalone `qr` kind stays deliberately ABSENT: a QR code's substance
            is a raster, so it is authored as a `derive` layer carrying a `qr`
            `DeriveSpec` and minted by the off-appliance rasterizer, rather than
            as a top-level kind no player node could ever draw.
        ping_name:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9_.-]*$"
          description: >-
            The stable name a press on this layer reports. A layer carrying one
            is FOCUSABLE: the player gives it a focus region the viewer can move
            the remote onto, and OK posts the press back to the relay, which
            raises a durable `screen.interaction` event carrying this exact
            value — the value a `rules/1` `event` trigger matches on. Required
            for `ping`, and OPTIONAL FOR EVERY OTHER KIND, which is what makes an
            ordinary widget (an `entity` reading, an `image`, a `rect` used as an
            invisible hotspot) an interactive one with no second mechanism. It is
            a slug rather than free text because an automation author retypes it
            into a trigger's match constraint, where "Front Desk " and
            "front desk" would look identical and never match. A layer carrying
            one must also be at least 48x48 canvas pixels: below that a focus
            outline cannot be told apart at television viewing distance, so a
            viewer cannot see what pressing OK would do.
        items:
          type: array
          minItems: 1
          maxItems: 8
          description: >-
            A `nav` layer's ordered menu, and legal on NO other kind. The items
            are laid out inside the layer's own box along its longer axis — a
            wide nav is a horizontal row, a tall one a vertical column — so the
            drawn geometry alone decides the orientation and there is no second
            `layout` member that could contradict it. Bounded at eight because
            the items share the box: past that the per-item region is too small
            to read at viewing distance or to show focus on. Each item's own
            laid-out cell must likewise be at least 48x48 canvas pixels, which is
            a joint constraint on the menu's size and its item count.
          items:
            $ref: "#/components/schemas/SlideNavItem"
        x:
          type: integer
          minimum: 0
          maximum: 1920
        y:
          type: integer
          minimum: 0
          maximum: 1080
        w:
          type: integer
          minimum: 1
          maximum: 1920
        h:
          type: integer
          minimum: 1
          maximum: 1080
        text:
          type: string
          description: >-
            The literal string for a `text` layer, and a FORMAT for every kind
            whose content is generated rather than authored. For `clock` and
            `date` it is the Go reference-time layout (`15:04:05`, `3:04 PM`,
            `Monday, January 2`) the player renders the current LOCAL time or
            date through — not a strftime string. For `countdown` it is an
            OPTIONAL remaining-time layout in that kind's own tiny grammar
            (`DD`/`D` days, `HH`/`H` hours, `MM`/`M` minutes, `SS`/`S` seconds;
            an empty text means the player's `HH:MM:SS`) — deliberately not a
            reference-time layout, because a duration has no hour-of-day. For
            `weather` it is the required display template the BOX substitutes
            into (`{temp}` °F, `{tempc}` °C, `{cond}`), and for `entity` the
            optional one (`{state}`, the whole template when omitted). Required
            for `text`, `clock`, `date` and `weather`; unused by `rect`/`image`.
        asset_ref:
          type: string
          description: >-
            An `image` or `video` layer's content-addressed `sha256:` reference
            — the only half of a content-bearing layer that is AUTHORED. Its
            fetch `url` is derived from the content origin at projection time.
        url:
          type: string
          description: >-
            An `image` or `video` layer's direct content-origin fetch target,
            derived at projection time and present on a SERVED slide. It is
            never AUTHORED: a create or update need not supply it, and one that
            does has it IGNORED — the stored layer carries only the `asset_ref`,
            and a read of the row will not echo a supplied `url` back. That is
            not tidiness. A content URL is signed and expires (`relay/1`
            REL-066a), so a stored copy is a link that dies: an editor that
            saved one showed broken images the next time the cast was opened.
            An authoring surface holds the `asset_ref` and resolves a live URL
            from `GET /content` at the moment it needs to fetch.
        target_ms:
          type: integer
          minimum: 1
          description: >-
            A `countdown` layer's target instant, in Unix epoch MILLISECONDS
            (UTC) — the same absolute-instant unit every other time on this wire
            uses, never a local wall time and never seconds. Absolute is what
            lets the player count down without knowing the authoring timezone.
            Required and strictly positive for `countdown`, unused elsewhere; a
            target already past renders as all zeroes rather than as a negative,
            so it is deliberately NOT rejected here.
        entity_id:
          type: string
          description: >-
            The platform entity an `entity` layer displays the current state of
            — the same identifier a device's `entities[].entity_id` carries.
            Required for `entity`, unused elsewhere. It is the AUTHORED half of
            an entity widget; the resolved display string is filled by the box
            at Lease issuance and never appears in an authored row (the same
            authored/derived split an `image` layer's `asset_ref`/`url` has,
            which is why there is no `value` member here).
        font_px:
          type: integer
          minimum: 1
          description: >-
            Pixel font size for any Label-drawn kind — `text`, `clock`, `date`,
            `countdown`, `weather`, `entity`. Optional; an omitted size renders
            at the player's own default.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: >-
            A `rect`'s fill (required) or a Label-drawn kind's foreground
            (optional). `#RRGGBB` wherever present.
        align:
          type: string
          enum: [left, center, right]
          description: A Label-drawn layer's horizontal alignment. Optional.
        derive:
          allOf:
            - $ref: "#/components/schemas/DeriveSpec"
          description: >-
            A `derive` layer's rasterization spec — what the off-appliance
            renderer must draw. Required for `derive` and REJECTED on every other
            kind: a derive block hung on a text layer would be ignored by every
            projection, which is a styling control that silently does nothing.
        derived_from:
          type: string
          description: >-
            The spec digest the layer's current `asset_ref` was rendered from,
            written by `waiveo-derive` alongside the `asset_ref`, never authored
            by hand. It is what distinguishes a CURRENT raster from one the
            operator has since edited past: the digest covers the spec AND the
            layer's `w`/`h`, so resizing a layer marks it for re-render exactly as
            changing its text does. A stale layer keeps serving its old PNG — an
            edit nobody has rendered yet must never blank a screen.
    DeriveSpec:
      type: object
      description: >-
        What the off-appliance rasterizer must draw for one `derive` layer. It is
        a CLOSED, declarative vocabulary rather than CSS or HTML on purpose: the
        renderer drives a real browser, so a spec that could carry markup would
        make an authored cast a script-injection vector into whichever machine
        runs the derive tool. Every member here is a scalar the renderer
        validates and then formats into markup it wrote itself.
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [qr, text, rect]
          description: >-
            What to draw. `qr` is a scannable symbol — there is no player node
            that makes one, so this is the only way a slide can carry a QR code
            at all. `text` and `rect` are the STYLED forms of the two native
            kinds: use them only when the layer needs a gradient, a shadow, a
            rounded border or a custom face, because a native `text`/`rect` layer
            costs no content, needs no render, and re-styles instantly.
        data:
          type: string
          maxLength: 512
          description: >-
            The payload a `qr` spec encodes. The cap is well below the format's
            theoretical ceiling: a denser symbol is unreadable across a room, so
            accepting one would mean authoring a sign that cannot work.
        ec_level:
          type: string
          enum: [L, M, Q, H]
          description: >-
            A `qr` spec's error-correction level. Optional; the default is `M`,
            which is what a sign read at an angle in bad light wants.
        text:
          type: string
          maxLength: 2048
          description: >-
            The LITERAL string a `text` spec draws — never a format. A rasterized
            layer is a frozen picture, so a clock or a countdown must stay a
            native live layer and there is deliberately no way to ask for one
            here.
        font_px:
          type: integer
          minimum: 1
          description: >-
            Text size in canvas pixels. `text` only; the default is 64. Rejected
            on `qr` and `rect` for the same reason `align` is — the renderer
            writes it into the text rule and nowhere else, so a size there would
            be a control that silently does nothing.
        font_family:
          type: string
          maxLength: 128
          description: >-
            The family name the text is drawn in. With `font_asset_ref` it is the
            name the embedded face registers under; without one it must be a
            family the rendering host already has. `text` only, rejected on `qr`
            and `rect`.
        font_asset_ref:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            CUSTOM TYPOGRAPHY — a content-addressed reference to a font file
            (TTF/OTF/WOFF2) in the content origin, which the renderer fetches and
            embeds before drawing. It is a real content reference: it is checked
            to exist when the cast is written, and it is protected from the
            content retention sweep for as long as a cast names it.

            `text` only, and rejected on `qr` and `rect` more firmly than the
            other two typography members: the embedded face can only be drawn in
            by a text run, so a face named on either of those would be inert AND
            would pin a font file against the retention sweep for a layer that
            never uses it.
        align:
          type: string
          enum: [left, center, right]
          description: >-
            Horizontal alignment of a `text` spec inside the layer box. Optional;
            default `left`. Rejected on `qr` and `rect` — a symbol is always
            centred and a rect fills its box, so an alignment there would be a
            control that silently does nothing.
        valign:
          type: string
          enum: [top, middle, bottom]
          description: >-
            Vertical alignment of a `text` spec inside the layer box. Optional;
            default `top`. It exists because a rasterized layer's box is exactly
            the layer geometry — unlike a native Label there is no larger canvas
            to centre against later. Rejected on `qr` and `rect`.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: >-
            The foreground: text colour for `text`, DARK MODULE colour for `qr`.
            Optional; the default is `#FFFFFF`. Rejected on `rect`, which has no
            foreground — its picture is its `fill`, `border` and `shadow`.
        fill:
          $ref: "#/components/schemas/DeriveFill"
        shadow:
          $ref: "#/components/schemas/DeriveShadow"
        border:
          $ref: "#/components/schemas/DeriveBorder"
    DeriveFill:
      type: object
      description: >-
        The backing behind the foreground — the gradient no native node can
        draw. Absent means a TRANSPARENT background, so a derive layer
        composites over whatever native layers sit beneath it.
      required: [kind, from]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [solid, linear, radial]
          description: >-
            `solid` exists beside the two gradients so a spec can state a flat
            backing under a shadow or a rounded border without pretending to be a
            gradient with two equal stops.
        from:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: The solid colour, or the gradient's first stop.
        to:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: >-
            The gradient's second stop. Required for `linear`/`radial` and
            REJECTED for `solid` — a member the renderer would ignore is a
            setting that silently does nothing.
        angle_deg:
          type: integer
          minimum: 0
          maximum: 359
          description: >-
            A `linear` gradient's direction, CSS convention: 0 points up, 90
            points right, increasing clockwise. Rejected on the other two kinds.
    DeriveShadow:
      type: object
      description: >-
        A drop shadow cast by the layer box. Offsets and blur are canvas pixels.
      additionalProperties: false
      properties:
        dx:
          type: integer
        dy:
          type: integer
        blur:
          type: integer
          minimum: 0
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Optional; the default is `#000000`.
        opacity_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Shadow opacity as an integer PERCENT rather than a float,
            deliberately: the spec is hashed to produce the raster's content
            address, and a float would make that address depend on decimal
            formatting.
    DeriveBorder:
      type: object
      description: >-
        A stroked and/or rounded outline. A radius with a zero width is legal and
        useful — it rounds the FILL without stroking an edge.
      additionalProperties: false
      properties:
        width:
          type: integer
          minimum: 0
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Required when `width` is non-zero.
        radius:
          type: integer
          minimum: 0
    DerivePendingLayer:
      type: object
      description: >-
        One outstanding rasterization: a complete work order for
        `waiveo-derive`. It carries WHAT to draw (`spec`, at `w`x`h`) and WHERE
        the result goes (`source` + `resource_id`, then `slide_id` or
        `item_index`, then `layer_index`), so the tool needs no second read to
        act on it.

        A `derive` layer lives in either of the two shapes that carry an
        authored layer stack — a cast slide, or a playlist item's inline
        `slide` — and both are rewritten into an ordinary `image` by the same
        projection, so both are reported here. `source` says which shape this
        job is in, and exactly one of the two locators is present with it.
      required: [source, resource_id, layer_index, state, spec_digest, w, h, spec]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [cast, playlist]
          description: >-
            Which authored shape carries the layer. `cast` — a cast slide,
            located by `slide_id`. `playlist` — a `source: "slide"` playlist
            item's inline slide, located by `item_index` (an inline slide has no
            id of its own).
        resource_id:
          type: string
          description: The id of the cast or playlist row the layer is authored in.
        resource_name:
          type: string
          description: That row's name, for a human reading the queue.
        slide_id:
          type: string
          description: >-
            The cast slide's document-local id. Present when `source` is `cast`
            and absent otherwise.
        item_index:
          type: integer
          minimum: 0
          description: >-
            The index of the playlist item whose inline slide carries the layer.
            Present when `source` is `playlist` and absent otherwise.
        layer_index:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [pending, stale]
          description: >-
            `pending` — no PNG has ever been produced, so the projection omits the
            layer and the rest of the slide still draws. `stale` — a PNG exists
            but the spec or the geometry has changed since; the OLD picture keeps
            being served until the tool catches up, because an edit nobody has
            rendered yet must never blank a screen.
        spec_digest:
          type: string
          description: >-
            The digest the tool must write back as `derived_from` after uploading
            the PNG. Supplying it here rather than making the tool recompute it is
            what keeps one definition of the digest on the server side of the
            loop.
        w:
          type: integer
        h:
          type: integer
        spec:
          $ref: "#/components/schemas/DeriveSpec"
    DerivePendingList:
      type: object
      required: [derive_jobs]
      additionalProperties: false
      properties:
        derive_jobs:
          type: array
          items:
            $ref: "#/components/schemas/DerivePendingLayer"
    CastSlide:
      type: object
      description: >-
        One slide of a cast (`data-model/1` DAT-043): an id unique within its own
        cast, an optional dwell time, and the ordered layer stack a player draws.
        The id names a position in one authored document — what a reorder or an
        undo operates on — and is deliberately not a ULID, because nothing
        outside the cast ever references it.
      required: [id, layers]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        duration_ms:
          type: integer
          minimum: 1
          description: >-
            This slide's dwell time. When omitted the projected content item
            falls back to the referencing playlist item's own
            `duration_seconds` (DAT-042), and when neither is stated the player
            applies its own default.
        layers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SlideLayer"
    Cast:
      type: object
      description: >-
        An authored slidecast (`data-model/1` DAT-043) — the ordered set of
        slides an operator builds once and schedules onto screens by referencing
        it from a playlist item (`source: "cast"`). One cast edit changes every
        screen playing it, which is the whole reason it is a row rather than a
        shape inlined into a playlist.
      required: [id, scope_node, name, slides, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        slides:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CastSlide"
        default_duration_ms:
          $ref: "#/components/schemas/CastDefaultDurationMs"
        template:
          $ref: "#/components/schemas/CastTemplateFlag"
        labels:
          $ref: "#/components/schemas/LabelMap"
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    CastDefaultDurationMs:
      type: ["integer", "null"]
      minimum: 1
      x-go-type: "*int"
      description: >-
        The cast's own default dwell time, applied to every slide of it that
        states no `duration_ms` and whose referencing playlist item states no
        `duration_seconds` (`data-model/1` DAT-042's full order is: slide →
        item → cast default → the player's own default). Omit it for "no
        cast-wide default"; zero is not a value, it is the absent field.

        `null` is admitted for one concrete reason and is not decoration: a
        PATCH shallow-merges over the stored body, so an UPDATE that wants to
        REMOVE a cast-wide default has no other way to say so — omitting the
        member means "leave it alone", and the minimum of 1 (correctly) refuses
        the zero that would otherwise be the clear. A row cleared that way is
        then SERVED carrying the member as null (the store persists the
        post-merge bytes verbatim and normalizes only schema-REQUIRED members),
        which is why the response schema admits null too: null and absent mean
        the same thing to every reader of this field.
    CastTemplateFlag:
      type: boolean
      description: >-
        Marks this cast a TEMPLATE — a starting point new casts are created
        from, not a document a screen plays (`data-model/1` DAT-043). A
        playlist item referencing one is refused
        (`CAST_TEMPLATE_NOT_SCHEDULABLE`), because a template exists to be
        edited as the source of future casts and a screen playing it would
        change every time someone improved the starting point. Omitted (and
        absent from a served row) means an ordinary cast.
    CastCreate:
      type: object
      required: [scope_node, name, slides]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        slides:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CastSlide"
        default_duration_ms:
          $ref: "#/components/schemas/CastDefaultDurationMs"
        template:
          $ref: "#/components/schemas/CastTemplateFlag"
        labels:
          $ref: "#/components/schemas/LabelMap"
    CastUpdate:
      type: object
      description: >-
        Partial update — every member optional, at least one present. `slides`
        replaces the whole ordered list; there is no per-slide patch.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        slides:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CastSlide"
        default_duration_ms:
          $ref: "#/components/schemas/CastDefaultDurationMs"
        template:
          $ref: "#/components/schemas/CastTemplateFlag"
        labels:
          $ref: "#/components/schemas/LabelMap"
    CastListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Cast"
        cursor:
          $ref: "#/components/schemas/Cursor"

    PlaylistInlineSlide:
      type: object
      description: >-
        A `source: "slide"` playlist item's INLINE authored slide (`data-model/1`
        DAT-041): one ordered layer stack, carried on the item itself rather than
        referenced. It is the anonymous twin of a `CastSlide` — no `id`, because
        nothing outside the item can address it, and no `duration_ms`, because
        the item's own `duration_seconds` is its dwell time. Its layers pass the
        SAME authoring gate a cast's slides do, with one difference that follows
        from having no cast around it: a `nav` layer jumps by cast-local slide
        id, and an inline slide has no sibling slides to target, so a `nav` layer
        is refused here (`PLAYLIST_ITEM_SLIDE_LAYERS_INVALID`). A `ping` is
        legal — pressing it raises a `screen.interaction` event, which needs no
        slide id-space at all.
      required: [layers]
      additionalProperties: false
      properties:
        layers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SlideLayer"

    PlaylistItem:
      type: object
      description: >-
        One entry of a playlist's `items` (DAT-041). `source` selects which
        content shape the entry uses — `asset` carries `asset_ref`, `playable`
        carries `pack_id` + `content_id`, `slide` carries an inline `slide`,
        `cast` carries `cast_id` — and data-model/1 enforces that pairing with
        its own per-field codes.
        A `cast` entry is the one source that is not one-to-one with a played
        item: it expands, at projection time, into one slide content item per
        slide of the referenced cast, in authored order.
      required: [source]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [asset, playable, slide, cast]
          description: >-
            The CLOSED source vocabulary (DAT-041). `slide` was shipped on the
            wire and honoured by both content projections before it was declared
            here, which made this document's `additionalProperties: false` +
            enum an active lie: a generated client could not express a playlist
            the server accepts, and the console's own round trip dropped the
            inline slide. A value outside this set is refused
            (`PLAYLIST_ITEM_SOURCE_INVALID`) rather than stored, because no
            projection has an arm for one — the item would be kept and then
            contribute nothing to the screen.
        asset_ref:
          type: string
        content_type:
          type: string
          enum: [image, video]
          description: >-
            What this `asset` item's bytes ARE, and therefore how a screen
            presents them: `image` is drawn as a still for the item's dwell
            time, `video` is played. Optional; an item that states none is
            served as `image` (`relay/1` REL-061a's stated default for an absent
            content_type), so every playlist authored before this field existed
            behaves exactly as it did. Only meaningful on `source: "asset"` — a
            `cast` item's content type is decided by its source — and stating it
            on any other source is refused, rather than stored as an intent
            nothing will honour.
        pack_id:
          type: string
        content_id:
          type: string
        slide:
          $ref: "#/components/schemas/PlaylistInlineSlide"
        cast_id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: >-
            The cast this entry plays, required when `source` is `cast`. It MUST
            name an existing cast row, and that cast cannot be deleted while
            this reference stands (DAT-043).
        duration_seconds:
          type: integer
          x-go-type: "*int"
    PlaylistCreate:
      type: object
      required: [scope_node, name, items]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistItem"
        labels:
          $ref: "#/components/schemas/LabelMap"
    PlaylistUpdate:
      type: object
      description: Partial update — every member optional, at least one present.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistItem"
        labels:
          $ref: "#/components/schemas/LabelMap"
    ScheduleCreate:
      type: object
      required: [scope_node, name]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
        fallback_id:
          $ref: "#/components/schemas/Ulid"
        priority:
          type: integer
          x-go-type: "*int"
        misfire:
          type: string
        labels:
          $ref: "#/components/schemas/LabelMap"
    ScheduleUpdate:
      type: object
      description: Partial update — every member optional, at least one present.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
        fallback_id:
          $ref: "#/components/schemas/Ulid"
        priority:
          type: integer
          x-go-type: "*int"
        misfire:
          type: string
        labels:
          $ref: "#/components/schemas/LabelMap"
    DaypartCreate:
      type: object
      required: [schedule_id, scope_node, days_of_week, start_time, end_time, display_power]
      additionalProperties: false
      properties:
        schedule_id:
          $ref: "#/components/schemas/Ulid"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        days_of_week:
          type: array
          items:
            type: integer
        start_time:
          type: string
        end_time:
          type: string
        display_power:
          type: string
        playlist_id:
          $ref: "#/components/schemas/Ulid"
        preset_batch_id:
          $ref: "#/components/schemas/Ulid"
        misfire:
          type: string
        name:
          type: string
    DaypartUpdate:
      type: object
      description: Partial update — every member optional, at least one present.
      minProperties: 1
      additionalProperties: false
      properties:
        schedule_id:
          $ref: "#/components/schemas/Ulid"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        days_of_week:
          type: array
          items:
            type: integer
        start_time:
          type: string
        end_time:
          type: string
        display_power:
          type: string
        playlist_id:
          $ref: "#/components/schemas/Ulid"
        preset_batch_id:
          $ref: "#/components/schemas/Ulid"
        misfire:
          type: string
        name:
          type: string
    ScreenOverride:
      type: object
      description: >-
        A screen's program override (`data-model/1` DAT-004c): a per-screen
        content pin that supersedes whatever the scheduling core resolves for
        that screen, for as long as it applies. It is deliberately not a second
        scheduling mechanism — no cascade, no priority order, no layering, no
        recurrence — it is "show this here, now, until it is cleared or lapses",
        which is what an operator's push-now gesture and an automation's
        `play_cast`/`show_alert` action (`rules/1` RUL-234/RUL-235) both need
        and what a schedule cannot express.
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [play, alert]
          description: >-
            `play` is the ordinary assignment and delivers at `scheduled`
            priority; `alert` is the takeover and delivers at `preempt`, so a
            player interrupts the item it is mid-way through (`player/1`
            PLY-108).
        cast_id:
          allOf:
            - $ref: "#/components/schemas/Ulid"
          description: >-
            The cast whose slides the screen plays. Exactly one of `cast_id`
            and `message` is stated.
        message:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            A literal alert message, shown as one generated slide. Admissible
            only under `mode: "alert"` — a `play` override names a cast.
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: >-
            The instant the override lapses. Absent means no expiry. A lapsed
            override is treated as absent at resolution time with no write
            required to retire it (DAT-004d), so an alert self-limits even on a
            relay that has lost its app peer.
        set_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: The instant the override was imposed. Informational.

    ScreenCreate:
      type: object
      required: [name, scope_node]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        device_id:
          type: ["string", "null"]
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        labels:
          $ref: "#/components/schemas/LabelMap"
        # No `override` member, deliberately. An override is imposed and cleared
        # through `PUT`/`DELETE /screens/{screen_id}/now`, never as a member of a
        # resource create or edit — see ScreenNowRequest for why.

    ScreenUpdate:
      type: object
      description: Partial update — every field optional, at least one required.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        device_id:
          type: ["string", "null"]
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        labels:
          $ref: "#/components/schemas/LabelMap"
        # No `override` member, deliberately — see ScreenCreate's own note.

    ScreenNowRequest:
      type: object
      description: >-
        What to show on a screen right now: the body of the ONE surface that
        imposes a screen's program override (`data-model/1` DAT-004c). Its
        members are that override's, with one substitution — the row stores an
        absolute `expires_at` and this body states a RELATIVE `ttl_seconds`,
        because "show this for sixty seconds" is what an operator means and
        because deriving the instant server-side keeps a caller's clock skew from
        deciding when an alert ends.

        There is deliberately no `override` member on `ScreenCreate` or
        `ScreenUpdate`: imposing an override is an imperative act on a physical
        display, and burying it inside a resource edit hides it from anything
        reading the route — audit, rate limiting, authorization review — and
        makes "clear it" an awkward explicit `null` rather than a `DELETE`.
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [play, alert]
          description: >-
            `play` is the ordinary assignment and delivers at `scheduled`
            priority; `alert` is the takeover and delivers at `preempt`, so a
            player interrupts the item it is mid-way through (`player/1`
            PLY-108). DAT-004c admits a literal `message` only under `alert`.
        cast_id:
          allOf:
            - $ref: "#/components/schemas/Ulid"
          description: >-
            The cast whose slides the screen plays. Exactly one of `cast_id` and
            `message` is stated — a body naming neither says nothing to show, and
            one naming both is two instructions with no rule ranking them, which
            a server resolving by precedence would turn into the wrong content on
            a wall. A `cast_id` naming no cast row is REFUSED here (DAT-004c):
            accepting it would pin the screen to an empty content array with its
            schedule suppressed — a dark screen with no error anywhere.
        message:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            A literal alert message, shown as one generated slide with no
            authored cast needed. Admissible only under `mode: "alert"`.
        ttl_seconds:
          type: integer
          minimum: 1
          description: >-
            How long the override lasts, in seconds from the moment it is
            imposed; omitted means it lasts until it is explicitly cleared. The
            server converts it to the row's absolute `expires_at`, after which
            the override is treated as absent at resolution time with NO write
            required to retire it (DAT-004d) — so an alert self-limits even on a
            relay that has lost its app peer.

    ScreenNow:
      type: object
      description: >-
        A screen's active program override, as it now stands — the same override
        the screen row carries (`ScreenOverride`), with the screen's own id and
        under the operator-facing name the push-now surface uses. `source` names
        which content member is populated, so a consumer switches on one closed
        value rather than inferring intent from which string happens to be empty.
      required: [screen_id, mode, source]
      additionalProperties: false
      properties:
        screen_id:
          $ref: "#/components/schemas/Ulid"
        mode:
          type: string
          enum: [play, alert]
        source:
          type: string
          enum: [cast, message]
        cast_id:
          $ref: "#/components/schemas/Ulid"
        message:
          type: string
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: >-
            The instant the override lapses; absent means it lasts until cleared.
        pushed_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: The instant the override was imposed (the row's `set_at`).

    ScreenStatus:
      type: object
      description: >-
        One screen's authored identity joined to what the relays have observed of
        it. See `listScreenStatus` for how the ages are to be read and why
        `reachability` never says "offline".
      required:
        [screen_id, reachability, live_window_ms, content_transfer_window_ms,
         fetching_max_unacked_pulls, paired, last_pull_age_ms, last_ack_age_ms,
         last_render_start_age_ms, unacked_pulls, report_age_ms, content_count,
         acked_content_count, rejected]
      additionalProperties: false
      properties:
        screen_id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          description: The screen row's own display name.
        scope_node:
          $ref: "#/components/schemas/Ulid"
        relay_id:
          type: string
          description: The relay whose report this status came from; absent when no relay has reported this screen.
        reachability:
          type: string
          enum: [live, fetching, rejected, stale, never_seen]
          description: >-
            `live` — the screen contacted its relay within `live_window_ms`
            (a program pull, or the acknowledgement that answers one) and is
            not refusing what it was handed.
            `fetching` — the relay handed this screen a Lease it has not
            acknowledged, the pull is within `content_transfer_window_ms`, and
            no more than `fetching_max_unacked_pulls` pulls are outstanding: the
            shipped player would still be downloading and verifying the content,
            during which the PREVIOUS program stays on the wall. Not a fault,
            and not a confirmation either — nothing has been heard back.
            `rejected` — the screen is in contact and is NOT taking the program
            it was handed: it either said so (`player/1` PLY-091's
            `accepted: false`, and `reject_reason` carries its words) or it has
            re-pulled past `fetching_max_unacked_pulls` while confirming
            nothing. What is on the wall is `acked_*`, not the program
            `program_revision` names. Judged before `live`, because a screen
            polling on cadence has a fresh contact whatever it does with the
            answer — this state is unreachable as a case ordered after it.
            `stale` — contact was made at some point, but not recently.
            `never_seen` — no relay has ever observed this screen pull a program.
        content_transfer_window_ms:
          type: integer
          description: >-
            How far past `live_window_ms` an unacknowledged pull is still
            reported `fetching` rather than `stale` — one whole content-fetch
            timeout, the player's own limit on a single transfer. Published for
            the same reason as `live_window_ms`: a consumer that wants to treat
            `fetching` as `stale` needs to know which line it is disagreeing
            with.
        fetching_max_unacked_pulls:
          type: integer
          description: >-
            The most outstanding pulls a screen may have and still be reported
            `fetching` rather than `stale`. A screen genuinely materialising
            content has exactly one (the transfer is serialised inside the
            player's poll loop); the allowance on top absorbs a single failed
            iteration. Past it the screen has abandoned more Leases than a
            transient failure explains, which no age threshold can express —
            such a screen answers every pull, so its `last_pull_age_ms` resets
            before any window can expire it.
        live_window_ms:
          type: integer
          description: >-
            The staleness threshold `reachability` was decided by, published so a
            consumer that wants a different line can draw it from the raw ages.
        paired:
          type: boolean
          description: Whether a relay currently holds a live channel-token session for this screen.
        last_pull_age_ms:
          type: integer
          description: Milliseconds since this screen last pulled its program, or `-1` if it never has.
        last_ack_age_ms:
          type: integer
          description: Milliseconds since this screen last acknowledged a Lease, or `-1` if it never has.
        last_render_start_age_ms:
          type: integer
          description: >-
            Milliseconds since this screen last reported beginning to present a
            content item (`player/1` PLY-110) — the only field here that is
            evidence of playback rather than of intent — or `-1` if it never has.
        unacked_pulls:
          type: integer
          description: >-
            How many program pulls the relay has served this screen since the
            last acknowledgement it saw: `0` up to date, `1` materialising the
            Lease it holds, climbing for one that keeps asking and never
            confirms. It is a COUNT, not an age, and it has no `-1` sentinel —
            zero is the ordinary healthy answer. For a screen that is not
            `live` it is the most actionable number on the row: "this wall has
            failed twenty pulls in a row" and "this wall is downloading a
            video" are different call-outs and the ages cannot tell them apart.
            Read it exactly: the relay does not correlate an acknowledgement
            with the Lease it acknowledges, so this is "pulls served since the
            last ack of any kind".
        report_age_ms:
          type: integer
          description: >-
            Milliseconds since the relay report this status came from arrived, or
            `-1` when no report has. It is what distinguishes a screen that
            stopped talking to its relay from a relay that stopped talking to
            this app peer.
        program_revision:
          type: string
          description: >-
            The `program_revision` this screen was last handed (or, if it has
            never pulled, the one waiting for it). This and the three fields
            below it are the platform's INTENT for the screen: they say what was
            sent, never what became of it. A screen refusing its program leaves
            them describing the program it refused.
        priority:
          type: string
          enum: [scheduled, preempt]
          description: That program's `player/1` PLY-108 priority — `preempt` is an operator's push-now takeover.
        display:
          type: string
          enum: [content, blank]
        content_count:
          type: integer
          description: How many content items that program carried.
        acked_program_revision:
          type: string
          description: >-
            The `program_revision` this screen last ACCEPTED (`player/1`
            PLY-091). This and the two fields below are the only program facts on
            this row the screen itself has confirmed, and are what a console
            renders as what the wall is showing: the shipped player materialises
            every asset before acknowledging, and never-wipe keeps an accepted
            program up until another is accepted. Absent when the screen has
            accepted nothing, which `last_ack_age_ms: -1` distinguishes from an
            accepted `blank` program.
        acked_display:
          type: string
          enum: [content, blank]
          description: The `display` of that accepted program.
        acked_content_count:
          type: integer
          description: How many content items that accepted program carried.
        rejected:
          type: boolean
          description: >-
            Whether this screen refused a Lease (`player/1` PLY-091's
            `accepted: false`) and has accepted nothing since. A refusal is
            cleared by an acceptance and by nothing else, so `true` is a standing
            fact rather than a historical one. `false` is also what a relay too
            old to report acceptance produces, which is the reading that claims
            the least.
        rejected_program_revision:
          type: string
          description: The `program_revision` that refusal named.
        reject_reason:
          type: string
          description: >-
            The player's own words for why it refused — PLY-091 requires a
            `reason` with `accepted: false`, and it is the actionable content of
            the `rejected` state ("content fetch failed: HTTP 403" and
            "signature invalid" send an operator to different places). Truncated
            by the relay before reporting.
        render_asset_ref:
          type: string
          description: The asset this screen last reported actually putting on screen.
        now:
          allOf:
            - $ref: "#/components/schemas/ScreenNow"
          description: The operator's active push-now override, absent when the screen is following its schedule.

    ScreenStatusListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScreenStatus"
        cursor:
          $ref: "#/components/schemas/Cursor"

    WorkspaceArchive:
      type: object
      description: One archive/1 container present in this deployment's archive directory.
      required: [name, size_bytes, created_at_ms, download_path, etag]
      additionalProperties: false
      properties:
        name:
          type: string
          description: The file name — and the exact value `POST /workspace/restore` takes as its `archive`.
        size_bytes:
          type: integer
          format: int64
        created_at_ms:
          type: integer
          format: int64
        download_path:
          type: string
          description: >-
            Where this container's bytes are served from, published rather than
            left for a client to compose: a client building the URL itself would
            be re-encoding a file name into a path, which is the one part of this
            family with a traversal question attached.
        etag:
          type: string
          description: >-
            This container's entity-tag, as the `If-Match` value
            `deleteWorkspaceArchive` requires — quoted, e.g. `"4194304-1752537600000"`.


            A container is a FILE, not a row: it has no `revision` to derive a
            validator from, so this one is derived from the bytes' own identity
            (size and last-modified instant). Its purpose is the same as every
            other ETag on this surface — a delete conditions on what the client
            last saw — and it earns its keep on the disaster-recovery path, where
            an operator copies a container BACK into the directory under a name
            that may already have been listed. Without it, a delete aimed at the
            container in the console's list could unlink the one that replaced it.

    WorkspaceArchiveList:
      type: object
      required: [items, directory]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceArchive"
        directory:
          type: string
          description: >-
            Where the containers live on the box. Published because the real
            disaster-recovery path is an operator copying a container BACK from
            off-box storage and then restoring it by name, which requires knowing
            where to put it.

    PlatformLogRecord:
      type: object
      description: >-
        One captured log line. `level` and `source` are DERIVED by reading the
        text — the process's log output is lines, not structured events — so
        `raw` always carries the whole line and a reader can judge the
        classification against what was actually written.
      required: [seq, ts_ms, level, source, message, raw]
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
          description: >-
            A monotonic per-process counter assigned at capture. It exists so
            two identical lines are distinguishable and so ordering survives a
            clock that steps backwards mid-boot, which an appliance's does
            before NTP settles — `ts_ms` alone can do neither.
        ts_ms:
          type: integer
          format: int64
          description: >-
            The app clock at capture, epoch milliseconds UTC. NOT read out of
            the line's own prefix, which the standard logger writes in local
            time with no zone.
        level:
          type: string
          enum: [error, warn, info]
          description: >-
            The derived severity. Three values, because that is as much as can
            be read out of a line honestly. A line carrying both an error and a
            warning marker is classified at the higher severity: a warning shown
            among the errors costs a glance, an error hidden among the warnings
            costs the investigation.
        source:
          type: string
          description: The derived component prefix, or `platform` for a line that carries none.
        message:
          type: string
          description: The line with the parts that became `source` (and the logger's own timestamp) removed.
        raw:
          type: string
          description: The whole line as written, minus only the standard logger's date/time prefix.

    PlatformLogPage:
      type: object
      description: >-
        A bounded window over the newest matching lines, PLUS the facts a reader
        needs to interpret a short or empty list honestly. Deliberately not the
        standard `{items, cursor}` page: this buffer's oldest end is overwritten
        while a client reads it, so a keyset cursor into it would name a record
        that no longer exists.
      required: [items, matched, retained, capacity, dropped, retained_from_ms, sources, level_counts]
      additionalProperties: false
      properties:
        items:
          type: array
          description: The matching lines, NEWEST FIRST, capped at `limit`.
          items:
            $ref: "#/components/schemas/PlatformLogRecord"
        matched:
          type: integer
          description: How many lines matched the filter before `limit` cut the window, so a page showing 200 of 4000 can say so.
        retained:
          type: integer
          description: How many lines the buffer currently holds, at any level, regardless of the filter.
        capacity:
          type: integer
          description: >-
            The buffer's size. `0` means this deployment captures nothing —
            distinguishable from a wired-but-quiet box, which reports a capacity
            with nothing yet retained.
        dropped:
          type: integer
          format: int64
          description: >-
            How many lines have been overwritten since this process started.
            Non-zero means the oldest lines of this boot are already gone, which
            is exactly when an operator should be reading journald instead.
        retained_from_ms:
          type: integer
          format: int64
          description: The oldest retained line's instant, or `0` when nothing is retained. How far back this page can see — never "since boot".
        sources:
          type: array
          description: >-
            Every distinct source currently retained, sorted. The WHOLE set, not
            the filtered one: a source control built from filtered results can
            only ever offer the option already chosen.
          items:
            type: string
        level_counts:
          type: object
          description: Retained line count per level, unfiltered, so a header can say "3 errors" while the page shows an info-only view.
          additionalProperties:
            type: integer

    ServiceHealth:
      type: object
      description: One named component's grade. `detail` is always populated, including for `ok` — "readable, 12 rows" is what distinguishes a check that ran from one that was skipped.
      required: [name, status, detail]
      additionalProperties: false
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, down, unknown]
        detail:
          type: string

    StorageHealth:
      type: object
      description: >-
        Disk headroom on the filesystem holding this workspace's data. Graded on
        ABSOLUTE free bytes, not a percentage: 10% of a 39 GB appliance disk and
        10% of a 2 TB disk are completely different operational situations, and
        what matters is whether the next image deploy fits.


        The three byte members are OMITTED, never zeroed, when the filesystem
        could not be measured — a `free_bytes` of 0 would render as a full disk
        and manufacture the emergency this check exists to detect.
      required: [path, status, detail]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The directory measured, or `""` when this deployment publishes none.
        status:
          type: string
          enum: [ok, low, critical, unknown]
        total_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
          description: Bytes available to THIS process — not the raw free count, which on a unix filesystem includes blocks reserved for root that the feeder may not use.
        used_percent:
          type: number
        detail:
          type: string

    RelayHealth:
      type: object
      description: One connected relay. A relay that is not connected does not appear — the relays are the only path to every screen and device, so an empty list is the whole fleet being unreachable and is graded `down`.
      required: [relay_id, address, screen_count]
      additionalProperties: false
      properties:
        relay_id:
          type: string
        address:
          type: string
          description: The canonical address this relay declared at hello (`relay/1` REL-037) — what a player is told to dial.
        screen_count:
          type: integer
          description: How many screens this relay is currently reporting on. A connected relay reporting zero is a real failure, and a distinct one from a relay that is not connected.

    ScreenHealth:
      type: object
      description: >-
        The fleet roll-up, built from the SAME join `/screen-status` serves —
        authored rows filled in by relay reports — rather than from the reports
        alone. A screen no relay has ever mentioned is the most alarming row
        there is, and a count built from reports is silent about exactly it.
      required:
        [total, live, fetching, rejected, stale, never_seen, paired, overridden,
         live_window_ms, content_transfer_window_ms, fetching_max_unacked_pulls]
      additionalProperties: false
      properties:
        total:
          type: integer
        live:
          type: integer
        fetching:
          type: integer
          description: >-
            How many screens were handed a Lease they have not yet acknowledged,
            recently enough that the player would still be transferring its
            content AND without having abandoned more Leases than a single
            transient failure explains. Counted apart from both neighbours: such
            a screen is still showing its previous program, so it is neither
            confirmed healthy nor a screen to go and look at. Both conditions
            matter to the grade this roll-up carries — a screen that answers
            every pull and never acknowledges is `stale`, and a whole site of
            them is `down`, which is what a count bounded on age alone could
            never reach.
        rejected:
          type: integer
          description: >-
            How many screens are IN CONTACT and not taking what they are handed
            (`ScreenStatus.reachability`). Counted apart from `stale` because the
            two send an operator to different places — one screen has gone quiet,
            the other is answering every poll and refusing every program — and
            apart from `live` because folding it there is the roll-up that
            reported a healthy fleet while nothing on it had accepted anything
            for an hour. Like `stale`, it does NOT keep the fleet out of the
            `down` grade: a wall nothing reaches is dark whether it is silent or
            argumentative.
        stale:
          type: integer
        never_seen:
          type: integer
        paired:
          type: integer
        overridden:
          type: integer
          description: How many screens currently carry an operator's push-now override.
        live_window_ms:
          type: integer
          format: int64
          description: The threshold live/stale was decided by, republished so the roll-up can be checked against the line it was drawn at.
        content_transfer_window_ms:
          type: integer
          format: int64
          description: >-
            The AGE threshold fetching/stale was decided by, republished for the
            same reason. It was missing: this roll-up published a `fetching`
            COUNT and no way to redraw the line it was counted at, so a consumer
            that wanted to treat those screens as stale — a defensible reading,
            since nothing has been heard back from them — had a number it could
            not reinterpret.
        fetching_max_unacked_pulls:
          type: integer
          format: int64
          description: >-
            The PROGRESS threshold fetching/stale was decided by — the most
            outstanding pulls a screen may have and still be counted `fetching`.
            `fetching` rests on both bounds, and this is the one that does what
            the age bound cannot: a screen that answers every pull and never
            acknowledges re-stamps its own age forever and no window can expire
            it. Left out while the age line was published, which restates the
            same defect one line along — a consumer holding two of three
            thresholds believes it has the whole rule and reproduces a different
            one. All three lines, or none. `/screen-status` publishes the same
            three per row.

    SystemHealth:
      type: object
      required: [status, checked_at_ms, started_at_ms, uptime_ms, version, services, storage, relays, screens]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, down, unknown]
          description: The WORST grade any component carries. Derived, never asserted — a summary that could read `ok` while a component reads `down` would be the one line an operator trusts and the one line that is wrong.
        checked_at_ms:
          type: integer
          format: int64
        started_at_ms:
          type: integer
          format: int64
          description: >-
            When THIS process instance began serving, or `-1` when the
            deployment publishes no start time (the same never-observed sentinel
            `uptime_ms` uses).


            It is the process-instance identifier API-153 requires, and it is
            stable for that instance's whole life: it is captured once at boot,
            so a clock step moves `checked_at_ms` and leaves this alone. A
            client that accepted a restart holds the value this field had
            BEFORE, and learns the restart completed when a successful read
            returns a different one — never by polling for reachability, which
            cannot tell "came back" from "never went".
        uptime_ms:
          type: integer
          format: int64
          description: >-
            How long this process has been serving, or `-1` when the deployment
            publishes no start time — the same never-observed sentinel
            `/screen-status` uses. When a screen went dark five minutes ago,
            "this box restarted four minutes ago" is the single most useful
            number on the page.
        version:
          type: string
          description: The running build, or `unknown`.
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
        storage:
          $ref: "#/components/schemas/StorageHealth"
        relays:
          type: array
          items:
            $ref: "#/components/schemas/RelayHealth"
        screens:
          $ref: "#/components/schemas/ScreenHealth"

    RestartRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          type: boolean
          description: >-
            MUST be `true`. The field exists so a restart cannot be the
            accidental outcome of an empty body — an MCP tool call or a `curl`
            with no payload refuses `422` instead of taking the console away.
            The console's confirm dialog is the human gate; this is the wire
            one, and neither substitutes for the other.

    RestartAcceptance:
      type: object
      description: >-
        What was accepted, and what a client can observe about it (API-152/153).
        Every member is present: a client deciding how long to wait cannot be
        handed a document where the number it needs is sometimes absent.
      required: [accepted_at_ms, stopping_in_ms, drain_budget_ms, started_at_ms, supervisor]
      additionalProperties: false
      properties:
        accepted_at_ms:
          type: integer
          format: int64
          description: When this request was accepted.
        stopping_in_ms:
          type: integer
          format: int64
          description: >-
            How long the process goes on serving after this response before it
            begins to stop. It is published rather than assumed because it is
            the window in which the response bytes must reach the client — a
            client that guessed it would either give up too early or wait on a
            process that has already gone.
        drain_budget_ms:
          type: integer
          format: int64
          description: >-
            The upper bound on the graceful drain that follows (connections,
            accepted work, durable state). `stopping_in_ms + drain_budget_ms` is
            the worst case before the process is gone; the supervisor's own
            restart delay is added on top of that and is not this surface's to
            report.
        started_at_ms:
          type: integer
          format: int64
          description: >-
            THIS process instance's start instant — the same value
            `getSystemHealth` reports — echoed here so a client holds the
            "before" to compare against. A successful health read returning a
            DIFFERENT value is the restart completing; `-1` means the deployment
            publishes no start time, and a client has nothing to compare and
            must fall back to reachability.
        supervisor:
          type: string
          description: >-
            The supervisor this deployment DECLARED will start the replacement
            (`systemd`, `docker`, a wrapper's own name). Reported so the
            acceptance says who is responsible for the process coming back,
            rather than leaving the operator to infer it.

    PairingCodeResult:
      type: object
      description: >-
        A freshly minted pairing grant, bound to this screen row (`relay/1`
        REL-121a) and to the one relay that may redeem it (REL-121b), plus the
        human-enterable pairing code (`player/1` PLY-024) an operator reads onto
        the screen. Exactly one of `pairing_code` and
        `code_unavailable_reason` is present: the grant is minted, bound, and
        delivered either way, and the reason describes only why the code itself
        could not be formed for the relay it is bound to. A request with no
        relay to bind to at all is refused before anything is minted (`503`).
      required: [grant_id, screen_id, ttl_seconds, redemption_mode, issued_at, expires_at]
      additionalProperties: false
      properties:
        grant_id:
          type: string
          description: The minted grant's identifier — also the `grant_selector` the pairing code encodes.
        screen_id:
          $ref: "#/components/schemas/Ulid"
        ttl_seconds:
          type: integer
          minimum: 1
          description: How long the grant stays redeemable after `issued_at` (`relay/1` REL-121).
        redemption_mode:
          type: string
          enum: [one-time]
        issued_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        pairing_code:
          type: string
          description: >-
            The hyphen-grouped code the screen's pairing UI accepts — encoding
            the relay's dial address, this grant's selector, and the relay's
            trust-anchor fingerprint commitment (`relay/1` REL-126).
        relay_id:
          type: string
          description: >-
            The one relay this grant is bound to and its code dials (`relay/1`
            REL-121b). Always present on a 201 — an issuance that could not name
            a relay is refused rather than minted — including when
            `code_unavailable_reason` explains why the code itself could not be
            formed for it.
        code_unavailable_reason:
          type: string
          description: Why no code could be formed (for instance, no relay is connected). Present exactly when `pairing_code` is not.

    ScreenListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Screen"
        cursor:
          $ref: "#/components/schemas/Cursor"

    VariableName:
      type: string
      description: >-
        A variable's name (`data-model/1` DAT-131a). Deliberately narrower than
        a label key's grammar (API-042): the name is compiled into a rule's
        closure and read from pack-authored text, so it MUST NOT require
        quoting or escaping in either. A violating name is refused
        `VARIABLE_NAME_INVALID`; one already taken at the same scope node is
        refused `VARIABLE_NAME_DUPLICATE`.
      pattern: "^[a-z][a-z0-9_]{0,63}$"
      minLength: 1
      maxLength: 64

    VariableValue:
      description: >-
        A variable's value: a JSON scalar — a string, a number, or a boolean
        (`data-model/1` DAT-132). An object or an array is refused
        (`VARIABLE_VALUE_INVALID`): a rule compares a variable against a
        literal, and a structured value would make that comparison a path
        expression this platform has deliberately not defined a grammar for.
        `null` is NOT settable (DAT-133) — `events/1` EVT-084 already assigns
        null the meaning "unset" in `old_value`/`new_value`, so admitting it
        here would make `new_value: null` ambiguous between a variable set to
        null and a variable deleted. To unset a variable, delete the row.
      oneOf:
        - type: string
        - type: number
        - type: boolean
      x-go-type: "interface{}"

    Variable:
      type: object
      description: >-
        A named, scope-placed scalar (`data-model/1` DAT-130): the shared state
        a `rules/1` `variable` condition reads (RUL-150) and a `variable_write`
        action writes (RUL-220). Its `name` — not its `id` — is how a rule, a
        pack and a person refer to it (DAT-131); the ULID remains the row's
        identity for revision, If-Match and audit, and the two coexist because
        they answer different questions.
        Secret material MUST NOT be stored here (DAT-138).
      required: [id, name, value, scope_node, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        name:
          $ref: "#/components/schemas/VariableName"
        value:
          $ref: "#/components/schemas/VariableValue"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    VariableCreate:
      type: object
      required: [name, value, scope_node]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          $ref: "#/components/schemas/VariableName"
        value:
          $ref: "#/components/schemas/VariableValue"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"

    VariableUpdate:
      type: object
      description: Partial update — every field optional, at least one required.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          $ref: "#/components/schemas/VariableName"
        value:
          $ref: "#/components/schemas/VariableValue"
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"

    VariableListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Variable"
        cursor:
          $ref: "#/components/schemas/Cursor"

    AdoptedDeviceEntity:
      type: object
      description: >-
        One entity a device exposes, with the policy authored over it — exactly
        `relay/1` REL-063's `{entity_id, device_class, enabled, hidden,
        display_name, category}`. Every member is a DECISION rather than a
        discovered fact, which is why these live on an authored row and not in
        the relay's own report.
      required: [entity_id, device_class, enabled, hidden, display_name, category]
      additionalProperties: false
      properties:
        entity_id:
          $ref: "#/components/schemas/Ulid"
        device_class:
          type: string
          minLength: 1
          description: The device class whose command vocabulary a command to this entity resolves against (`device-class-registry/1` REG-052).
        enabled:
          type: boolean
        hidden:
          type: boolean
        display_name:
          type: string
        category:
          type: string
          enum: [primary, diagnostic]

    AdoptedDevice:
      type: object
      description: >-
        One adopted device — the row a `device_id` names (`data-model/1`
        DAT-004a) and the row a relay's desired-state `device_inventory` entry
        is compiled from (`relay/1` REL-063). It is an ADOPTION RECORD: the
        relay is authoritative for what exists on its LAN and reports
        discovered-but-unadopted candidates upward (REL-110/111), while the
        adoption decision and the policy over it are authored here. Its identity
        is `(site, driver, native_id)`, never the relay that happens to report
        it (REL-153) — which is why no `relay_id` appears on this resource, and
        why two rows may not share a `(driver, native_id)`.
      required: [id, name, scope_node, driver, native_id, poll_cadence_seconds, entities, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        driver:
          type: string
          minLength: 1
          description: Half of the `(site, driver, native_id)` tuple this device's identity is scoped to (`relay/1` REL-063).
        native_id:
          type: string
          minLength: 1
          description: The device's own identifier on its LAN — the other half of its identity tuple (`relay/1` REL-063).
        poll_cadence_seconds:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            How often the relay should poll this device. `null` when this
            deployment has stated no cadence — REL-063 fixes no default, and a
            number here would be a polling policy nobody authored.
          x-go-type: "*int"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/AdoptedDeviceEntity"
        labels:
          $ref: "#/components/schemas/LabelMap"
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AdoptedDeviceCreate:
      type: object
      required: [name, scope_node, driver, native_id]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        driver:
          type: string
          minLength: 1
        native_id:
          type: string
          minLength: 1
        poll_cadence_seconds:
          type: ["integer", "null"]
          minimum: 1
          x-go-type: "*int"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/AdoptedDeviceEntity"
        labels:
          $ref: "#/components/schemas/LabelMap"

    AdoptedDeviceUpdate:
      type: object
      description: Partial update — every field optional, at least one required.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        driver:
          type: string
          minLength: 1
        native_id:
          type: string
          minLength: 1
        poll_cadence_seconds:
          type: ["integer", "null"]
          minimum: 1
          x-go-type: "*int"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/AdoptedDeviceEntity"
        labels:
          $ref: "#/components/schemas/LabelMap"

    AdoptedDeviceListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdoptedDevice"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Automation:
      type: object
      description: >-
        The management-API resource envelope around a rules/1 Rule. `mode`,
        `max`, `triggers`, `conditions`, and `actions` are exactly rules/1's
        own vocabulary (rules/1 Wire shapes); the remaining fields are this
        API's own resource envelope (identity, placement, labels, revision).
      required: [id, name, scope_node, labels, enabled, mode, max, triggers, conditions, actions, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: >-
            Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
            Optional; unique within this resource's scope node among
            resources of the same type; MAY be used in place of `id` in a
            cross-reference; preserved unchanged through an export/apply
            round trip.
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        enabled:
          type: boolean
        mode:
          type: string
          enum: [single, restart, queued, parallel]
        max:
          type: ["integer", "null"]
          description: Concurrency cap; meaningful only under `parallel` mode.
          x-go-type: "*int"
        triggers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: rules/1's Trigger vocabulary — full shape defined there, not restated here.
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
          description: rules/1's Condition vocabulary — full shape defined there, not restated here.
        actions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: rules/1's Action vocabulary — full shape defined there, not restated here.
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AutomationCreate:
      type: object
      required: [name, scope_node, mode, triggers, actions]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        enabled:
          type: boolean
          default: false
          description: >-
            Omit it and the automation is created DISABLED. Enabling is a
            deliberate act — an automation acts on real screens, and a
            half-finished create should not start doing so — which is why
            `bulk-enable` exists as its own operation. The cost is that
            creating a live automation is two calls.
        mode:
          type: string
          enum: [single, restart, queued, parallel]
        max:
          type: ["integer", "null"]
          description: Concurrency cap; meaningful only under `parallel` mode.
          x-go-type: "*int"
        triggers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        actions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

    AutomationUpdate:
      type: object
      description: Partial update — every field optional, at least one required.
      minProperties: 1
      additionalProperties: false
      properties:
        # Relocation. Every other scoped family accepts this on update, and
        # the server has an authorization branch for the destination node —
        # omitting it here made that branch unreachable for this family and
        # turned a supported move into a 422 once the body was validated
        # against this schema.
        scope_node:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        enabled:
          type: boolean
        mode:
          type: string
          enum: [single, restart, queued, parallel]
        max:
          type: ["integer", "null"]
          description: Concurrency cap; meaningful only under `parallel` mode.
          x-go-type: "*int"
        triggers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        actions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

    AutomationListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Automation"
        cursor:
          $ref: "#/components/schemas/Cursor"

    AutomationRunRequest:
      type: object
      description: Optional trigger-context override for this manual run.
      additionalProperties: false
      properties:
        context:
          type: object
          additionalProperties: true
        dry_run:
          type: boolean
          default: false
          description: >-
            When `true`, the run is evaluated to completion — conditions,
            branch selection, target resolution — but every effect is WITHHELD:
            no device command is dispatched and no screen override is written.
            The response reports exactly what a real run would have done. The
            default is `false`: run-now ACTS.

    AutomationRunCommand:
      type: object
      description: One device command this run dispatched (or, under `dry_run`, would have).
      required: [entity_id, command, ok]
      additionalProperties: false
      properties:
        entity_id:
          $ref: "#/components/schemas/Ulid"
        command:
          type: string
        ok:
          type: boolean
        error:
          type: string
          description: Present only when `ok` is false — why this one target did not take the command.

    AutomationRunScreen:
      type: object
      description: One screen a signage action wrote (or, under `dry_run`, would have).
      required: [screen_id, ok]
      additionalProperties: false
      properties:
        screen_id:
          $ref: "#/components/schemas/Ulid"
        ok:
          type: boolean
        error:
          type: string
          description: Present only when `ok` is false.

    AutomationRunPackAction:
      type: object
      description: >-
        One `pack_action`'s outcome (`rules/1` RUL-231): the publisher-qualified
        name the action declared, and whether the host routed it. `ok` means
        QUEUED, not completed — a pack action is asynchronous by construction
        (the pack leases the invocation and reports its result separately), so
        this reports the handoff, which is the only true statement available at
        the instant the run ends.
      required: [action, name, ok]
      additionalProperties: false
      properties:
        action:
          type: string
          description: >-
            Always `pack_action`. A plain string rather than an `enum` for the
            reason `AutomationRunSignage.action` gives at length.
        name:
          type: string
          description: >-
            The publisher-qualified pack action name the action declared
            (`<publisher>/<pack>.<action>`). NOT constrained to that grammar
            here, for `AutomationRunVariable.variable`'s reason: a malformed
            name is exactly the case this report exists to surface, and an empty
            string is what a `pack_action` that declared no `action` at all
            reports.
        ok:
          type: boolean
          description: Whether the invocation was accepted and queued.
        error:
          type: string
          description: >-
            Why it was not, when `ok` is false — an unknown pack, an action the
            pack never declared or never exposed to automation, or an
            `execution: relay-command` action, which RUL-232 forbids sending to
            the pack's handler and this host does not yet dispatch as a device
            command.

    AutomationRunVariable:
      type: object
      description: >-
        One `variable_write` action's outcome (`rules/1` RUL-220): the name it
        targeted, the value actually written, and whether the write landed.
      required: [action, variable, ok]
      additionalProperties: false
      properties:
        action:
          type: string
          description: >-
            Always `variable_write`. A plain string rather than an `enum` for
            the reason `AutomationRunSignage.action` gives at length.
        variable:
          type: string
          description: >-
            The variable name the action declared. NOT constrained to
            `VariableName`'s grammar here: an action naming `Store Open` is
            exactly the case this report exists to surface, and refusing to
            serialize the report because the authored name was invalid would
            withhold the one message that explains the refusal.
        value:
          $ref: "#/components/schemas/VariableValue"
        ok:
          type: boolean
        error:
          type: string
          description: >-
            Present only when `ok` is false — why the write did not happen:
            an absent or wrongly-typed member (RUL-220), a value Expression
            that failed closed (RUL-284), a name or value the data model
            refuses (`data-model/1` DAT-131a/132/133), a name already taken at
            this scope node (DAT-131), or a placement this run may not write.

    AutomationRunSignage:
      type: object
      description: >-
        One signage action's outcome (`rules/1` RUL-236), in the same
        three-value shape a preset batch reports (RUL-172).
      required: [action, outcome, screens]
      additionalProperties: false
      properties:
        action:
          type: string
          description: >-
            The signage action type — one of `play_cast`, `show_alert`,
            `dismiss_alert` (`rules/1` RUL-234/RUL-235). Left as a plain string
            rather than an `enum` deliberately: an `enum` here mints
            package-level Go constants named after its VALUES, and two of them
            (`failed` on `outcome` below) collide with an existing enum's,
            which silently renames that other enum's constants across the whole
            generated package. The closed set is stated here and enforced by
            the one place that can produce it.
        outcome:
          type: string
          description: >-
            One of `complete`, `partial`, `failed` — `rules/1` RUL-172's own
            three-value outcome, reused by RUL-236. A plain string for the
            reason `action` above gives.
        screens:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRunScreen"
        error:
          type: string
          description: >-
            Present only when the ACTION failed as a whole and no screen was
            attempted — its required members are not declared (`rules/1`
            RUL-234/RUL-235) or its ScreenRef resolved to nothing. Such a failure
            belongs to no screen, so it is reported here with an empty `screens`
            list rather than as a fabricated per-screen result: an entry invented
            for it would have to carry an empty `screen_id`, which is not a
            `Ulid` and would hand a generated client an invalid id on the one
            path it exists to describe.

    AutomationRunResult:
      type: object
      description: >-
        What the run actually did. `disposition` is the mode-evaluation
        outcome; the four effect arrays are the report the operator needs to
        tell "it ran" from "it ran and changed something".
      required: [run_id, disposition, dry_run, commands, signage, variables, logs]
      additionalProperties: false
      properties:
        run_id:
          $ref: "#/components/schemas/Ulid"
        disposition:
          type: string
          description: >-
            rules/1's closed RunDisposition set. `skipped` here means the
            rule's own conditions did not hold, so its actions were not run —
            not an error, and not a failure of the request.
          enum: [ran, skipped, restarted]
        dry_run:
          type: boolean
          description: Whether effects were withheld.
        commands:
          type: array
          description: Every `device_command` target this run dispatched to, in dispatch order.
          items:
            $ref: "#/components/schemas/AutomationRunCommand"
        signage:
          type: array
          description: Every signage action this run performed, in action order.
          items:
            $ref: "#/components/schemas/AutomationRunSignage"
        variables:
          type: array
          description: >-
            Every `variable_write` action this run performed (`rules/1`
            RUL-220), in action order. Present for the same reason the arrays
            above are: without it a rule whose write was refused — an invalid
            name, a value the store will not hold, a scope node this run may
            not write — answered `disposition: "ran"` with an unchanged
            variable, indistinguishable from a write that worked.
          items:
            $ref: "#/components/schemas/AutomationRunVariable"
        pack_actions:
          type: array
          description: >-
            Every `pack_action` this run routed (`rules/1` RUL-231), in action
            order. Present for the variables array's reason, and one more that is
            specific to it: a pack action's real work happens in the pack, after
            this response is written, so without this array the ONLY thing the
            run could report about it is silence — identical whether the
            invocation was queued or the named pack was never installed.
          items:
            $ref: "#/components/schemas/AutomationRunPackAction"
        logs:
          type: array
          description: Every `log` action's evaluated message (`rules/1` RUL-200), in order.
          items:
            type: object
            required: [level, message]
            additionalProperties: false
            properties:
              level:
                type: string
                description: One of `info`, `warning`, `error` (`rules/1` RUL-200). A plain string for the reason `AutomationRunSignage.action` gives.
              message:
                type: string
        delays_collapsed:
          type: integer
          minimum: 1
          description: >-
            How many `delay` actions this run passed through WITHOUT waiting.
            A synchronous manual run does not hold the request open for a
            rule's own pacing, so the remaining actions run immediately; the
            count is reported rather than hidden, because a rule whose timing
            matters behaves differently here than it does on a trigger.

    AutomationBulkEnableRequest:
      type: object
      description: The request body for a fleet-mutating bulk enable/disable over a selector-matched set of automations.
      required: [selector, enabled]
      additionalProperties: false
      properties:
        selector:
          type: string
          description: >-
            Label-selector grammar (contracts/api-1.md#label-selector-grammar)
            — this operation's fleet-mutating target predicate, not a list
            operation's result filter.
          example: "env in (prod,staging),scope_node subtree 01J8Z2Q1M8H8N4T0V1W2X3Y4Z5"
        enabled:
          type: boolean
          description: The `enabled` value to apply to every automation the selector matches.

    # -----------------------------------------------------------------
    # workspace — the two data-subject operations' request bodies
    # (contracts/api-1.md#data-subject-export--delete).
    # -----------------------------------------------------------------
    RevocationRequest:
      type: object
      description: >-
        Names the identity to revoke. `confirm` is API-143's second half — its
        absence makes this a radius query that changes nothing.
      required: [subject_kind, subject_id]
      additionalProperties: false
      properties:
        subject_kind:
          type: string
          enum: [screen, relay]
        subject_id:
          type: string
          minLength: 1
        confirm:
          type: boolean
          default: false
    RevocationResponse:
      type: object
      required: [subject_kind, subject_id, screens_affected, revoked, already_revoked, certificates_revoked]
      additionalProperties: false
      properties:
        subject_kind:
          type: string
          enum: [screen, relay]
        subject_id:
          type: string
        screens_affected:
          type: integer
          description: How many screens stop being served if this proceeds (API-143).
        revoked:
          type: boolean
        already_revoked:
          type: boolean
        certificates_revoked:
          type: integer
          description: >-
            How many of a relay's issued certificates this call marked revoked.
            Zero for a screen, and zero for a relay that never enrolled — not a
            failure: the record stands and the relay is refused if it later tries.
    WorkspaceRestoreRequest:
      type: object
      description: >-
        The request body for the workspace restore operation. It names a
        container already present in this deployment's archive directory and
        carries the export passphrase that opens it. The archive is NAMED
        rather than uploaded: an upload would hold a multi-gigabyte container in
        the request path before anything about it had been verified.
      required: [archive, passphrase]
      additionalProperties: false
      properties:
        archive:
          type: string
          minLength: 1
          description: >-
            The container's file name within the archive directory. A bare
            name, never a path — a caller able to send a path would be choosing
            which file the server opens and decrypts.
        passphrase:
          type: string
          minLength: 12
    WorkspaceExportRequest:
      type: object
      description: >-
        The request body for the data-subject export operation (API-120/121).
        It carries the export passphrase and nothing else: the operation's
        target is the workspace itself, implicit in the path (API-123).
      required: [passphrase]
      additionalProperties: false
      properties:
        passphrase:
          type: string
          minLength: 12
          description: >-
            The export passphrase `archive/1` derives the container's
            encryption key from (ARC-010). It is a per-export secret known
            only to whoever performed or received that export, and is
            distinct from the workspace's own emergency-kit recovery
            passphrase (ARC-112) — neither substitutes for the other.
          example: "correct-horse-battery-staple"

    WorkspaceDeleteRequest:
      type: object
      description: >-
        The request body for the data-subject delete operation
        (API-120/122). The confirmation is the only member: the operation's
        target is the workspace itself, implicit in the path (API-123).
      required: [confirm_workspace_id]
      additionalProperties: false
      properties:
        confirm_workspace_id:
          $ref: "#/components/schemas/Ulid"
          description: >-
            The id of the workspace this request destroys — the deployment's
            own org-kind scope node (data-model/1 DAT-012, the row that
            reaches `purged` once this operation has run). It MUST equal
            that id exactly; any other value, or none, refuses the request
            without destroying anything.

    MarketplaceRef:
      type: object
      description: >-
        A marketplace reference (`marketplace/1` MKT-060a): the input an install
        is resolved from. Posted as the `application/json` body of installPack,
        it names a pack in the deployment's configured registry sources instead
        of carrying the artifact's own bytes.
      required: [pack_id, trust_channel]
      additionalProperties: false
      properties:
        pack_id:
          type: string
          description: >-
            The fully publisher-qualified pack id `<publisher>/<name>`
            (`manifest/1` MAN-001, MKT-008). A bare, unqualified name is
            refused — every cross-reference to a pack uses the full form.
          example: "acme/weather-widget"
        trust_channel:
          type: string
          enum: [first-party, verified, community, dev]
          description: >-
            The provenance tier this install is accepted under (MKT-020). It is
            REQUIRED and is never defaulted server-side: MKT-022's
            production-install bar and MKT-090's auto-tracking pin are both
            stated per channel, so a host filling this in would be choosing how
            much review the installed code has had, in whatever direction the
            registry currently points.
          example: "verified"
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          description: >-
            Optional. Omitted, the source's channel pointer for
            (`pack_id`, `trust_channel`) is resolved (MKT-046/047) under
            MKT-050's anti-rollback. Supplied, that exact version's entry is
            resolved — the same-version re-resolution path MKT-044 preserves —
            with every other resolution-time check unchanged. It MUST be a
            three-component MAJOR.MINOR.PATCH version (MAN-002, MKT-050a): a
            version outside that grammar has no position in the order the
            anti-rollback high-water mark compares under.
          example: "1.2.0"
        source:
          type: string
          description: >-
            Optional. Omitted, the configured registry sources are consulted in
            configured order, which is a resolution preference and never a trust
            decision (MKT-061). Supplied, it names exactly one configured source
            and no other is consulted; a name no configured source carries is
            refused rather than fetched.
          example: "acme-registry"

    # -----------------------------------------------------------------
    # devices + entities — the device plane's read surface and the
    # command operation (relay/1 Device plane, REL-112/113).
    # -----------------------------------------------------------------
    RelayId:
      type: string
      minLength: 1
      description: >-
        A relay's permanent identity, assigned to it by enrollment and
        unchanged across every later certificate renewal or re-enrollment
        (`relay/1` REL-012/014). Deliberately NOT typed as a ULID: unlike a
        resource this API mints, a relay id is issued by the enrollment path
        and is opaque here — this API reads it, routes a command by it, and
        never constructs or parses one.

    LabelMap:
      type: object
      description: >-
        A resource's labels as the key→value map the label-selector grammar
        evaluates (`contracts/api-1.md#label-selector-grammar`). Keys and
        values are constrained by API-042's charsets, which is what makes
        every label expressible in a selector term without escaping.
      additionalProperties:
        type: string
        pattern: "^([a-z0-9A-Z][a-z0-9A-Z_.-]{0,62})?$"
      propertyNames:
        pattern: "^([a-z0-9A-Z][a-z0-9A-Z.-]{0,251}/)?[a-z0-9A-Z][a-z0-9A-Z_.-]{0,62}$"

    Device:
      type: object
      description: >-
        One physical device a relay has found on its own LAN. Its
        descriptive members are read-only on this API — a device is
        DISCOVERED by its relay's device plane (`relay/1` Device plane), not
        authored here, so this resource carries no `revision` and no
        optimistic-concurrency envelope. The one decision this API does make
        about a device is `adopted`, taken through the `adoptDevice`
        operation. A device exposes one or more entities; commands are
        addressed to those entities, never to the device.
      required: [id, relay_id, device_class, name, scope_node, labels, adopted]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        relay_id:
          $ref: "#/components/schemas/RelayId"
        device_class:
          type: string
          description: The device class whose state, attribute, and command vocabulary governs this device (`device-class-registry/1`).
        name:
          type: string
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        address:
          type: string
          description: >-
            Where the reporting relay can reach this device on its LAN, as a
            dialable `host:port` authority. Absent when discovery found the
            device but no usable address for it — the device was genuinely
            seen, and no command can be delivered to it until an address is.
        model:
          type: string
          description: >-
            The model the device reported when the relay probed it over the
            driver's own protocol. Absent when the probe did not answer.
        serial:
          type: string
          description: >-
            The serial number of the physical unit, as the device reported
            it. Absent when the probe did not answer.
        adopted:
          type: boolean
          description: >-
            Whether an adoption record exists for this device — that is,
            whether it is under this platform's control and carried in the
            desired state its relay is sent (`relay/1` REL-063). Discovery
            alone never sets this; `adoptDevice` does.

    DeviceListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Entity:
      type: object
      description: >-
        One addressable object a device exposes — the unit `rules/1` entity
        references resolve to and the unit a device command is addressed to
        (`relay/1` REL-112). Read-only on this API for the same reason a
        Device is, and carries no `revision` for the same reason.
      required: [id, device_id, relay_id, device_class, name, scope_node, labels]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        device_id:
          allOf:
            - $ref: "#/components/schemas/Ulid"
          description: >-
            The physical device this entity belongs to. A device fans out to
            many entities, which is why a relay serializes commands per
            device rather than per entity (`relay/1` REL-115).
        relay_id:
          $ref: "#/components/schemas/RelayId"
        device_class:
          type: string
          description: The device class whose command vocabulary a command to this entity must resolve against (`device-class-registry/1` REG-052).
        name:
          type: string
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        state:
          type: string
          description: >-
            The entity's last reported state, a value from its device
            class's own state vocabulary. Absent until the relay has
            reported one.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: >-
            The driver-observed detail behind `state`
            (`device-class-registry/1` REG-064; for a Roku `power_mode`,
            `active_app`, `active_app_id`, `app_type`, `is_screensaver`,
            `app_version`). `state` answers on/idle/standby/off; an operator
            looking at a screen that is not showing what it should needs to
            know it is sitting in another app, which `state` cannot say.
            Values are strings even where the driver's own value is a boolean —
            this is display detail crossing a trust boundary from a relay, and
            a bounded string map is checkable at intake in a way an arbitrary
            JSON value is not. Absent until the relay has reported some.

    EntityListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        cursor:
          $ref: "#/components/schemas/Cursor"

    EntityCommandRequest:
      type: object
      description: One device command to execute against the addressed entity.
      required: [command]
      additionalProperties: false
      properties:
        command:
          type: string
          minLength: 1
          description: >-
            The command name, which MUST resolve against the target
            entity's device class's own command vocabulary
            (`device-class-registry/1` REG-052); one that does not is
            refused by the relay without being attempted against the
            physical device (`relay/1` REL-113).
        params:
          type: object
          additionalProperties: true
          description: >-
            The command's parameters, as its device class declares them.
            These MAY carry credential material scoped to this single
            dispatch, which is never written to a durable store and never
            logged on either side (`relay/1` REL-114).

    EntityCommandResult:
      type: object
      description: >-
        The relay's own answer to a dispatched command (`relay/1` REL-112's
        `device.command_result`). A `200` with `ok: false` is a completed
        exchange whose command did not succeed — not a failed request; the
        request itself failing is a Problem with an api/1 `code`.
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        error:
          $ref: "#/components/schemas/EntityCommandError"

    EntityCommandError:
      type: object
      description: >-
        Present if and only if `ok` is false. `code` is drawn from
        `relay/1`'s own Error taxonomy — the same reuse-by-name discipline
        api/1 applies to a validation failure's per-field codes (API-013):
        the contract that owns the rule owns the code.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            A `relay/1` Error-taxonomy value — `COMMAND_UNRESOLVED` when the
            command is not one the target's device class declares (REL-113),
            `COMMAND_TARGET_UNREACHABLE` when the relay could not reach the
            device, `INTERNAL` for an unclassified relay-side failure.
          enum: [COMMAND_UNRESOLVED, COMMAND_TARGET_UNREACHABLE, INTERNAL]
        message:
          type: string

    # -----------------------------------------------------------------
    # Job — the async resource a fleet-mutating or otherwise
    # not-synchronously-completable operation returns via 202 Accepted
    # (contracts/api-1.md#fleet-mutating-operations--the-job-resource).
    # -----------------------------------------------------------------
    Job:
      type: object
      description: >-
        The accepted-work resource returned by 202 Accepted. A client
        polls this resource (`GET /jobs/{job_id}`) until `state` reaches a
        terminal value (`succeeded`, `failed`, or `partial`).
      required: [id, targets, created_by, state, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/JobTarget"
        created_by:
          type: string
          description: The submitting principal (opaque identifier; the principal/role model itself is out of this contract's scope).
        state:
          type: string
          description: pending/running are non-terminal; succeeded/failed/partial are terminal. `partial` is job-level only — never a JobTarget.state value.
          enum: [pending, running, succeeded, failed, partial]
        created_at:
          type: string
          format: date-time
          description: >-
            RFC 3339, and deliberately NOT the epoch-millisecond `Timestamp`
            every stored resource on this API carries. A Job is not a row of
            that baseline — it is minted by the accepting handler and
            serialized from a Go `time.Time` — so the two shapes differ
            because the two things differ, not by oversight.

    JobTarget:
      type: object
      description: >-
        One resource this Job acts on, that resource's own per-target progress,
        and — once it has failed — why.
      required: [target_id, state]
      additionalProperties: false
      properties:
        target_id:
          type: string
          description: The acted-on resource's `id` or `external_id`, exactly as the fleet-mutating request identified it.
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        error:
          $ref: "#/components/schemas/JobTargetError"

    JobTargetError:
      type: object
      description: >-
        Why one target failed, typed from api/1's OWN error-code registry
        (API-115/API-014) rather than a parallel vocabulary — so a `failed`
        entry in a Job's `targets` is diagnosable exactly the way a synchronous
        refusal's Problem is, by asserting on `code`.

        Present if and only if the target's `state` is `failed`. A pending,
        running or succeeded target carries no error at all, so a client reads
        the member's PRESENCE as the failure and never has to distinguish "no
        error" from a sentinel value. API-112 fixes a target's floor as
        `{target_id, state}` ("at least"); this is the member that makes
        API-115's registry rule observable to the client polling
        `GET /jobs/{job_id}`, which is the only completion signal the contract
        offers.
      required: [code]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence, carrying
            exactly the weight `Problem.detail` carries: `code` is the
            discriminant a client asserts on, `detail` is for the human reading
            the job report. Optional, because `code` alone is a complete
            machine-readable diagnosis — one code can cover several occurrences
            (`INTERNAL` for an unreadable row and for an interrupted run) and
            `detail` is what tells them apart in an operator's eyes.

    WebhookEndpoint:
      type: object
      description: >-
        A registered outbound webhook endpoint. `events/1` EVT-150 defers this
        registration resource to api/1 while defining the delivery mechanics
        given one.

        The endpoint's signing secret is deliberately NOT a member. A row's
        stored body is what this API serves back on every read, so a secret
        carried here would be a secret handed to every principal who may read
        the row; it lives sealed in platform-private storage and is installed
        through `rotateWebhookSigningSecret` instead.
      required: [id, name, scope_node, url, labels, schemas, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: >-
            Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
            Optional; unique within this resource's scope node among resources
            of the same type.
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        url:
          type: string
          format: uri
          description: >-
            The absolute http or https URL each delivery is POSTed to
            (EVT-151). It must carry neither userinfo credentials nor a query
            string: this value is served on every read and named in
            operator-facing errors, so anything embedded in it is disclosed
            wherever it appears.
        labels:
          $ref: "#/components/schemas/LabelMap"
        schemas:
          type: array
          description: >-
            The registered-schema names this endpoint subscribes to (EVT-124).
            An empty list imposes no schema restriction — scope-node filtering
            still applies in full, since EVT-124's restriction is alongside it
            and never in place of it.
          items:
            type: string
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    WebhookEndpointCreate:
      type: object
      description: >-
        The client-supplied half of a webhook endpoint. `id`, `revision` and
        the timestamps are server-assigned (API-030) and rejected here.
      required: [name, scope_node, url]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        url:
          type: string
          format: uri
        labels:
          $ref: "#/components/schemas/LabelMap"
        schemas:
          type: array
          items:
            type: string

    WebhookEndpointUpdate:
      type: object
      description: Partial update — every member optional, at least one present.
      minProperties: 1
      additionalProperties: false
      properties:
        # Relocation. Every other scoped family accepts this on update, and
        # the server has an authorization branch for the destination node —
        # omitting it here made that branch unreachable for this family and
        # turned a supported move into a 422 once the body was validated
        # against this schema.
        scope_node:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          format: uri
        labels:
          $ref: "#/components/schemas/LabelMap"
        schemas:
          type: array
          items:
            type: string

    WebhookEndpointListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        cursor:
          $ref: "#/components/schemas/Cursor"

    WebhookSigningSecretRequest:
      type: object
      description: >-
        The secret every delivery to this endpoint is signed with (EVT-151's
        HMAC-SHA256 key). Supplied by the caller, because the same value has to
        end up configured on a receiving server this platform does not own.
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          minLength: 32
          description: >-
            At least 32 characters. EVT-151 states no minimum; this is a
            deployment-side floor, chosen because a secret shorter than the
            digest it keys is the length an offline search reaches first.

    WebhookSigningSecretRotation:
      type: object
      description: >-
        A rotation's timing. It carries no secret: the caller supplied the
        value and already has it, and a copy in a response body is a copy in
        every proxy log and every retained idempotency replay in between.
      required: [rotated_at_ms, prior_secret_expires_at_ms]
      additionalProperties: false
      properties:
        rotated_at_ms:
          $ref: "#/components/schemas/Timestamp"
        prior_secret_expires_at_ms:
          type: ["integer", "null"]
          description: >-
            When the superseded secret stops being accepted (EVT-158's overlap
            window). Null on the FIRST install, which supersedes nothing and so
            opens no overlap.
          x-go-type: "*int64"

    WebhookDeliveryState:
      type: object
      description: >-
        An endpoint's delivery state: platform-owned execution state about the
        registration, not part of the registration itself. It carries no
        revision and no If-Match surface — a stale conditional write must not be
        able to revert an auto-disable the platform had just decided on.
      required: [endpoint_id, status, consecutive_failures, last_delivered_id, secret_set_at_ms]
      additionalProperties: false
      properties:
        endpoint_id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          enum: [active, disabled]
          description: >-
            `disabled` is EVT-154's auto-disable after a bounded run of
            fully-exhausted deliveries. A disabled endpoint receives no further
            attempts until `enableWebhookEndpoint` is called.
        consecutive_failures:
          type: integer
          minimum: 0
          description: >-
            The current unbroken run of deliveries that exhausted their whole
            retry budget (EVT-153). Counted per exhausted delivery, not per
            attempt, and reset by any success.
        last_delivered_id:
          type: ["string", "null"]
          description: >-
            EVT-155's resume cursor — the id of the most recent envelope a
            delivery for actually succeeded. Null before the first success.
            Delivery resumes strictly after it, which is what makes delivery
            at-least-once rather than at-most-once across a restart.
          x-go-type: "*string"
        secret_set_at_ms:
          type: ["integer", "null"]
          description: >-
            When this endpoint's current signing secret was installed. Null
            when it has none — such an endpoint is never delivered to, since an
            unsigned POST is not a delivery events/1 defines.
          x-go-type: "*int64"
