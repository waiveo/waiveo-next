openapi: 3.1.0
jsonSchemaDialect: "https://spec.openapis.org/oas/3.1/dialect/base"
info:
  title: Management API
  version: 1.0.0
  summary: The versioned management API — the single door every client (web UI, CLI, MCP server) uses to read and change platform state.
  description: >-
    This document is the source of truth every generated client (TypeScript
    for the web UI, Go for the CLI and MCP server) is produced from. Every
    operation lives under the `/api/v1` prefix. Cross-cutting conventions
    (error shape, optimistic concurrency, pagination, idempotency, trace
    propagation, MCP tag curation, the label-selector grammar, and the
    evolution policy) are specified normatively in `contracts/api-1.md`;
    this document implements those conventions as reusable components and
    applies them to every operation below. `scope-nodes` and `automations`
    are worked fully end to end (schemas, every verb, every error response);
    every other tag is a path stub — summary and tag only — reserved for a
    later minor.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: "/api/v1"
    description: Same-origin deployment — the app serves the web UI and this API on one origin; the CLI and MCP server address it over the network binding.
tags:
  - name: auth
    description: >-
      Session issuance and revocation, and the first-boot workspace claim.
      `login` and `setup` are credential-exchange operations declaring
      `security: []` (API-090/091); `logout` and `session` are ordinary
      authenticated operations.
  - name: principals
    description: Users, API-key clients, and internal service principals. Path stub.
  - name: scope-nodes
    description: The org → site → group → screen tree every resource and durable event attaches to. Worked fully.
  - name: devices
    description: >-
      The device registry — the adopted physical devices behind each site's
      relay. Read-only in this minor: a device enters the registry through the
      relay's own discovery and adoption plane (`relay/1` Device plane), not
      through an authoring write here. Discovery and adoption operations are a
      later minor.
  - name: entities
    description: >-
      The entity registry and state (device-plane objects; see rules/1 for
      automation semantics over entities). Read-only in this minor, plus the
      command operation — `relay/1` REL-112 addresses a device operation by a
      single already-resolved `entity_id`, so an entity, not a device, is what a
      command is sent to.
  - name: automations
    description: Rules — triggers, conditions, actions, and modes (rules/1 defines the vocabulary; this API manages the resource envelope around it). Worked fully.
  - name: casts
    description: Screen content — casts, slides, and playback assignment. Path stub.
  - name: packs
    description: Installed packs and their declared actions. Path stub.
  - name: jobs
    description: >-
      The async Job resource a fleet-mutating or otherwise
      not-synchronously-completable operation returns via `202 Accepted`;
      see `contracts/api-1.md#fleet-mutating-operations--the-job-resource`.
      Path stub beyond the representative flows that return one.
  - name: workspace
    description: >-
      Workspace-level data-subject export and delete; see
      `contracts/api-1.md#data-subject-export--delete`. Specced; full
      data-subject-request workflow tooling is a deferred implementation.
  - name: system
    description: Platform health, logs, and maintenance operations. Path stub.
  - name: "mcp:read"
    description: Curation tag — every operation carrying this tag is exposed as a non-mutating MCP tool. Not a resource family; see `contracts/api-1.md#mcp-operation-tag-curation`.
  - name: "mcp:act"
    description: Curation tag — every operation carrying this tag is exposed as a mutating MCP tool and requires the Idempotency-Key discipline. Not a resource family; see `contracts/api-1.md#mcp-operation-tag-curation`.
security:
  - SessionCookie: []
  - ApiKey: []
paths:
  # ---------------------------------------------------------------------
  # scope-nodes — exemplar #1, worked fully end to end.
  # ---------------------------------------------------------------------
  /scope-nodes:
    get:
      operationId: listScopeNodes
      summary: List scope nodes
      description: Returns a keyset-paginated, selector-filterable page of scope nodes.
      tags: [scope-nodes, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of scope nodes.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createScopeNode
      summary: Create a scope node
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeNodeCreate"
      responses:
        "201":
          description: The created scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /scope-nodes/{scope_node_id}:
    parameters:
      - name: scope_node_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getScopeNode
      summary: Read a scope node
      tags: [scope-nodes, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScopeNode
      summary: Update a scope node
      description: Partial update. Requires If-Match against the scope node's current ETag/revision.
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeNodeUpdate"
      responses:
        "200":
          description: The updated scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteScopeNode
      summary: Delete a scope node
      description: Requires If-Match against the scope node's current ETag/revision.
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  # ---------------------------------------------------------------------
  # automations — exemplar #2, worked fully end to end.
  # ---------------------------------------------------------------------
  /automations:
    get:
      operationId: listAutomations
      summary: List automations
      description: Returns a keyset-paginated, selector-filterable page of automations (rules).
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of automations.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createAutomation
      summary: Create an automation
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationCreate"
      responses:
        "201":
          description: The created automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /automations/{automation_id}:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getAutomation
      summary: Read an automation
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAutomation
      summary: Update an automation
      description: Partial update. Requires If-Match against the automation's current ETag/revision.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdate"
      responses:
        "200":
          description: The updated automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteAutomation
      summary: Delete an automation
      description: Requires If-Match against the automation's current ETag/revision.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /automations/{automation_id}/run:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: runAutomation
      summary: Run an automation now
      description: >-
        Manually starts one run of the automation's action sequence, subject
        to its declared mode's normal mode-evaluation rules. A mutating POST
        outside plain resource creation — accepts Idempotency-Key so a
        client's retry-on-timeout cannot double-fire the run.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRunRequest"
      responses:
        "200":
          description: The run was accepted; the response carries its mode-evaluation disposition.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /automations/bulk-enable:
    post:
      operationId: bulkEnableAutomations
      summary: Enable or disable a selector-matched set of automations
      description: >-
        Fleet-mutating operation
        (`contracts/api-1.md#fleet-mutating-operations--the-job-resource`):
        targets every automation the selector matches, accepts the same
        label-selector grammar a list operation does as its target
        predicate, and returns 202 with a Job resource rather than
        blocking until every target finishes.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationBulkEnableRequest"
      responses:
        "202":
          description: Accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------
  # devices + entities — the device plane's read surface and its one
  # mutating operation, the command a relay executes against a physical
  # device (relay/1 Device plane, REL-112/113).
  #
  # Both families are read-only here: a device and its entities enter the
  # registry through the relay's own discovery and adoption plane, never
  # through an authoring write on this API, so neither declares a create,
  # update, or delete. Adoption operations are a later minor, additive to
  # these paths.
  # ---------------------------------------------------------------------
  /devices:
    get:
      operationId: listDevices
      summary: List devices
      description: >-
        Returns a keyset-paginated, selector-filterable page of the adopted
        physical devices behind this deployment's relays.
      tags: [devices, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of devices.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /entities:
    get:
      operationId: listEntities
      summary: List entities and their current state
      description: >-
        Returns a keyset-paginated, selector-filterable page of entities —
        the addressable device-plane objects a device exposes, and the
        targets `rules/1` entity references and this API's command
        operation resolve to.
      tags: [entities, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of entities.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /entities/{entity_id}/commands:
    parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: sendEntityCommand
      summary: Send a command to an entity
      description: >-
        Dispatches one device command to the entity's owning relay over that
        relay's existing persistent connection and returns the relay's own
        correlated result (`relay/1` REL-112). The command is addressed to a
        single already-resolved entity: `relay/1` accepts no selector or
        device-class filter, so fanning a command across a set is a client's
        (or `rules/1`'s) concern, not this operation's.


        The exchange completes within this request/response cycle — the
        relay answers on the same connection — so this operation returns its
        result synchronously rather than the `202 Accepted` plus Job that
        `contracts/api-1.md#fleet-mutating-operations--the-job-resource`
        requires of work that cannot complete in-cycle.


        A mutating POST tagged `mcp:act`, so it accepts `Idempotency-Key`: a
        client's retry-on-timeout replays the retained result rather than
        firing the command at the physical device a second time.
      tags: [entities, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityCommandRequest"
      responses:
        "200":
          description: >-
            The relay answered. `ok` reports whether the command succeeded
            against the physical device; a refusal the relay typed itself
            (an undeclared command, an unreachable device) rides `error`.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------
  # jobs — the async Job resource a fleet-mutating or otherwise
  # not-synchronously-completable operation returns via 202 Accepted
  # (contracts/api-1.md#fleet-mutating-operations--the-job-resource).
  # ---------------------------------------------------------------------
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getJob
      summary: Read a Job resource
      description: A client polls this operation until the returned Job's `state` reaches a terminal value.
      tags: [jobs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The job.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------
  # workspace — data-subject export/delete, specced at the shape level
  # (contracts/api-1.md#data-subject-export--delete). Both return 202 with
  # a Job resource, exactly like a fleet-mutating operation, since neither
  # completes within its own request/response cycle. Neither takes a
  # selector: API-123 makes each operation's target the workspace itself,
  # implicit in the request path, so API-110's selector convention does not
  # apply.
  # ---------------------------------------------------------------------
  /workspace/export:
    post:
      operationId: exportWorkspace
      summary: Export the workspace as a portable archive
      description: >-
        Data-subject export operation
        (`contracts/api-1.md#data-subject-export--delete`). API-121 makes
        this the API-facing trigger for the container `archive/1` defines,
        not a second export format: the Job's success means exactly that
        container now exists for this workspace. Owner-role only — an
        export carries the whole workspace, so no scope-node-narrowed role
        can invoke it. A fuller data-subject-request workflow (intake and
        tracking for a request arriving outside this API) is the deferred
        implementation API-124 names.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceExportRequest"
      responses:
        "202":
          description: Export accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /workspace/delete:
    post:
      operationId: deleteWorkspace
      summary: Erase the workspace's data via key-material destruction
      description: >-
        Data-subject delete operation
        (`contracts/api-1.md#data-subject-export--delete`). API-122 routes
        it to the workspace's key-material destruction path
        (`security-model.md` SEC-121) — this IS that destruction, not a
        separate deletion mechanism. It is irreversible: owner-role only,
        and the body MUST name the workspace being destroyed
        (`confirm_workspace_id`), so no single blind request can erase a
        deployment. A fuller data-subject-request workflow is the deferred
        implementation API-124 names.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeleteRequest"
      responses:
        "202":
          description: Deletion accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------
  # Tagged stubs — path + summary + tag only; full shapes land in a later
  # minor (additive, per contracts/api-1.md's evolution policy).
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a session
      description: >-
        Credential-exchange operation
        (`contracts/api-1.md#security-override-convention`, API-090/091):
        authenticates the request from credentials in the body, not a
        pre-existing session or API key. On success it sets a host-only
        session cookie (`security-model.md` SEC-023) and a companion,
        script-readable CSRF cookie whose value every mutating request must
        echo in `X-CSRF-Token` (SEC-024). Repeated failures lock the
        presented credential per source-IP class with exponential backoff
        (SEC-090, `CREDENTIAL_LOCKED`).
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session the presented credentials minted.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
            Set-Cookie:
              description: >-
                The `session` cookie (HttpOnly, host-only, SameSite) and the
                `csrf_token` cookie (readable by the page's own script — that
                readability IS the double-submit mechanism, SEC-024).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the calling session
      description: >-
        Revokes the session or API key that authenticated this request
        (`security-model.md` SEC-020) and expires its cookies. Ordinary
        authenticated operation — deliberately NOT `security: []`, so a
        browser caller is subject to the same double-submit CSRF requirement
        every other mutating route carries (SEC-024) and a cross-site page
        cannot sign a user out.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: The session was revoked.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/session:
    get:
      operationId: getSession
      summary: Read the calling principal's own session
      description: >-
        Returns the caller's own principal, effective role, and assurance
        level — what a console reads on load to decide whether to render the
        application or the sign-in page.
      tags: [auth, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The calling session.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/setup:
    post:
      operationId: claimWorkspace
      summary: Claim an unclaimed workspace by redeeming the one-time setup grant
      description: >-
        First-boot claim (`security-model.md` SEC-120). The installer
        generates a one-time `setup`-purpose grant and presents its code;
        this endpoint is claimable ONLY by redeeming that code, so an
        installed-but-unclaimed box on a shared network is never
        first-come-first-served. Redemption is an atomic check-and-consume
        (SEC-036): of two concurrent claims presenting one code, at most one
        succeeds and the other is refused `GRANT_ALREADY_REDEEMED`.
        Credential-exchange operation (API-090/091) — it mints the very first
        principal on the box, so it cannot require a pre-existing session.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "201":
          description: The workspace was claimed; the first owner principal and its session.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
            Set-Cookie:
              description: The `session` and `csrf_token` cookies, as for `login`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The grant was expired (`GRANT_EXPIRED`), already redeemed
            (`GRANT_ALREADY_REDEEMED`), or of a purpose that does not match
            this endpoint (`GRANT_PURPOSE_MISMATCH`) — `security-model.md`
            SEC-035.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /principals:
    get:
      operationId: listPrincipals
      summary: List principals (users, API-key clients, internal service principals)
      tags: [principals, "mcp:read"]
      responses:
        "200":
          description: Stub — resource detail intentionally deferred.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /casts:
    get:
      operationId: listCasts
      summary: List casts
      tags: [casts, "mcp:read"]
      responses:
        "200":
          description: Stub — resource detail intentionally deferred.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /packs:
    get:
      operationId: listPacks
      summary: List installed packs
      tags: [packs, "mcp:read"]
      responses:
        "200":
          description: Stub — resource detail intentionally deferred.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /packs/{pack}/actions/{name}:
    post:
      operationId: invokePackAction
      summary: Invoke a pack-declared action
      description: >-
        The auto-surfaced management-API route for every action a pack
        declares. `pack` is the pack's `<publisher>/<name>` identity,
        percent-encoded where it contains a literal slash.
      tags: [packs, "mcp:act"]
      parameters:
        - name: pack
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: Stub — resource detail intentionally deferred.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /system/health:
    get:
      operationId: getSystemHealth
      summary: Platform health summary
      tags: [system, "mcp:read"]
      responses:
        "200":
          description: Stub — resource detail intentionally deferred.
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie issued by /auth/login. Mutating requests additionally require the platform's CSRF token.
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: "wv_<random>, scoped to a principal and role"
      description: API-key principal (user-issued or internal-service), presented as a bearer token.

  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a prior response's `cursor` field. Never constructed or parsed by the client.
      schema:
        $ref: "#/components/schemas/Cursor"
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum rows to return in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SelectorParam:
      name: selector
      in: query
      required: false
      description: >-
        A label-selector string: comma-separated, ANDed terms (equality,
        inequality, set-membership, set-exclusion, existence,
        non-existence, or a `scope_node subtree <ulid>` term). See
        `contracts/api-1.md#label-selector-grammar` for the full grammar.
      schema:
        type: string
        example: "kind=screen,env in (prod,staging),scope_node subtree 01J8Z2Q1M8H8N4T0V1W2X3Y4Z5"
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: The resource's current ETag, as last observed by the client. Required on every state-changing request against a mutable resource; no unconditional-overwrite path exists.
      schema:
        type: string
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated opaque replay key, scoped to (principal, method, path). Optional; strongly recommended on any POST a client might retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TraceIdParam:
      name: Trace-Id
      in: header
      required: false
      description: Caller-supplied trace ID (ULID- or UUID-class, 20-36 chars). A non-conforming value is discarded and replaced server-side; the request still proceeds.
      schema:
        $ref: "#/components/schemas/TraceId"

  headers:
    ETag:
      description: Strong validator derived solely from the resource's `revision`. Present on every response representing a single mutable resource.
      required: true
      schema:
        type: string
        example: '"3"'
    TraceIdResponse:
      description: The trace ID that correlates this request across every component it touched — either the caller-supplied value (if it validated) or a freshly generated one.
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"

  # Note: the Deprecation (RFC 9745) and Sunset (RFC 8594) response headers
  # this contract's evolution policy uses (contracts/api-1.md, API-082) are
  # not modeled as reusable components here — nothing in this document is
  # deprecated yet, so there is no operation to attach them to without
  # faking a deprecation. contracts/api-1.md is their normative source; a
  # future minor wires them onto whichever operation first deprecates.

  responses:
    BadRequest:
      description: The request was malformed (validation failure, invalid selector, invalid cursor).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: >-
        The request body failed field-level validation
        (`contracts/api-1.md#error-shape`, API-013a: a body validation
        failure is 422, distinct from the 400 a query-parameter validation
        failure — e.g. an out-of-range `limit` — carries).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid principal was presented.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The principal is authenticated but not authorized for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No resource exists at this identifier.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: An Idempotency-Key was reused with a different body, or is still in progress.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match did not match the resource's current ETag.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: A state-changing request omitted the required If-Match header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The principal exceeded its rate limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >-
        The server or a dependency it needs is temporarily unable to serve
        the request (`code: UNAVAILABLE`) — for a device command, the target
        entity's relay has no live connection to carry it. Retryable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Ulid:
      type: string
      description: A 26-character Crockford-base32 identifier, lexicographically sortable by creation time.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["01J8Z3K4N5P6Q7R8S9T0V1W2X3"]

    TraceId:
      type: string
      description: A ULID- or UUID-class trace identifier, 20-36 characters, restricted charset.
      pattern: "^[A-Za-z0-9-]{20,36}$"
      examples: ["01J8Z3K4N5P6Q7R8S9T0V1W2X4"]

    Cursor:
      type: ["string", "null"]
      description: An opaque, URL-safe continuation token. `null` signals no further rows. Never constructed, parsed, or compared for meaning by a client.
      pattern: "^[A-Za-z0-9_-]+$"
      x-go-type: "*string"

    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: >-
        A resource-baseline timestamp: epoch MILLISECONDS, UTC — not an RFC
        3339 string. The store stamps `created_at`/`updated_at` on every row it
        writes as an integer millisecond count and returns that value
        unchanged, so this is what a client reads and what an export/apply
        round trip carries back. Deliberately not `format: date-time`: the two
        are not interchangeable, and a client that parsed one as the other
        would silently read 1970 for every resource on this surface.

        The `Job` resource is the one exception on this API and says so at its
        own `created_at`: a Job's timestamp is minted in Go as a `time.Time`
        and serialized RFC 3339, because a Job is not a stored row of this
        baseline.


    ValidationFieldError:
      type: object
      description: One field-level failure inside a VALIDATION_FAILED Problem's `errors` array.
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dot-path to the offending field in the request body, or the query-parameter name.
        code:
          type: string
        message:
          type: string

    Problem:
      type: object
      description: >-
        RFC 9457 problem+json, extended with `code` (this contract's
        machine-readable error registry) and `trace_id`. `code` is the
        discriminant a client asserts on; `title`/`detail` are for humans.
      required: [type, title, status, code, trace_id]
      additionalProperties: false
      properties:
        type:
          type: string
          const: "about:blank"
          description: Always "about:blank" in this version; `code` is the sole machine-readable discriminant api/v1 defines.
        title:
          type: string
          description: A short, human-readable summary of the error, constant per `code`.
        status:
          type: integer
          description: The HTTP status code, repeated here per RFC 9457.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request's own path, unmodified.
        code:
          $ref: "#/components/schemas/ErrorCode"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        errors:
          type: array
          description: Present only when `code` is VALIDATION_FAILED — one entry per failing field.
          items:
            $ref: "#/components/schemas/ValidationFieldError"
        current_revision:
          type: integer
          description: Present only when `code` is REVISION_CONFLICT — the resource's current revision, so the client can re-read and retry.
      examples:
        - type: "about:blank"
          title: "Not Found"
          status: 404
          detail: "No scope node exists with this identifier."
          instance: "/api/v1/scope-nodes/01J8Z3K4N5P6Q7R8S9T0V1W2X9"
          code: "NOT_FOUND"
          trace_id: "01J8Z3K4N5P6Q7R8S9T0V1W2X4"

    ErrorCode:
      type: string
      description: >-
        The stable, additive-only machine-readable error registry
        (`contracts/api-1.md#error-taxonomy`), plus the codes a sibling
        contract owns for operations that ride this same `/api/v1` binding.
        api/1's own registry governs API-011 for api/1's own rules; a sibling
        contract's Problem carries a `code` from ITS registry, by name — the
        same reuse-by-name discipline `player/1` PLY-007 applies. The four
        trailing values below belong to `security-model.md`'s Error taxonomy
        and appear only on the `auth` operations.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - REVISION_CONFLICT
        - IF_MATCH_REQUIRED
        - CURSOR_INVALID
        - SELECTOR_INVALID
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - EXTERNAL_ID_CONFLICT
        - ID_SERVER_ASSIGNED
        - RATE_LIMITED
        - INTERNAL
        - UNAVAILABLE
        - CREDENTIAL_LOCKED
        - GRANT_EXPIRED
        - GRANT_ALREADY_REDEEMED
        - GRANT_PURPOSE_MISMATCH

    LoginRequest:
      type: object
      description: >-
        The credentials a login authenticates from (API-091 — carried in the
        BODY, never as a precondition session).
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: The login handle the `password` credential is registered under.
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    ClaimRequest:
      type: object
      description: >-
        A first-boot claim (SEC-120): the one-time setup code, plus the
        credential the first owner is choosing.
      required: [code, identifier, password]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            The one-time `setup`-purpose grant code the installer presented.
            At least 128 bits of entropy (SEC-032).
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    SessionSummary:
      type: object
      description: >-
        The caller's own session. It deliberately carries NO session token:
        that value rides the HttpOnly cookie and is never readable by the
        page. `csrf_token` is present only on the responses that MINT a
        session (login, claim), since it is the double-submit value the client
        must then echo (SEC-024).
      required: [principal_id, kind, role, aal, session_id]
      additionalProperties: false
      properties:
        principal_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          description: The principal kind (`security-model.md` SEC-001).
          enum: [user, screen, relay, pack-service, ingest-token, system-console]
        role:
          type: string
          description: The effective role this principal holds (`security-model.md` SEC-010).
          enum: [owner, admin, operator, viewer]
        aal:
          type: string
          description: >-
            Authenticator Assurance Level (SEC-021/022). A `recovery` session
            is minted by redeeming a recovery-purpose grant and is restricted
            until the target principal completes TOTP re-enrolment.
          enum: [standard, recovery]
        session_id:
          $ref: "#/components/schemas/Ulid"
        csrf_token:
          type: string
          description: >-
            The double-submit CSRF token, returned only when this response
            minted the session. Echo it in `X-CSRF-Token` on every mutating
            request (SEC-024).

    ScopeNode:
      type: object
      description: A node in the org → site → group → screen tree.
      required: [id, kind, parent_id, name, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: >-
            Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
            Optional; unique within this resource's scope node among
            resources of the same type; MAY be used in place of `id` in a
            cross-reference; preserved unchanged through an export/apply
            round trip. Every resource in this API carries this same
            convention, not only scope-nodes and automations.
          x-go-type: "*string"
        kind:
          type: string
          enum: [org, site, group, screen]
        parent_id:
          type: ["string", "null"]
          description: The parent scope node's ULID. `null` only for the single root org node.
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        tz:
          type: string
          description: IANA time zone name. Meaningful at site level and below; a screen-level value overrides its site.
        lat:
          type: number
          minimum: -90
          maximum: 90
        long:
          type: number
          minimum: -180
          maximum: 180
        account_state:
          type: ["string", "null"]
          description: Present only on the org node.
          enum: [trial, active, suspended, closed, purged, null]
          x-go-type: "*string"
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    ScopeNodeCreate:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        kind:
          type: string
          enum: [org, site, group, screen]
        parent_id:
          type: ["string", "null"]
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        tz:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        long:
          type: number
          minimum: -180
          maximum: 180

    ScopeNodeUpdate:
      type: object
      description: Partial update — every field optional, at least one required.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        tz:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        long:
          type: number
          minimum: -180
          maximum: 180

    ScopeNodeListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScopeNode"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Automation:
      type: object
      description: >-
        The management-API resource envelope around a rules/1 Rule. `mode`,
        `max`, `triggers`, `conditions`, and `actions` are exactly rules/1's
        own vocabulary (rules/1 Wire shapes); the remaining fields are this
        API's own resource envelope (identity, placement, labels, revision).
      required: [id, name, scope_node, labels, enabled, mode, max, triggers, conditions, actions, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: >-
            Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
            Optional; unique within this resource's scope node among
            resources of the same type; MAY be used in place of `id` in a
            cross-reference; preserved unchanged through an export/apply
            round trip.
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        enabled:
          type: boolean
        mode:
          type: string
          enum: [single, restart, queued, parallel]
        max:
          type: ["integer", "null"]
          description: Concurrency cap; meaningful only under `parallel` mode.
          x-go-type: "*int"
        triggers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: rules/1's Trigger vocabulary — full shape defined there, not restated here.
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
          description: rules/1's Condition vocabulary — full shape defined there, not restated here.
        actions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: rules/1's Action vocabulary — full shape defined there, not restated here.
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AutomationCreate:
      type: object
      required: [name, scope_node, mode, triggers, actions]
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum: [single, restart, queued, parallel]
        max:
          type: ["integer", "null"]
          description: Concurrency cap; meaningful only under `parallel` mode.
          x-go-type: "*int"
        triggers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        actions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

    AutomationUpdate:
      type: object
      description: Partial update — every field optional, at least one required.
      minProperties: 1
      additionalProperties: false
      properties:
        external_id:
          type: ["string", "null"]
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        labels:
          $ref: "#/components/schemas/LabelMap"
        enabled:
          type: boolean
        mode:
          type: string
          enum: [single, restart, queued, parallel]
        max:
          type: ["integer", "null"]
          description: Concurrency cap; meaningful only under `parallel` mode.
          x-go-type: "*int"
        triggers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        actions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

    AutomationListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Automation"
        cursor:
          $ref: "#/components/schemas/Cursor"

    AutomationRunRequest:
      type: object
      description: Optional trigger-context override for this manual run.
      additionalProperties: false
      properties:
        context:
          type: object
          additionalProperties: true

    AutomationRunResult:
      type: object
      required: [run_id, disposition]
      additionalProperties: false
      properties:
        run_id:
          $ref: "#/components/schemas/Ulid"
        disposition:
          type: string
          description: rules/1's closed RunDisposition set.
          enum: [ran, skipped, restarted]

    AutomationBulkEnableRequest:
      type: object
      description: The request body for a fleet-mutating bulk enable/disable over a selector-matched set of automations.
      required: [selector, enabled]
      additionalProperties: false
      properties:
        selector:
          type: string
          description: >-
            Label-selector grammar (contracts/api-1.md#label-selector-grammar)
            — this operation's fleet-mutating target predicate, not a list
            operation's result filter.
          example: "env in (prod,staging),scope_node subtree 01J8Z2Q1M8H8N4T0V1W2X3Y4Z5"
        enabled:
          type: boolean
          description: The `enabled` value to apply to every automation the selector matches.

    # -----------------------------------------------------------------
    # workspace — the two data-subject operations' request bodies
    # (contracts/api-1.md#data-subject-export--delete).
    # -----------------------------------------------------------------
    WorkspaceExportRequest:
      type: object
      description: >-
        The request body for the data-subject export operation (API-120/121).
        It carries the export passphrase and nothing else: the operation's
        target is the workspace itself, implicit in the path (API-123).
      required: [passphrase]
      additionalProperties: false
      properties:
        passphrase:
          type: string
          minLength: 12
          description: >-
            The export passphrase `archive/1` derives the container's
            encryption key from (ARC-010). It is a per-export secret known
            only to whoever performed or received that export, and is
            distinct from the workspace's own emergency-kit recovery
            passphrase (ARC-112) — neither substitutes for the other.
          example: "correct-horse-battery-staple"

    WorkspaceDeleteRequest:
      type: object
      description: >-
        The request body for the data-subject delete operation
        (API-120/122). The confirmation is the only member: the operation's
        target is the workspace itself, implicit in the path (API-123).
      required: [confirm_workspace_id]
      additionalProperties: false
      properties:
        confirm_workspace_id:
          $ref: "#/components/schemas/Ulid"
          description: >-
            The id of the workspace this request destroys — the deployment's
            own org-kind scope node (data-model/1 DAT-012, the row that
            reaches `purged` once this operation has run). It MUST equal
            that id exactly; any other value, or none, refuses the request
            without destroying anything.

    # -----------------------------------------------------------------
    # devices + entities — the device plane's read surface and the
    # command operation (relay/1 Device plane, REL-112/113).
    # -----------------------------------------------------------------
    RelayId:
      type: string
      minLength: 1
      description: >-
        A relay's permanent identity, assigned to it by enrollment and
        unchanged across every later certificate renewal or re-enrollment
        (`relay/1` REL-012/014). Deliberately NOT typed as a ULID: unlike a
        resource this API mints, a relay id is issued by the enrollment path
        and is opaque here — this API reads it, routes a command by it, and
        never constructs or parses one.

    LabelMap:
      type: object
      description: >-
        A resource's labels as the key→value map the label-selector grammar
        evaluates (`contracts/api-1.md#label-selector-grammar`). Keys and
        values are constrained by API-042's charsets, which is what makes
        every label expressible in a selector term without escaping.
      additionalProperties:
        type: string
        pattern: "^([a-z0-9A-Z][a-z0-9A-Z_.-]{0,62})?$"
      propertyNames:
        pattern: "^([a-z0-9A-Z][a-z0-9A-Z.-]{0,251}/)?[a-z0-9A-Z][a-z0-9A-Z_.-]{0,62}$"

    Device:
      type: object
      description: >-
        One adopted physical device behind a relay. Read-only on this API:
        a device is discovered and adopted by its own relay's device plane
        (`relay/1` Device plane), so this resource carries no `revision`
        and no optimistic-concurrency envelope — there is no write here to
        condition on. A device exposes one or more entities; commands are
        addressed to those entities, never to the device.
      required: [id, relay_id, device_class, name, scope_node, labels]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        relay_id:
          $ref: "#/components/schemas/RelayId"
        device_class:
          type: string
          description: The device class whose state, attribute, and command vocabulary governs this device (`device-class-registry/1`).
        name:
          type: string
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"

    DeviceListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Entity:
      type: object
      description: >-
        One addressable object a device exposes — the unit `rules/1` entity
        references resolve to and the unit a device command is addressed to
        (`relay/1` REL-112). Read-only on this API for the same reason a
        Device is, and carries no `revision` for the same reason.
      required: [id, device_id, relay_id, device_class, name, scope_node, labels]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        device_id:
          allOf:
            - $ref: "#/components/schemas/Ulid"
          description: >-
            The physical device this entity belongs to. A device fans out to
            many entities, which is why a relay serializes commands per
            device rather than per entity (`relay/1` REL-115).
        relay_id:
          $ref: "#/components/schemas/RelayId"
        device_class:
          type: string
          description: The device class whose command vocabulary a command to this entity must resolve against (`device-class-registry/1` REG-052).
        name:
          type: string
        scope_node:
          $ref: "#/components/schemas/Ulid"
        labels:
          $ref: "#/components/schemas/LabelMap"
        state:
          type: string
          description: >-
            The entity's last reported state, a value from its device
            class's own state vocabulary. Absent until the relay has
            reported one.

    EntityListResponse:
      type: object
      required: [items, cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        cursor:
          $ref: "#/components/schemas/Cursor"

    EntityCommandRequest:
      type: object
      description: One device command to execute against the addressed entity.
      required: [command]
      additionalProperties: false
      properties:
        command:
          type: string
          minLength: 1
          description: >-
            The command name, which MUST resolve against the target
            entity's device class's own command vocabulary
            (`device-class-registry/1` REG-052); one that does not is
            refused by the relay without being attempted against the
            physical device (`relay/1` REL-113).
        params:
          type: object
          additionalProperties: true
          description: >-
            The command's parameters, as its device class declares them.
            These MAY carry credential material scoped to this single
            dispatch, which is never written to a durable store and never
            logged on either side (`relay/1` REL-114).

    EntityCommandResult:
      type: object
      description: >-
        The relay's own answer to a dispatched command (`relay/1` REL-112's
        `device.command_result`). A `200` with `ok: false` is a completed
        exchange whose command did not succeed — not a failed request; the
        request itself failing is a Problem with an api/1 `code`.
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        error:
          $ref: "#/components/schemas/EntityCommandError"

    EntityCommandError:
      type: object
      description: >-
        Present if and only if `ok` is false. `code` is drawn from
        `relay/1`'s own Error taxonomy — the same reuse-by-name discipline
        api/1 applies to a validation failure's per-field codes (API-013):
        the contract that owns the rule owns the code.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            A `relay/1` Error-taxonomy value — `COMMAND_UNRESOLVED` when the
            command is not one the target's device class declares (REL-113),
            `COMMAND_TARGET_UNREACHABLE` when the relay could not reach the
            device, `INTERNAL` for an unclassified relay-side failure.
          enum: [COMMAND_UNRESOLVED, COMMAND_TARGET_UNREACHABLE, INTERNAL]
        message:
          type: string

    # -----------------------------------------------------------------
    # Job — the async resource a fleet-mutating or otherwise
    # not-synchronously-completable operation returns via 202 Accepted
    # (contracts/api-1.md#fleet-mutating-operations--the-job-resource).
    # -----------------------------------------------------------------
    Job:
      type: object
      description: >-
        The accepted-work resource returned by 202 Accepted. A client
        polls this resource (`GET /jobs/{job_id}`) until `state` reaches a
        terminal value (`succeeded`, `failed`, or `partial`).
      required: [id, targets, created_by, state, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/JobTarget"
        created_by:
          type: string
          description: The submitting principal (opaque identifier; the principal/role model itself is out of this contract's scope).
        state:
          type: string
          description: pending/running are non-terminal; succeeded/failed/partial are terminal. `partial` is job-level only — never a JobTarget.state value.
          enum: [pending, running, succeeded, failed, partial]
        created_at:
          type: string
          format: date-time
          description: >-
            RFC 3339, and deliberately NOT the epoch-millisecond `Timestamp`
            every stored resource on this API carries. A Job is not a row of
            that baseline — it is minted by the accepting handler and
            serialized from a Go `time.Time` — so the two shapes differ
            because the two things differ, not by oversight.


    JobTarget:
      type: object
      description: One resource this Job acts on, and that resource's own per-target progress.
      required: [target_id, state]
      additionalProperties: false
      properties:
        target_id:
          type: string
          description: The acted-on resource's `id` or `external_id`, exactly as the fleet-mutating request identified it.
        state:
          type: string
          enum: [pending, running, succeeded, failed]
