openapi: 3.1.0
jsonSchemaDialect: "https://spec.openapis.org/oas/3.1/dialect/base"
info:
  title: Management API
  version: 1.0.0
  summary: The versioned management API — the single door every client (web UI, CLI, MCP server) uses to read and change platform state.
  description: >-
    This document is the source of truth every generated client (TypeScript
    for the web UI, Go for the CLI and MCP server) is produced from. Every
    operation lives under the `/api/v1` prefix. Cross-cutting conventions
    (error shape, optimistic concurrency, pagination, idempotency, trace
    propagation, MCP tag curation, the label-selector grammar, and the
    evolution policy) are specified normatively in `contracts/api-1.md`;
    this document implements those conventions as reusable components and
    applies them to every operation below. `scope-nodes` and `automations`
    are worked fully end to end (schemas, every verb, every error response);
    the remaining operations are SHAPE stubs — path, summary, tag and
    parameters, with the response schema reserved for a later minor.

    Every operation below is served by a real handler, and every route the
    server mounts appears below: the two sets are diffed against each other
    on every build (`internal/app/api`'s surface test), so this document
    cannot promise a generated client an operation that 404s, and a handler
    cannot be added that no client can discover and no schema constrains.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: "/api/v1"
    description: Same-origin deployment — the app serves the web UI and this API on one origin; the CLI and MCP server address it over the network binding.
tags:
  - name: auth
    description: >-
      Session issuance and revocation, the first-boot workspace claim, and
      credential reset. THREE operations here are credential-exchange
      operations declaring `security: []` (API-090/091) — `login`, `setup`
      and `redeemCredentialReset` — because each has a caller who by
      definition holds no session: one presenting credentials to get one, one
      claiming a box that has no principal at all, and one locked out of the
      credential being replaced. Everything else in this family, `logout` and
      `session` included, is an ordinary authenticated operation.
  - name: scope-nodes
    description: The org → site → group → screen tree every resource and durable event attaches to. Worked fully.
  - name: screens
    description: >-
      A screen's own identity row (`data-model/1` DAT-004/DAT-004a) — the row a
      `screen_id` names. Deliberately NOT the `screen`-kind scope node it is
      placed under: DAT-004 lets a screen row hang off a node of any kind, so
      two screens may share one node and a screen may sit directly under a
      site. Worked fully.
  - name: variables
    description: >-
      Named, scope-placed scalars (`data-model/1` DAT-130–138): the shared state
      a `rules/1` `variable` condition reads (RUL-150), a `variable_write`
      action writes (RUL-220), and whose every committed change emits
      `variable.changed` (`events/1` EVT-084/085). A variable is addressed by
      `name` within a scope node, resolved at a descendant node by walking
      `parent_id` to the nearest ancestor declaring that name — independently
      per name (DAT-134/135). Secret material MUST NOT be stored here
      (DAT-138): a variable is rule-readable, emitted in full on every change,
      and returned to any principal whose visible set covers its placement.
      Worked fully.
  - name: screen-status
    description: >-
      What the site's relays have OBSERVED each screen doing — when it last
      pulled a program, acknowledged a Lease and reported a render, what it was
      last handed, and whether an operator has pushed content to it out of band.
      A read model of relay reports, not authored state: it has no revision, no
      write operations, and it is not persisted, so it is empty until the relays
      next report. Worked fully.
  - name: adopted-devices
    description: >-
      The adopted-device rows the app peer compiles into a relay's desired-state
      `device_inventory` section (`relay/1` REL-063) — a device's driver, native
      identity, poll cadence, and the per-entity enabled/hidden/display-name/
      category policy. Authored here, unlike the `devices` family below: the
      relay is authoritative for what its LAN CONTAINS and reports candidates
      upward (REL-110/111), while adoption and the policy over it are decisions
      no discovery sweep can report. Worked fully.
  - name: devices
    description: >-
      The device registry — the adopted physical devices behind each site's
      relay. Read-only in this minor: a device enters the registry through the
      relay's own discovery and adoption plane (`relay/1` Device plane), not
      through an authoring write here. Discovery and adoption operations are a
      later minor.
  - name: entities
    description: >-
      The entity registry and state (device-plane objects; see rules/1 for
      automation semantics over entities). Read-only in this minor, plus the
      command operation — `relay/1` REL-112 addresses a device operation by a
      single already-resolved `entity_id`, so an entity, not a device, is what a
      command is sent to.
  - name: automations
    description: Rules — triggers, conditions, actions, and modes (rules/1 defines the vocabulary; this API manages the resource envelope around it). Worked fully.
  - name: schedules
    description: >-
      The scheduling core's schedule rows (`data-model/1`) — the container a
      daypart hangs off and the applicability cascade resolves against. Served
      end to end; the resource schema is a later minor.
  - name: dayparts
    description: >-
      The scheduling core's daypart rows (`data-model/1`) — a schedule's
      day-of-week/time windows and the playlist each one plays. Served end to
      end; the resource schema is a later minor.
  - name: playlists
    description: >-
      The scheduling core's playlist rows (`data-model/1`) — the ordered item
      list a daypart plays, whose `asset_ref`s must resolve in the content
      origin. Served end to end; the resource schema is a later minor.
  - name: casts
    description: >-
      Authored slidecasts (`data-model/1` DAT-043) — a named, ordered set of
      slides, each a positioned stack of native layers, built once and
      referenced from a playlist item (`source: "cast"`). This is the unit an
      operator authors and assigns to a screen; scheduling reaches it through a
      playlist, never directly. Worked fully.
  - name: content
    description: >-
      The content-addressed asset origin — the upload that puts bytes behind an
      `asset_ref` a playlist item can name. Served; the request/response schema
      is a later minor.
  - name: derive
    description: >-
      The RASTERIZED FALLBACK's work queue. A `derive` slide layer names
      something no native player node can draw — a gradient, a drop shadow, a
      rounded border, a font the device does not ship, a QR symbol — and it is
      turned into an ordinary content-addressed PNG by `waiveo-derive`, a
      SEPARATE off-appliance tool. The appliance deliberately never rasterizes
      anything: it holds no browser, and this family is the read-only listing
      that tells the operator's tool which layers are waiting. The tool renders
      them, uploads the PNGs through `POST /content`, and writes the resulting
      `asset_ref` back onto the layer with an ordinary `PATCH /casts/{id}`.
  - name: packs
    description: >-
      Installed declarative packs (`manifest/1`): the install/list/read/delete
      lifecycle, a pack's rendered pages and message catalogs
      (`ui-schema/1`), and CRUD over the rows of a collection the pack
      declares. Served end to end; the resource schemas are a later minor.
  - name: jobs
    description: >-
      The async Job resource a fleet-mutating or otherwise
      not-synchronously-completable operation returns via `202 Accepted`;
      see `contracts/api-1.md#fleet-mutating-operations--the-job-resource`.
      Path stub beyond the representative flows that return one.
  - name: workspace
    description: >-
      Workspace-level data-subject export and delete; see
      `contracts/api-1.md#data-subject-export--delete`. Specced; full
      data-subject-request workflow tooling is a deferred implementation.
  - name: webhook-endpoints
    description: >-
      Registration of outbound webhook endpoints — the URL a durable event is
      POSTed to, the schemas it subscribes to, and its scope-node placement.
      `events/1` EVT-150 defines the delivery mechanics given a registered
      endpoint and explicitly defers the registration resource itself to this
      contract. An endpoint's signing secret is never a member of its
      representation: it is installed and rotated through its own operation and
      appears in no response body.
  - name: diagnostics
    description: >-
      Operator diagnostics: the running process's captured log and the health
      summary that names the disk, the relays and the fleet. Neither is authored
      state, neither has a revision, and both are workspace-wide reads reserved
      to `owner` — a log line or a relay's advertised address is a map of the
      whole deployment, and there is no scope node to narrow either to.
  - name: "mcp:read"
    description: Curation tag — every operation carrying this tag is exposed as a non-mutating MCP tool. Not a resource family; see `contracts/api-1.md#mcp-operation-tag-curation`.
  - name: "mcp:act"
    description: Curation tag — every operation carrying this tag is exposed as a mutating MCP tool and requires the Idempotency-Key discipline. Not a resource family; see `contracts/api-1.md#mcp-operation-tag-curation`.
security:
  - SessionCookie: []
  - ApiKey: []
paths:
  # ---------------------------------------------------------------------
  # scope-nodes — exemplar #1, worked fully end to end.
  # ---------------------------------------------------------------------
  /scope-nodes:
    get:
      operationId: listScopeNodes
      summary: List scope nodes
      description: Returns a keyset-paginated, selector-filterable page of scope nodes.
      tags: [scope-nodes, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of scope nodes.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createScopeNode
      summary: Create a scope node
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeNodeCreate"
      responses:
        "201":
          description: The created scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /scope-nodes/{scope_node_id}:
    parameters:
      - name: scope_node_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getScopeNode
      summary: Read a scope node
      tags: [scope-nodes, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScopeNode
      summary: Update a scope node
      description: Partial update. Requires If-Match against the scope node's current ETag/revision.
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeNodeUpdate"
      responses:
        "200":
          description: The updated scope node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteScopeNode
      summary: Delete a scope node
      description: >-
        Requires If-Match against the scope node's current ETag/revision.
        Refused 409 when the node still carries a child node
        (`SCOPE_NODE_NOT_EMPTY`), is still named as another row's `scope_node`
        (`SCOPE_NODE_IN_USE`), or is the tree's org-kind root, which no
        ordinary write may remove (`SCOPE_NODE_ORG_UNDELETABLE`) —
        `contracts/data-model-1.md` DAT-020/021/022. All three refusals sit
        BEHIND the If-Match precondition, the org one included: API-022/023 are
        categorical and carve out nothing, so a caller omitting If-Match gets
        428 here exactly as on any other node, and learns the org delete is
        permanently refused on their first conforming request.
      tags: [scope-nodes, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  # ---------------------------------------------------------------------
  # automations — exemplar #2, worked fully end to end.
  # ---------------------------------------------------------------------
  /automations:
    get:
      operationId: listAutomations
      summary: List automations
      description: Returns a keyset-paginated, selector-filterable page of automations (rules).
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of automations.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createAutomation
      summary: Create an automation
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationCreate"
      responses:
        "201":
          description: The created automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /automations/{automation_id}:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getAutomation
      summary: Read an automation
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAutomation
      summary: Update an automation
      description: Partial update. Requires If-Match against the automation's current ETag/revision.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdate"
      responses:
        "200":
          description: The updated automation.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteAutomation
      summary: Delete an automation
      description: Requires If-Match against the automation's current ETag/revision.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /automations/{automation_id}/versions:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: listAutomationVersions
      summary: The definitions this rule used to have
      description: >-
        rules/1 RUL-394. Every update records the definition it REPLACED, in
        that update's own transaction, so an operator who breaks a working rule
        can read back the one that worked instead of retyping it from memory or
        restoring the whole workspace.

        Newest first. Each entry carries the revision it HELD — not the one
        that replaced it — so the sequence read here is the sequence that
        happened. A rule that has never been updated has no versions; a create
        records none, because there is no prior definition and a phantom
        "version 0" would claim a change nobody made.
      tags: [automations, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The superseded definitions, newest first. Shape stub, matching the rest of this surface.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /automations/{automation_id}/versions/{revision}/restore:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: The revision to restore, as `listAutomationVersions` reports it.
    post:
      operationId: restoreAutomationVersion
      summary: Put back a definition this rule used to have
      description: >-
        rules/1 RUL-394. Writes the named version's definition as a NEW update
        rather than rewinding: the restore is itself recorded, the history only
        grows, and an operator who restores the wrong version can restore back.

        It does NOT change whether the rule is enabled. An operator restoring
        the logic of a rule they disabled while debugging it has not thereby
        asked for it to start firing, so the current enablement is preserved
        over whatever the old definition carried.

        The restored definition is re-validated exactly as an authored one is
        (RUL-020's compile gate). A version that compiled under an earlier build
        of this platform is not thereby valid under this one, and restoring it
        unchecked would place a rule the evaluator cannot run into a slot the
        console reports as healthy — such a restore is refused, and the rule is
        left as it was.

        Carries an Idempotency-Key: a retry-on-timeout must not append a second
        identical restore to the history.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The rule as restored. Shape stub, matching the rest of this surface.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /automations/{automation_id}/run:
    parameters:
      - name: automation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: runAutomation
      summary: Run an automation now
      description: >-
        Runs the automation's action sequence NOW, for real, subject to its
        declared mode's normal mode-evaluation rules and to its own
        conditions: a `device_command` reaches the physical device down the
        owning relay's connection, and a signage action writes the targeted
        screens' program override. The response reports what it did, target by
        target. Pass `dry_run: true` to evaluate everything and withhold every
        effect. A mutating POST outside plain resource creation — accepts
        Idempotency-Key so a client's retry-on-timeout cannot double-fire the
        run.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRunRequest"
      responses:
        "200":
          description: The run completed; the response carries its disposition and every effect it produced.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /automations/bulk-enable:
    post:
      operationId: bulkEnableAutomations
      summary: Enable or disable a selector-matched set of automations
      description: >-
        Fleet-mutating operation
        (`contracts/api-1.md#fleet-mutating-operations--the-job-resource`):
        targets every automation the selector matches, accepts the same
        label-selector grammar a list operation does as its target
        predicate, and returns 202 with a Job resource rather than
        blocking until every target finishes.
      tags: [automations, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationBulkEnableRequest"
      responses:
        "202":
          description: Accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------
  # variables — named, scope-placed scalars (data-model/1 DAT-130-138): the
  # shared state a rules/1 `variable` condition reads (RUL-150) and a
  # `variable_write` action writes (RUL-220).
  #
  # A variable is addressed by `name` within a scope node, and the two
  # identifiers coexist on purpose (DAT-131): `id` is the row's identity for
  # revision, If-Match and audit, while `name` is how a rule, a pack and a
  # person refer to the value — a rule authored against `store_open` must keep
  # resolving after the row is deleted and recreated, which a server-minted
  # ULID cannot survive. So the path parameter is the ULID, exactly as every
  # other resource family's is, and the name is a member of the body.
  #
  # There is deliberately no `/variables/{name}` addressing and no
  # `/variables/{id}/value` sub-resource. A name is unique only WITHIN a scope
  # node (DAT-131), so a name alone does not identify a row; and a
  # value-only write would be a second mutation path with its own concurrency
  # story beside the PATCH that already exists.
  # ---------------------------------------------------------------------
  /variables:
    get:
      operationId: listVariables
      summary: List variables
      description: >-
        Returns a keyset-paginated, selector-filterable page of variable rows.
        Rows are returned AS STORED, each at its own placement — this is not
        the effective view resolved at some node (DAT-134), which would have to
        name a node to resolve at and would hide the overriding structure an
        operator is here to see.
      tags: [variables, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of variables.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createVariable
      summary: Create a variable
      description: >-
        Declares a variable at a scope node. `name` must match
        `^[a-z][a-z0-9_]{0,63}$` (DAT-131a) and be unused at that node
        (DAT-131); `value` must be a string, number, or boolean (DAT-132) —
        `null` is not settable, and the way to unset a variable is to delete
        the row (DAT-133). A committed create emits `variable.changed` with
        `old_value: null` (DAT-137, `events/1` EVT-084).
      tags: [variables, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreate"
      responses:
        "201":
          description: The created variable.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /variables/{variable_id}:
    parameters:
      - name: variable_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getVariable
      summary: Read a variable
      tags: [variables, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The variable.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateVariable
      summary: Update a variable
      description: >-
        Partial update. Requires If-Match against the variable's current
        ETag/revision. A committed update emits `variable.changed` carrying both
        the previous and the new value (DAT-137, `events/1` EVT-084).
      tags: [variables, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdate"
      responses:
        "200":
          description: The updated variable.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteVariable
      summary: Delete a variable
      description: >-
        Requires If-Match against the variable's current ETag/revision.
        Deleting a variable removes an OVERRIDE, it does not unset the name
        throughout the subtree: the nearest ancestor's row of the same name, if
        one exists, is re-exposed at every descendant that resolved through the
        deleted row (DAT-136). A committed delete emits `variable.changed` with
        `new_value: null` (DAT-137, `events/1` EVT-084).
      tags: [variables, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted. No content.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  # ---------------------------------------------------------------------
  # devices + entities — the device plane's read surface and its one
  # mutating operation, the command a relay executes against a physical
  # device (relay/1 Device plane, REL-112/113).
  #
  # Both families are read-only here: a device and its entities enter the
  # registry through the relay's own discovery and adoption plane, never
  # through an authoring write on this API, so neither declares a create,
  # update, or delete. Adoption operations are a later minor, additive to
  # these paths.
  # ---------------------------------------------------------------------
  /devices:
    get:
      operationId: listDevices
      summary: List devices
      description: >-
        Returns a keyset-paginated, selector-filterable page of the adopted
        physical devices behind this deployment's relays.
      tags: [devices, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of devices.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /devices/{device_id}/adopt:
    parameters:
      - name: device_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: adoptDevice
      summary: Adopt a discovered device
      description: >-
        Puts a device this deployment's relays have discovered under this
        platform's control, by creating the durable adoption record its
        relay is then sent in signed desired state (`relay/1` REL-063).
        Discovery finds devices; adoption is the decision to use one, and
        this operation is that decision.


        The record is created with the device's own reported entities
        enabled and primary — the policy an operator refines afterwards
        through the `adopted-devices` family. Adopting a device that is
        already adopted succeeds and changes nothing, so a double-click or a
        retry-after-timeout is not an error.


        A mutating POST tagged `mcp:act`, so it accepts `Idempotency-Key`.
      tags: [devices, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: >-
            The device is adopted. The body is the device as it now reads,
            with `adopted` true.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /entities:
    get:
      operationId: listEntities
      summary: List entities and their current state
      description: >-
        Returns a keyset-paginated, selector-filterable page of entities —
        the addressable device-plane objects a device exposes, and the
        targets `rules/1` entity references and this API's command
        operation resolve to.
      tags: [entities, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of entities.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /entities/{entity_id}/commands:
    parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: sendEntityCommand
      summary: Send a command to an entity
      description: >-
        Dispatches one device command to the entity's owning relay over that
        relay's existing persistent connection and returns the relay's own
        correlated result (`relay/1` REL-112). The command is addressed to a
        single already-resolved entity: `relay/1` accepts no selector or
        device-class filter, so fanning a command across a set is a client's
        (or `rules/1`'s) concern, not this operation's.


        The exchange completes within this request/response cycle — the
        relay answers on the same connection — so this operation returns its
        result synchronously rather than the `202 Accepted` plus Job that
        `contracts/api-1.md#fleet-mutating-operations--the-job-resource`
        requires of work that cannot complete in-cycle.


        A mutating POST tagged `mcp:act`, so it accepts `Idempotency-Key`: a
        client's retry-on-timeout replays the retained result rather than
        firing the command at the physical device a second time.
      tags: [entities, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityCommandRequest"
      responses:
        "200":
          description: >-
            The relay answered. `ok` reports whether the command succeeded
            against the physical device; a refusal the relay typed itself
            (an undeclared command, an unreachable device) rides `error`.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ---------------------------------------------------------------------
  # jobs — the async Job resource a fleet-mutating or otherwise
  # not-synchronously-completable operation returns via 202 Accepted
  # (contracts/api-1.md#fleet-mutating-operations--the-job-resource).
  # ---------------------------------------------------------------------
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getJob
      summary: Read a Job resource
      description: A client polls this operation until the returned Job's `state` reaches a terminal value.
      tags: [jobs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The job.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------
  # workspace — data-subject export/delete, specced at the shape level
  # (contracts/api-1.md#data-subject-export--delete). Both return 202 with
  # a Job resource, exactly like a fleet-mutating operation, since neither
  # completes within its own request/response cycle. Neither takes a
  # selector: API-123 makes each operation's target the workspace itself,
  # implicit in the request path, so API-110's selector convention does not
  # apply.
  # ---------------------------------------------------------------------
  /revocations:
    post:
      operationId: revokeSubject
      summary: Revoke a relay certificate or a screen
      description: >-
        Declares that a provisioned identity is no longer trusted (API-140).
        Relay-certificate and screen revocation are ONE operation because they
        are the same decision twice — what act revokes a thing, and where an
        operator performs it — and deciding them apart guarantees drift in the
        authorization floor, the audit shape and the confirmation.

        Revocation is NOT implied by deleting the relay or screen (API-141): the
        threat is a still-provisioned peer that has become untrusted. It is
        TERMINAL (API-142); recovery is re-enrollment.

        A request WITHOUT `confirm: true` changes nothing and answers with the
        blast radius (API-143), so a caller that omits the field learns what
        would stop working rather than causing it. Owner-at-root only
        (`security-model.md` SEC-003f).
      tags: [security, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevocationRequest"
      responses:
        "200":
          description: >-
            The blast radius, and whether the revocation was performed. Without
            `confirm` nothing changed and `revoked` is false.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /workspace/restore:
    post:
      operationId: restoreWorkspace
      summary: Stage a workspace restore from a portable archive
      description: >-
        Restores the workspace from a container `archive/1` defines, applied
        through an OFFLINE SWAP: the restored relational store is built beside
        the live one and adopted at the next boot. The Job's success therefore
        means "staged and ready", never "your workspace is now the archived
        one" — a restart is what completes it, and the destination is briefly
        unavailable across it.

        That shape is what makes ARC-107's rollback guarantee hold without a
        rollback step: nothing the live workspace uses is touched until
        everything has already succeeded, so a restore that fails has changed
        nothing rather than needing to be undone. Owner-role only, like export.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRestoreRequest"
      responses:
        "202":
          description: >-
            Restore accepted; poll the returned Job resource. Its success means
            the restored store is STAGED — the swap happens at the next boot.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /workspace/archives:
    get:
      operationId: listWorkspaceArchives
      summary: List the archive containers on this box
      description: >-
        The containers `POST /workspace/export` has written into this
        deployment's archive directory, newest first.


        It exists because `POST /workspace/restore` names an archive by FILE
        NAME, and before this the only way to learn a name was to know that an
        export writes `workspace-{job id}.waiveo-archive` and to have kept the
        job id. An operation whose one required argument cannot be discovered
        through the API is one no console can offer.


        Only files carrying the archive suffix are listed: a scratch snapshot or
        a partial write must never be offered as a restorable backup. A
        deployment that has never exported answers an empty list, not an error —
        "no backups yet" is the truth about a fresh box.
      tags: [workspace, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The containers present, newest first.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceArchiveList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /workspace/archives/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The container's file name, exactly as `listWorkspaceArchives` published it.
    get:
      operationId: downloadWorkspaceArchive
      summary: Download one archive container
      description: >-
        The container's bytes, as an attachment, so a backup can leave the box it
        backs up. A backup that only ever exists on the machine it backs up
        protects against a bad edit and against nothing else — the one failure an
        operator buys a backup for is losing the box.


        The bytes are the `archive/1` container: encrypted under the passphrase
        supplied at export (ARC-010) and signed by the workspace key, so they are
        opaque without that passphrase even to this process.


        `name` must be a BARE file name carrying the archive suffix, never a
        path. Anything else is `404`, not a traversal.
      tags: [workspace, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The container's bytes, as an attachment.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteWorkspaceArchive
      summary: Delete one archive container from this box
      description: >-
        Unlinks the container. This is IRREVERSIBLE and it is the whole backup:
        the bytes are encrypted under a passphrase this box does not keep, so
        nothing here or anywhere else can reconstruct them. A client that has not
        downloaded the container first is destroying the only copy.


        It exists because the box already instructs an operator to do this and
        gave them no way to. `GET /system-health` grades disk headroom `low` and
        its detail says to prune old images and archives; until this operation
        there was no archive-side prune to perform, so the advice ended at a dead
        end — and a full disk is the failure mode that has taken this appliance's
        predecessor down for real.


        Requires `If-Match` against the container's current `etag`, exactly as
        every other delete on this surface conditions on what the client last
        saw. There is no unconditional path (API-022).


        Refuses `409 ARCHIVE_IN_USE` while an accepted export is still writing
        this container or an accepted restore is still reading it. Deleting
        either would otherwise be a race whose outcome the operator cannot see:
        an unlink lands before or after the reader opened its descriptor, so the
        same request either does nothing observable or fails somebody else's job
        with a message about a file they did not touch.


        An in-flight DOWNLOAD is not a conflict and does not refuse. It holds an
        open descriptor, so its bytes are delivered whole; only a download
        started after the unlink sees the ordinary `404`.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: The container is gone from this box.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /workspace/export:
    post:
      operationId: exportWorkspace
      summary: Export the workspace as a portable archive
      description: >-
        Data-subject export operation
        (`contracts/api-1.md#data-subject-export--delete`). API-121 makes
        this the API-facing trigger for the container `archive/1` defines,
        not a second export format: the Job's success means exactly that
        container now exists for this workspace. Owner-role only — an
        export carries the whole workspace, so no scope-node-narrowed role
        can invoke it. A fuller data-subject-request workflow (intake and
        tracking for a request arriving outside this API) is the deferred
        implementation API-124 names.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceExportRequest"
      responses:
        "202":
          description: Export accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /workspace/delete:
    post:
      operationId: deleteWorkspace
      summary: Erase the workspace's data via key-material destruction
      description: >-
        Data-subject delete operation
        (`contracts/api-1.md#data-subject-export--delete`). API-122 routes
        it to the workspace's key-material destruction path
        (`security-model.md` SEC-121) — this IS that destruction, not a
        separate deletion mechanism. It is irreversible: owner-role only,
        and the body MUST name the workspace being destroyed
        (`confirm_workspace_id`), so no single blind request can erase a
        deployment. A fuller data-subject-request workflow is the deferred
        implementation API-124 names.
      tags: [workspace, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeleteRequest"
      responses:
        "202":
          description: Deletion accepted; poll the returned Job resource for completion.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------
  # Tagged stubs — path + summary + tag only; full shapes land in a later
  # minor (additive, per contracts/api-1.md's evolution policy).
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a session
      description: >-
        Credential-exchange operation
        (`contracts/api-1.md#security-override-convention`, API-090/091):
        authenticates the request from credentials in the body, not a
        pre-existing session or API key. On success it sets a host-only
        session cookie (`security-model.md` SEC-023) and a companion,
        script-readable CSRF cookie whose value every mutating request must
        echo in `X-CSRF-Token` (SEC-024). Repeated failures lock the
        presented credential per source-IP class with exponential backoff
        (SEC-090, `CREDENTIAL_LOCKED`).
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session the presented credentials minted.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
            Set-Cookie:
              description: >-
                The `session` cookie (HttpOnly, host-only, SameSite) and the
                `csrf_token` cookie (readable by the page's own script — that
                readability IS the double-submit mechanism, SEC-024).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the calling session
      description: >-
        Revokes the session or API key that authenticated this request
        (`security-model.md` SEC-020) and expires its cookies. Ordinary
        authenticated operation — deliberately NOT `security: []`, so a
        browser caller is subject to the same double-submit CSRF requirement
        every other mutating route carries (SEC-024) and a cross-site page
        cannot sign a user out.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: The session was revoked.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/session:
    get:
      operationId: getSession
      summary: Read the calling principal's own session
      description: >-
        Returns the caller's own principal, effective role, and assurance
        level — what a console reads on load to decide whether to render the
        application or the sign-in page.
      tags: [auth, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The calling session.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/setup:
    post:
      operationId: claimWorkspace
      summary: Claim an unclaimed workspace by redeeming the one-time setup grant
      description: >-
        First-boot claim (`security-model.md` SEC-120). The installer
        generates a one-time `setup`-purpose grant and presents its code;
        this endpoint is claimable ONLY by redeeming that code, so an
        installed-but-unclaimed box on a shared network is never
        first-come-first-served. Redemption is an atomic check-and-consume
        (SEC-036): of two concurrent claims presenting one code, at most one
        succeeds and the other is refused `GRANT_ALREADY_REDEEMED`.
        Credential-exchange operation (API-090/091) — it mints the very first
        principal on the box, so it cannot require a pre-existing session.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "201":
          description: The workspace was claimed; the first owner principal and its session.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
            Set-Cookie:
              description: The `session` and `csrf_token` cookies, as for `login`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The grant was expired (`GRANT_EXPIRED`), already redeemed
            (`GRANT_ALREADY_REDEEMED`), or of a purpose that does not match
            this endpoint (`GRANT_PURPOSE_MISMATCH`) — `security-model.md`
            SEC-035.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/api-keys:
    get:
      operationId: listApiKeys
      summary: The api-keys that can act as the signed-in principal
      description: >-
        security-model SEC-003e. Returns each live key's `label`,
        `created_at` and `last_used_at`, and NEVER the secret or any prefix of
        it — a prefix is a shortcut for an attacker holding a partial capture
        and buys a legitimate operator nothing a label does not.

        Scoped to the caller's own principal. Revoked keys are omitted: the
        question this answers is "what can act as me right now", and a revoked
        key cannot; its history belongs to the audit log.
      tags: [auth, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The caller's live api-keys. Shape stub, matching the rest of this surface.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: mintApiKey
      summary: Mint an api-key, returning its plaintext exactly once
      description: >-
        security-model SEC-003a–e. Mints an api-key for the SIGNED-IN
        principal, which must be of kind `user` (SEC-003a): a screen, relay or
        pack-service has its own credential ceremony, and an api-key for one
        would be a second, weaker path to an identity those ceremonies
        deliberately make expensive.

        Minting for ONESELF requires `admin` at the workspace root (SEC-003b).
        This operation does not mint for another principal at all — that
        requires `owner` and is deliberately not offered here, because handing
        over a credential that acts as someone else belongs with the other
        authority-transferring operations rather than beside a self-service
        one.

        The key carries exactly the role bindings its principal already holds
        and accepts NO scope or role narrowing (SEC-003c): a key is a way to
        ACT AS a principal, not a second, weaker principal. Where narrower
        authority is wanted, the primitive is a principal with narrower
        bindings.

        `expires_at` is OPTIONAL (SEC-003d) because unattended callers — a
        scheduled job, a CI runner — are part of what api-keys exist for, and a
        mandatory deadline makes those fail on a schedule nobody is watching.

        THE PLAINTEXT IS RETURNED EXACTLY ONCE (SEC-003e) and is not
        recoverable afterwards by any operation.
      tags: [auth, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label:
                  type: string
                  minLength: 1
                  description: What this key is for, so an inventory is readable.
                expires_at:
                  type: integer
                  format: int64
                  description: Optional absolute expiry, epoch ms (SEC-003d).
      responses:
        "201":
          description: >-
            The minted key, INCLUDING its plaintext — the only time it is ever
            returned. Shape stub, matching the rest of this surface.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /auth/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
        description: The key's session id, as `listApiKeys` returns it.
    delete:
      operationId: revokeApiKey
      summary: Revoke an api-key
      description: >-
        security-model SEC-020: an api-key is revocable through the same
        mechanism a session is, because an api-key IS a session row carrying
        its own credential id — so this is deliberately the same revocation
        rather than a parallel path that could drift from it.

        Scoped to the caller's own keys. Revoking a key that is already revoked
        is a 404: it is not among the keys that can act as the caller, which is
        the set this addresses.
      tags: [auth, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Revoked. The key is refused from the next request onward.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/password:
    put:
      operationId: changeOwnPassword
      summary: Change your own password
      description: >-
        security-model SEC-054. Changes the CALLING principal's `password`
        credential, presenting the current password alongside the new one.

        Requiring the current password is what separates this from SEC-050's
        admin-issued reset, and it is not optional: without it a stolen session
        is a permanent account takeover rather than a bounded one, because the
        thief could lock the owner out using nothing but the session they
        already hold. A wrong current password is refused and counts against
        the same attempt budget a sign-in does (SEC-090) — it is a password
        guess by another name.

        It changes only the caller's own password. Never another principal's
        (that is SEC-050, which exists so changing someone else's credential
        carries an audit trail naming an admin), and never TOTP enrollment,
        for the reason SEC-052 withholds TOTP from a reset grant.

        On success every OTHER session of the caller is revoked and the one
        that made the change is kept: rotating a credential you believe is
        exposed is not helped by leaving other sessions live, and is actively
        harmed by being signed out mid-task with a password you may have
        mistyped twice.

        API-key credentials are NOT revoked — the deliberate asymmetry with
        SEC-053, whose blanket revocation is right for a reset (nobody could
        prove knowledge of the password) and wrong here (the caller just did).
        Silently killing every running integration is not a consequence an
        operator expects from a password field; each key is separately listed
        and revocable.
      tags: [auth, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "204":
          description: Changed. Other sessions are revoked; this one continues.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/credential-reset:
    post:
      operationId: issueCredentialReset
      summary: Issue a one-time credential-reset code for a user principal
      description: >-
        Routine credential reset, issuing half (`security-model.md` SEC-050).
        Mints a `credential-reset`-purpose grant (SEC-030) for the named
        `user` principal and returns the one-time code for the issuing admin
        to hand over. Requires at least the `admin` role somewhere in the
        scope tree (SEC-012).

        The response carries NO credential value and no way to choose one:
        the target chooses their own value when they redeem, on
        `redeemCredentialReset`. That is a property of this operation's
        shape rather than a runtime check — there is no request or response
        field a credential could travel in.

        A `url` field is deliberately absent. Any link this operation
        returned would have to name a host learned from the request, and a
        poisoned `Host` header would produce a handoff link carrying a live
        one-time code to somebody else's origin. SEC-050 admits "a one-time
        code or URL"; this binding returns the code.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialResetRequest"
      responses:
        "201":
          description: The grant was minted; its one-time code, for handing to the target.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResetHandoff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}/actions/{action}:
    post:
      operationId: invokePackAction
      summary: Invoke an action an installed pack declares
      description: >-
        The management-API route `manifest/1` MAN-101 auto-surfaces for every
        declared action. The call is QUEUED rather than performed inline: a pack
        is a separate OS process with no inbound address the host can dial, and
        it may be starting, swapping or stopped. The response is the invocation,
        and its outcome is read back from it.

        The action's idempotency class (MAN-103) is copied onto the invocation at
        enqueue, which is what decides its fate if the pack takes the work and
        dies before answering — a `safe-to-retry` action is offered again, a
        `not-idempotent` one is failed with its fate recorded as unknown, and is
        never automatically replayed.
      tags: [packs, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/PackPublisherParam"
        - $ref: "#/components/parameters/PackNameParam"
        - name: action
          in: path
          required: true
          schema: { type: string }
          description: The declared action's `name` (MAN-100).
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackActionInvokeRequest"
      responses:
        "202":
          description: >-
            The queued invocation. Shape stub, matching the rest of this surface.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /pack-logs:
    post:
      operationId: appendPackLog
      summary: Record a log line from the calling extension
      description: >-
        An installed extension reports its own activity into the platform log an
        operator already reads at `/platform-logs`, where it is filterable by
        source like any other component.

        The line's SOURCE is the caller's own pack, resolved from its principal
        and never taken from the request. A pack that could attribute a line to
        another pack — or to the platform — would turn the log an operator uses
        to decide what went wrong into a place an extension can lie.

        `level` is taken rather than inferred from the words: the sender knows
        whether it is reporting a failure, and classifying by text would let an
        error hide as an info line simply by avoiding the word.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackLogAppendRequest"
      responses:
        "204":
          description: The line was recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /pack-health:
    post:
      operationId: reportPackHealth
      summary: Report the calling extension's own condition
      description: >-
        An extension says how it is doing, and the line appears in
        `GET /system-health` beside the first-party services — an operator asking
        whether a box is healthy should not have to know which parts of it are
        extensions.

        The host can observe that a pack's PROCESS is alive; it cannot observe
        whether the pack is working. A backup extension whose credentials expired
        is running perfectly and doing nothing, and only the pack knows that.

        A report goes STALE. One that never expired would leave a green line for
        an extension that wedged an hour ago, on the page an operator opened to
        find out what was wrong. A stale report reads `unknown` — we were told
        once and have not been told since — rather than `down`, because a missed
        report is evidence about the reporting, not about the pack.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackHealthReportRequest"
      responses:
        "204":
          description: The report was recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /pack-events:
    post:
      operationId: emitPackEvent
      summary: Emit a durable event the calling extension declared
      description: >-
        The event lands in the same durable log every first-party event does, so
        an automation rule can fire on it through machinery that already reads
        that log.

        The name MUST be one the pack declared under
        `contributes.automation.events` (`manifest/1` MAN-090). An undeclared
        name would put a schema into the log that no manifest describes — nothing
        could validate its payload, and an operator reading the log would find
        records whose shape has no owner.

        The event is attributed to the calling pack's principal and placed at the
        scope its identity was issued at. Neither is taken from the request: an
        event a pack could place at a scope of its choosing is one it could hide
        from the operators who can see that scope.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackEventEmitRequest"
      responses:
        "204":
          description: The event was recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /pack-invocations/pending:
    get:
      operationId: leasePackInvocation
      summary: Lease the next invocation queued for the calling pack
      description: >-
        The pack side of the actions plane. An extension long-polls this route
        and receives at most one invocation, leased to it for a bounded time.

        Which pack's queue is served is resolved from the CALLER'S PRINCIPAL, not
        from any parameter: a pack that could name a queue could lease another
        pack's work and answer on its behalf. Only a `pack-service` principal
        (`security-model.md` SEC-037) reaches this route at all.

        An empty queue answers `204`, not an error — a pack polling an idle host
        is the common case, and an error there would make "nothing to do"
        indistinguishable from a broken queue.
      tags: [packs]
      parameters:
        - name: wait
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 60 }
          description: >-
            Seconds to hold the request open while the queue is empty. Zero
            returns immediately.
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The leased invocation. Shape stub, matching the rest of this surface.
        "204":
          description: Nothing is queued for this pack.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /pack-invocations/{invocation_id}/result:
    post:
      operationId: reportPackInvocationResult
      summary: Report the outcome of a leased invocation
      description: >-
        The pack answers the work it leased. Accepted only while the caller still
        holds the lease: a result arriving after expiry is refused, because
        accepting it would let an invocation already failed at expiry flip to
        succeeded and erase the uncertainty that failure recorded (MAN-103).
      tags: [packs]
      parameters:
        - name: invocation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackInvocationResultRequest"
      responses:
        "200":
          description: The completed invocation. Shape stub, matching the rest of this surface.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /auth/tier-grant/redeem:
    post:
      operationId: redeemTierGrant
      summary: Exchange a pack's start-time code for its session
      description: >-
        The redeeming half of the tier-grant ceremony (`security-model.md`
        SEC-037). An installed pack's process is started by the host with a
        one-time, short-lived code and exchanges it here for the session it
        makes every subsequent call with.

        Credential-exchange operation (API-090/091), `security: []`: the caller
        has no identity yet — acquiring one is the entire point — so requiring a
        session would make the operation unreachable by the only party permitted
        to perform it. Bounded by SEC-033's attempt budget, applied before the
        code is looked up, and by SEC-036's atomic check-and-consume.

        The pack's identity comes off the GRANT, never off this request: there
        is no parameter through which a caller could name a pack. A process that
        could name itself would be able to claim any pack's identity, data and
        audit trail with a code it merely obtained.

        A pack holds no long-lived credential at all — SEC-003a refuses an
        api-key for a `pack-service` principal. The session returned here dies
        with the process that earned it, and the code is spent by this exchange.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierGrantRedeemRequest"
      responses:
        "201":
          description: >-
            The pack's session, INCLUDING its bearer token — the only time it is
            ever returned. Shape stub, matching the rest of this surface.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/credential-reset/redeem:
    post:
      operationId: redeemCredentialReset
      summary: Redeem a credential-reset code and set a new password
      description: >-
        Routine credential reset, redeeming half (`security-model.md`
        SEC-050/052/053). The TARGET presents the one-time code they were
        handed and chooses their own new credential value — the only point in
        this flow where a credential value is accepted at all.

        Credential-exchange operation (API-090/091), `security: []`: the
        caller is by definition someone who cannot sign in, so requiring a
        session would make the operation unreachable by the only party
        permitted to perform it. Bounded by SEC-033's attempt budget, applied
        before the code is looked up, and by SEC-036's atomic
        check-and-consume.

        Redemption revokes every existing session and API-key credential of
        the target by default (SEC-053), unless the issuance opted out. It
        does NOT touch the target's TOTP enrollment (SEC-052), and it mints
        no session: a principal holding a second factor still has to present
        it at `login`, so a reset can never become a way past it.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialResetRedeemRequest"
      responses:
        "204":
          description: >-
            The credential was set. No body and no session — the target signs
            in through `login`, second factor included.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The grant was expired (`GRANT_EXPIRED`), already redeemed
            (`GRANT_ALREADY_REDEEMED`), or of a purpose that does not match
            this endpoint (`GRANT_PURPOSE_MISMATCH`) — `security-model.md`
            SEC-035.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Begin a TOTP second-factor enrollment for the calling principal
      description: >-
        Mints a fresh TOTP shared secret for the CALLING principal and returns
        it once, as an `otpauth://` URI and as a typeable base32 key. The
        enrollment is not armed by this call — nothing authenticates until
        `confirmTotp` returns a code computed from the secret, which is the
        only evidence the secret reached an authenticator.
        `security-model.md` SEC-004 makes `totp` the guaranteed second-factor
        floor, "available without a secure-context precondition": unlike
        `passkey` (SEC-102), this operation stays available on the self-signed
        TLS fallback (SEC-110). A principal may enroll only for ITSELF —
        clearing or re-enrolling another principal's TOTP is the owner-explicit
        or console-binding path SEC-052 defines, not this one.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The pending enrollment's shared secret, returned exactly once.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            This principal already holds a TOTP credential; replacing it is a
            credential-reset or recovery operation (`security-model.md`
            SEC-052), not a self-service one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Arm the pending TOTP enrollment by returning a code from it
      description: >-
        Verifies a code against the calling principal's pending enrollment and,
        on success, writes the `totp` credential row (`security-model.md`
        SEC-003). The confirming code's own time step is spent at arming, so it
        cannot also complete a sign-in. Every OTHER live session and API key of
        this principal is revoked — a session minted on one factor does not
        outlive the moment the principal decided one factor was not enough —
        while the calling session survives, having just proven the new factor.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmRequest"
      responses:
        "200":
          description: The armed credential's metadata (never its secret).
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment is in progress for this principal; start one first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
