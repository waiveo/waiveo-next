        category:
          type: string
          enum: [primary, diagnostic]

    AdoptedDevice:
      type: object
      description: >-
        One adopted device — the row a `device_id` names (`data-model/1`
        DAT-004a) and the row a relay's desired-state `device_inventory` entry
        is compiled from (`relay/1` REL-063). It is an ADOPTION RECORD: the
        relay is authoritative for what exists on its LAN and reports
        discovered-but-unadopted candidates upward (REL-110/111), while the
        adoption decision and the policy over it are authored here. Its identity
        is `(site, driver, native_id)`, never the relay that happens to report
        it (REL-153) — which is why no `relay_id` appears on this resource, and
        why two rows may not share a `(driver, native_id)`.
      required: [id, name, scope_node, driver, native_id, poll_cadence_seconds, entities, labels, revision, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        external_id:
          type: ["string", "null"]
          description: Client-assigned identifier (contracts/api-1.md#client-assignable-external_id).
          x-go-type: "*string"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope_node:
          $ref: "#/components/schemas/Ulid"
        driver:
          type: string
          minLength: 1
          description: Half of the `(site, driver, native_id)` tuple this device's identity is scoped to (`relay/1` REL-063).
        native_id:
          type: string
          minLength: 1
          description: The device's own identifier on its LAN — the other half of its identity tuple (`relay/1` REL-063).
        poll_cadence_seconds:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            How often the relay should poll this device. `null` when this
            deployment has stated no cadence — REL-063 fixes no default, and a
            number here would be a polling policy nobody authored.
          x-go-type: "*int"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/AdoptedDeviceEntity"
        labels:
          $ref: "#/components/schemas/LabelMap"
        revision:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

