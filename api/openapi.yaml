  # ---------------------------------------------------------------------
  # webhook-endpoints — outbound webhook registration (events/1 EVT-150).
  #
  # The five CRUD operations are the SAME resource shape every other family
  # is worked as, served by the same generic handler and honouring the same
  # conventions. The three operations beyond them exist because a signing
  # secret has no representation to GET, an endpoint's delivery state carries
  # no revision to condition a write on, and re-enabling is an act rather than
  # an edit — modelling any of them as a member of the endpoint's own body
  # would put platform-owned execution state under If-Match.
  #
  # No response on this family carries a signing secret. The rotate operation
  # takes one and answers with the rotation's timing only: the caller supplied
  # the value and already has it, and a copy in a response body is a copy in
  # every proxy log and every retained idempotency replay between here and
  # them.
  # ---------------------------------------------------------------------
  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      description: Returns a keyset-paginated, selector-filterable page of registered outbound webhook endpoints.
      tags: [webhook-endpoints, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SelectorParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of webhook endpoints.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: >-
        Registers an endpoint durable events are delivered to. The endpoint
        receives nothing until a signing secret is installed
        (`rotateWebhookSigningSecret`): an unsigned POST is not a delivery
        `events/1` defines.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreate"
      responses:
        "201":
          description: The registered webhook endpoint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /webhook-endpoints/{webhook_endpoint_id}:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getWebhookEndpoint
      summary: Read a webhook endpoint
      tags: [webhook-endpoints, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
