          description: The updated webhook endpoint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      description: >-
        Deletes the registration. The endpoint's delivery progress and its
        sealed signing secret are destroyed with it — a deleted endpoint leaves
        no credential material behind.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /webhook-endpoints/{webhook_endpoint_id}/signing-secret:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: rotateWebhookSigningSecret
      summary: Install or rotate a webhook endpoint's signing secret
      description: >-
        Installs the secret every delivery to this endpoint is signed with
        (`events/1` EVT-151). The first call arms the endpoint — until it lands
        the endpoint receives nothing. Every later call is a rotation: the
        secret being replaced stays acceptable for a stated overlap window
        (EVT-158), during which a delivery carries a second signature computed
        under it, so a receiver has time to adopt the new secret before the old
        one stops working. The secret is supplied by the caller and appears in
        no response.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSigningSecretRequest"
      responses:
        "200":
          description: The rotation's timing. Never the secret.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSigningSecretRotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhook-endpoints/{webhook_endpoint_id}/enable:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    post:
      operationId: enableWebhookEndpoint
      summary: Re-enable an auto-disabled webhook endpoint
      description: >-
        `events/1` EVT-154 disables an endpoint whose deliveries have failed
        past a bounded consecutive-failure count, and a disabled endpoint
        receives no further attempts until an operator re-enables it. This is
        that act. The endpoint's delivery cursor is left exactly where it was,
        so it resumes from where it stopped rather than skipping what it never
        received (EVT-155). Enabling an already-active endpoint is not an error.
      tags: [webhook-endpoints, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The endpoint's delivery state after re-enabling.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /webhook-endpoints/{webhook_endpoint_id}/delivery:
    parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getWebhookDeliveryState
      summary: Read a webhook endpoint's delivery state
      description: >-
        Reports whether the endpoint is active or auto-disabled (EVT-154), how
        far delivery has got (EVT-155's `last_delivered_id`), and how long its
        current unbroken failure run is. This is the durable, operator-facing
        view of the auto-disable signal: the fact survives whether or not
        anyone was listening when it happened.
      tags: [webhook-endpoints, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The endpoint's delivery state.
          headers:
            Trace-Id:
              $ref: "#/components/headers/TraceIdResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # ---------------------------------------------------------------------
  # packs — installed declarative packs (manifest/1).
  #
  # A pack id is `<publisher>/<name>` (MAN-001) — TWO path segments, never
  # one opaque percent-encoded one, which is why every item path below
  # templates `{publisher}` and `{name}` separately. A pack's own pages
  # (ui-schema/1) may be nested, so the page path's final template is a
  # multi-segment remainder.
  # ---------------------------------------------------------------------
  /packs:
    get:
      operationId: listPacks
      summary: List installed packs
      description: >-
        Keyset-paginated. No `selector`: a pack is installed workspace-wide
        rather than placed at a scope node, so there are no labels for the
        label-selector grammar to evaluate.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of installed packs. Shape stub — the pack envelope schema is a later minor.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: installPack
      summary: Install a pack from its artifact or by marketplace reference
      description: >-
        Two request bodies, distinguished by content type. Raw artifact bytes
        (any content type but `application/json`) install that artifact
        directly. An `application/json` body is a marketplace reference
        (marketplace/1 MKT-060a) resolved against the deployment's configured
        registry sources. Both converge on one pipeline — the same signature
        envelope verification against the same trust anchors, the same manifest
        gate, the same atomic write and the same install record — so resolving a
        pack can never accept an artifact a direct upload would refuse.
        Installation executes nothing: a pack is data.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceRef"
      responses:
        "200":
          description: The pack was already installed and has been updated in place. Shape stub.
        "201":
          description: The pack was installed. Shape stub — the install summary schema is a later minor.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    get:
      operationId: getPack
      summary: Read an installed pack
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The pack envelope and its manifest. Shape stub — the schema is a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: uninstallPack
      summary: Uninstall a pack
      description: >-
        Removes the pack and everything it owns — its bundle, its authored
        collection rows, and its install records (marketplace/1 MKT-094b) — in
        one transaction. The per-(pack, trust channel) resolved-version
        high-water mark deliberately survives (MKT-050/MKT-094b), so
        uninstall-then-reinstall is not a downgrade path. A pack on this
        deployment's required-pack roster cannot be uninstalled at all
        (MKT-093b): removal is removal to no version, which is below every
        floor, and the refusal is decided inside the removal transaction rather
        than in this handler.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Uninstalled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /packs/{publisher}/{name}/pages/{path}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - name: path
        in: path
        required: true
        description: >-
          The page's own path within the pack (ui-schema/1 UIS-001). It MAY
          span several segments, so the slashes inside it are part of the
          value rather than separators between parameters.
        schema:
          type: string
    get:
      operationId: getPackPage
      summary: Read a pack-declared page definition
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The page's ui-schema/1 definition. Shape stub — the schema is ui-schema/1's, declared in a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /packs/{publisher}/{name}/messages/{locale}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - name: locale
        in: path
        required: true
        description: BCP 47 locale tag naming the catalog to serve (manifest/1 MAN-110).
        schema:
          type: string
    get:
      operationId: getPackMessages
      summary: Read a pack's message catalog for one locale
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The resolved message catalog. Shape stub — the schema is a later minor.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /packs/{publisher}/{name}/installs:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    get:
      operationId: listPackInstalls
      summary: List a pack's install-record history
      description: >-
        Keyset-paginated, oldest first: the append-only install records
        marketplace/1 MKT-094b requires, whose last entry is MKT-094's current
        pin. Each record carries what was resolved (version, trust channel,
        registry source) and the provenance the install was accepted on
        (MKT-094a): the content digest and key id of the signature envelope
        verification that admitted the artifact. That envelope is dropped at
        install and never persisted (MKT-009a), so these records are the only
        answer to "which key vouched for the bytes that are running". A pack
        that is not installed is a 404 — its records were removed with it.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of install records. Shape stub — the install-record schema is a later minor, matching the rest of this surface.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /packs/{publisher}/{name}/update:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
    post:
      operationId: updatePack
      summary: Run one update check against a pack's pinned trust channel
      description: >-
        Channel auto-tracking, applied on demand (marketplace/1 MKT-090): the
        pack's own pinned trust channel and registry source are read off its
        newest install record (MKT-094) and re-resolved through that source's
        channel pointer — nothing about how the pack is re-resolved comes from
        this request, so a host never silently chooses a provenance tier
        (MKT-060a(b)) on the operator's behalf. A pack installed directly, with
        no trust channel pinned, is not auto-tracked and is refused rather than
        defaulted onto a channel (MKT-094a). If the currently applied version has
        itself been yanked, the check reverts to the most recent version this
        install previously applied that is still resolvable (MKT-093, the sole
        exception MKT-050 allows a resolved version to decrease under). A refused
        update writes nothing: the install transaction upserts, so the previously
        installed version, its bundle and its records are left intact. A mutating
        POST outside plain resource creation — accepts Idempotency-Key so a
        client's retry-on-timeout cannot run a second check.
      tags: [packs, "mcp:act"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: >-
            The update check's outcome. Shape stub, matching the rest of this
            surface — `action` is `unchanged`, `updated`, or `reverted`, with
            `from_version`/`to_version`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}/data/{collection}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - $ref: "#/components/parameters/PackCollectionParam"
    get:
      operationId: listPackRows
      summary: List the rows of a pack-declared collection
      description: >-
        Keyset-paginated over the collection's universal-envelope rows
        (manifest/1 MAN-051/052), scoped to the caller's visible set. No
        `selector`: the row envelope's labels are not yet exposed to the
        label-selector grammar on this collection.
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: A page of rows. Shape stub — the row schema is the pack's own declaration, not this document's.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPackRow
      summary: Create a row in a pack-declared collection
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "201":
          description: The created row. Shape stub — the row schema is the pack's own declaration.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /packs/{publisher}/{name}/data/{collection}/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/PackPublisherParam"
      - $ref: "#/components/parameters/PackNameParam"
      - $ref: "#/components/parameters/PackCollectionParam"
      - name: entity_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
    get:
      operationId: getPackRow
      summary: Read one row of a pack-declared collection
      tags: [packs, "mcp:read"]
      parameters:
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The row. Shape stub — the row schema is the pack's own declaration.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePackRow
      summary: Update one row of a pack-declared collection
      description: Partial update. Requires If-Match against the row's current ETag/revision.
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "200":
          description: The updated row. Shape stub — the row schema is the pack's own declaration.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deletePackRow
      summary: Delete one row of a pack-declared collection
      tags: [packs]
      parameters:
        - $ref: "#/components/parameters/IfMatchParam"
        - $ref: "#/components/parameters/TraceIdParam"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie issued by /auth/login. Mutating requests additionally require the platform's CSRF token.
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: "wv_<random>, scoped to a principal and role"
      description: API-key principal (user-issued or internal-service), presented as a bearer token.

  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a prior response's `cursor` field. Never constructed or parsed by the client.
      schema:
        $ref: "#/components/schemas/Cursor"
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum rows to return in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SelectorParam:
      name: selector
      in: query
      required: false
      description: >-
        A label-selector string: comma-separated, ANDed terms (equality,
        inequality, set-membership, set-exclusion, existence,
        non-existence, or a `scope_node subtree <ulid>` term). See
        `contracts/api-1.md#label-selector-grammar` for the full grammar.
      schema:
        type: string
        example: "kind=screen,env in (prod,staging),scope_node subtree 01J8Z2Q1M8H8N4T0V1W2X3Y4Z5"
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: The resource's current ETag, as last observed by the client. Required on every state-changing request against a mutable resource; no unconditional-overwrite path exists.
      schema:
        type: string
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated opaque replay key, scoped to (principal, method, path). Optional; strongly recommended on any POST a client might retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TraceIdParam:
      name: Trace-Id
      in: header
      required: false
      description: Caller-supplied trace ID (ULID- or UUID-class, 20-36 chars). A non-conforming value is discarded and replaced server-side; the request still proceeds.
      schema:
        $ref: "#/components/schemas/TraceId"

    PackPublisherParam:
      name: publisher
      in: path
      required: true
      description: >-
        The publisher half of a pack's `<publisher>/<name>` identity
        (manifest/1 MAN-001). It is its own path segment rather than half of
        one percent-encoded value, so a pack id is addressable without the
        client having to escape the slash inside it.
      schema:
        type: string

    PackNameParam:
      name: name
      in: path
      required: true
      description: The name half of a pack's `<publisher>/<name>` identity (manifest/1 MAN-001).
      schema:
        type: string

    PackCollectionParam:
      name: collection
      in: path
      required: true
      description: The name of a collection the pack's manifest declares (manifest/1 MAN-051).
      schema:
        type: string

  headers:
    ETag:
      description: Strong validator derived solely from the resource's `revision`. Present on every response representing a single mutable resource.
      required: true
      schema:
        type: string
        example: '"3"'
    TraceIdResponse:
      description: The trace ID that correlates this request across every component it touched — either the caller-supplied value (if it validated) or a freshly generated one.
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"

  # Note: the Deprecation (RFC 9745) and Sunset (RFC 8594) response headers
  # this contract's evolution policy uses (contracts/api-1.md, API-082) are
  # not modeled as reusable components here — nothing in this document is
  # deprecated yet, so there is no operation to attach them to without
  # faking a deprecation. contracts/api-1.md is their normative source; a
  # future minor wires them onto whichever operation first deprecates.

  responses:
    BadRequest:
      description: The request was malformed (validation failure, invalid selector, invalid cursor).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: >-
        The request body failed field-level validation
        (`contracts/api-1.md#error-shape`, API-013a: a body validation
        failure is 422, distinct from the 400 a query-parameter validation
        failure — e.g. an out-of-range `limit` — carries).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid principal was presented.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The principal is authenticated but not authorized for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No resource exists at this identifier.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The request cannot be applied against the resource's current state: an
        Idempotency-Key reused with a different body or still in progress, or a
        deletion refused because something still depends on the row.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match did not match the resource's current ETag.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: A state-changing request omitted the required If-Match header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The principal exceeded its rate limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >-
        The server or a dependency it needs is temporarily unable to serve
        the request (`code: UNAVAILABLE`) — for a device command, the target
        entity's relay has no live connection to carry it. Retryable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Ulid:
      type: string
      description: A 26-character Crockford-base32 identifier, lexicographically sortable by creation time.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["01J8Z3K4N5P6Q7R8S9T0V1W2X3"]

    TraceId:
      type: string
      description: A ULID- or UUID-class trace identifier, 20-36 characters, restricted charset.
      pattern: "^[A-Za-z0-9-]{20,36}$"
      examples: ["01J8Z3K4N5P6Q7R8S9T0V1W2X4"]

    Cursor:
      type: ["string", "null"]
      description: An opaque, URL-safe continuation token. `null` signals no further rows. Never constructed, parsed, or compared for meaning by a client.
      pattern: "^[A-Za-z0-9_-]+$"
      x-go-type: "*string"

    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: >-
        A resource-baseline timestamp: epoch MILLISECONDS, UTC — not an RFC
        3339 string. The store stamps `created_at`/`updated_at` on every row it
        writes as an integer millisecond count and returns that value
        unchanged, so this is what a client reads and what an export/apply
        round trip carries back. Deliberately not `format: date-time`: the two
        are not interchangeable, and a client that parsed one as the other
        would silently read 1970 for every resource on this surface.

        The `Job` resource is the one exception on this API and says so at its
        own `created_at`: a Job's timestamp is minted in Go as a `time.Time`
        and serialized RFC 3339, because a Job is not a stored row of this
        baseline.

    ValidationFieldError:
      type: object
      description: One field-level failure inside a VALIDATION_FAILED Problem's `errors` array.
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dot-path to the offending field in the request body, or the query-parameter name.
        code:
          type: string
        message:
          type: string

    Problem:
      type: object
      description: >-
        RFC 9457 problem+json, extended with `code` (this contract's
        machine-readable error registry) and `trace_id`. `code` is the
        discriminant a client asserts on; `title`/`detail` are for humans.
      required: [type, title, status, code, trace_id]
      additionalProperties: false
      properties:
        type:
          type: string
          const: "about:blank"
          description: Always "about:blank" in this version; `code` is the sole machine-readable discriminant api/v1 defines.
        title:
          type: string
          description: A short, human-readable summary of the error, constant per `code`.
        status:
          type: integer
          description: The HTTP status code, repeated here per RFC 9457.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request's own path, unmodified.
        code:
          $ref: "#/components/schemas/ErrorCode"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        errors:
          type: array
          description: Present only when `code` is VALIDATION_FAILED — one entry per failing field.
          items:
            $ref: "#/components/schemas/ValidationFieldError"
        current_revision:
          type: integer
          description: Present only when `code` is REVISION_CONFLICT — the resource's current revision, so the client can re-read and retry.
        second_factor:
          type: string
          enum: [totp]
          description: >-
            Present only on a 401 UNAUTHENTICATED from `login` where the
            presented password was accepted but the principal holds a
            second-factor credential the request did not satisfy
            (`security-model.md` SEC-004). It names the factor to collect and
            re-submit on the same operation. Deliberately ABSENT from every
            other refusal — including a wrong password, a wrong code, and a
            replayed code — so its absence discloses nothing about which of
            them occurred.
      examples:
        - type: "about:blank"
          title: "Not Found"
          status: 404
          detail: "No scope node exists with this identifier."
          instance: "/api/v1/scope-nodes/01J8Z3K4N5P6Q7R8S9T0V1W2X9"
          code: "NOT_FOUND"
          trace_id: "01J8Z3K4N5P6Q7R8S9T0V1W2X4"

    ErrorCode:
      type: string
      description: >-
        The stable, additive-only machine-readable error registry
        (`contracts/api-1.md#error-taxonomy`), plus the codes a sibling
        contract owns for operations that ride this same `/api/v1` binding.
        api/1's own registry governs API-011 for api/1's own rules; a sibling
        contract's Problem carries a `code` from ITS registry, by name — the
        same reuse-by-name discipline `player/1` PLY-007 applies. The trailing
        values below belong to sibling contracts: four to
        `security-model.md`'s Error taxonomy, appearing only on the `auth`
        operations; three to `data-model-1.md`'s, appearing only on the
        scope-node delete; and two to `marketplace-1.md`'s, appearing on the
        pack operations.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - REVISION_CONFLICT
        - IF_MATCH_REQUIRED
        - CURSOR_INVALID
        - SELECTOR_INVALID
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - EXTERNAL_ID_CONFLICT
        - ID_SERVER_ASSIGNED
        - RATE_LIMITED
        - INTERNAL
        - UNAVAILABLE
        - CREDENTIAL_LOCKED
        - GRANT_EXPIRED
        - GRANT_ALREADY_REDEEMED
        - GRANT_PURPOSE_MISMATCH
        - SCOPE_NODE_NOT_EMPTY
        - SCOPE_NODE_IN_USE
        - SCOPE_NODE_ORG_UNDELETABLE
        - MARKETPLACE_REF_INVALID
        - REQUIRED_PACK_FLOOR

    LoginRequest:
      type: object
      description: >-
        The credentials a login authenticates from (API-091 — carried in the
        BODY, never as a precondition session).
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: The login handle the `password` credential is registered under.
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
        totp_code:
          type: string
          description: >-
            The second-factor code (`security-model.md` SEC-004). Optional in
            SHAPE and mandatory in EFFECT for any principal holding a `totp`
            credential: such a login is refused without it, with the Problem's
            `second_factor` member naming the factor to collect, and the client
            re-calls this same operation carrying everything. There is no
            intermediate credential between the two calls — nothing is minted
            until both factors are satisfied.
          pattern: "^[0-9]{6}$"

    TotpEnrollment:
      type: object
      description: >-
        A pending TOTP enrollment's shared secret, returned exactly once by
        `enrollTotp`. Nothing here authenticates until `confirmTotp` arms it.
      required: [secret, otpauth_uri]
      additionalProperties: false
      properties:
        secret:
          type: string
          format: password
          description: The shared secret, RFC 4648 base32, uppercase and unpadded — the form an operator types into an authenticator app by hand.
        otpauth_uri:
          type: string
          description: The same secret as the `otpauth://totp/...` URI an authenticator app imports, usually by scanning it as a QR code.

    TotpConfirmRequest:
      type: object
      description: A code computed from the pending enrollment's secret, proving it reached an authenticator.
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          format: password
          pattern: "^[0-9]{6}$"

    TotpCredential:
      type: object
      description: >-
        The armed `totp` credential, in `security-model.md`'s own Credential
        wire shape — metadata only, never a raw secret value.
      required: [credential_id, principal_id, kind, created_at, revoked_sessions]
      additionalProperties: false
      properties:
        credential_id:
          $ref: "#/components/schemas/Ulid"
        principal_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          enum: [totp]
        created_at:
          type: integer
          format: int64
          description: Milliseconds since the Unix epoch, from the server's own clock.
        revoked_sessions:
          type: integer
          description: >-
            How many OTHER sessions and API keys of this principal arming the
            credential revoked. The calling session is never among them — it
            has just proven the new factor.

    ClaimRequest:
      type: object
      description: >-
        A first-boot claim (SEC-120): the one-time setup code, plus the
        credential the first owner is choosing.
      required: [code, identifier, password]
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            The one-time `setup`-purpose grant code the installer presented.
            At least 128 bits of entropy (SEC-032).
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    CredentialResetRequest:
      type: object
      description: >-
        Who is being reset. There is deliberately no credential-bearing
        member: SEC-050 says the issuing admin "MUST NOT be shown, and MUST
        have no path to choose, the credential value the target user
        eventually sets", and `additionalProperties: false` is what makes
        that a property of the wire rather than of a handler's discipline.
      required: [target_principal_id]
      additionalProperties: false
      properties:
        target_principal_id:
          type: string
          description: The `user` principal whose password credential is being reset.
          minLength: 1
        keep_existing_sessions:
          type: boolean
          default: false
          description: >-
            SEC-053's per-issuance opt-out. Redemption revokes every existing
            session and API-key credential of the target BY DEFAULT — which is
            what makes a post-takeover reset also evict whatever session an
            attacker was using — and this opts one single issuance out of it.
    CredentialResetHandoff:
      type: object
      description: >-
        What the issuing admin receives (SEC-050). Every member is an
        identifier or the one-time code itself; none is, or can become, the
        credential value the target eventually sets.
      required:
        [grant_id, code, target_principal_id, expires_at_ms, sessions_revoked_on_redemption]
      additionalProperties: false
      properties:
        grant_id:
          type: string
          description: The `credential-reset`-purpose grant this issuance minted.
        code:
          type: string
          description: >-
            The one-time code, returned exactly once and recoverable from
            nowhere else — the grant row stores only its hash (SEC-051). It
            identifies a grant; it is not itself a rendered credential.
        target_principal_id:
          type: string
          description: >-
            Echoed back so an admin can confirm they reset the account they
            meant to.
        expires_at_ms:
          type: integer
          format: int64
          description: When the code stops being redeemable (SEC-032, ~15 minutes).
        sessions_revoked_on_redemption:
          type: boolean
          description: >-
            Whether redemption will apply SEC-053's revoke-everything default,
            so the admin sees which of the two behaviours their issuance chose.
    CredentialResetRedeemRequest:
      type: object
      description: >-
        The one-time code the target was handed, and the credential value THEY
        choose (SEC-050).
      required: [code, password]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The one-time `credential-reset`-purpose grant code.
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    SessionSummary:
      type: object
      description: >-
        The caller's own session. It deliberately carries NO session token:
        that value rides the HttpOnly cookie and is never readable by the
        page. `csrf_token` is present only on the responses that MINT a
        session (login, claim), since it is the double-submit value the client
        must then echo (SEC-024).
      required: [principal_id, kind, role, aal, session_id]
      additionalProperties: false
      properties:
        principal_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          description: The principal kind (`security-model.md` SEC-001).
          enum: [user, screen, relay, pack-service, ingest-token, system-console]
        role:
          type: string
          description: The effective role this principal holds (`security-model.md` SEC-010).
          enum: [owner, admin, operator, viewer]
        aal:
          type: string
          description: >-
            Authenticator Assurance Level (SEC-021/022). A `recovery` session
            is minted by redeeming a recovery-purpose grant and is restricted
            until the target principal completes TOTP re-enrolment.
          enum: [standard, recovery]
        session_id:
          $ref: "#/components/schemas/Ulid"
        csrf_token:
          type: string
          description: >-
            The double-submit CSRF token, returned only when this response
            minted the session. Echo it in `X-CSRF-Token` on every mutating
            request (SEC-024).

    ScopeNode:
